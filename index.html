  // ── 機制 / 題材共現 ────────────────────────────────────────────────────────────
  function renderCooccur(body){
    const warn=mk('div','sa-cooccur-warning');
    warn.textContent='此區只代表資料中的共現現象，不代表該機制或題材會導致高分 / 低分。仍需搭配遊戲實際規則、演出、數學設計與年份判斷。';
    body.appendChild(warn);

    function buildMap(keyFn){
      const m={};
      enriched.forEach(g=>{
        (keyFn(g)||[]).forEach(k=>{
          if(!k||k.length>80)return;
          if(!m[k])m[k]={name:k,count:0,cgn80:0,sc80:0,bwb80:0,divCount:0};
          m[k].count++;
          if(g.cgn100!=null&&g.cgn100>=80)m[k].cgn80++;
          if(g.sc100!=null&&g.sc100>=80)m[k].sc80++;
          if(g.bwb100!=null&&g.bwb100>=80)m[k].bwb80++;
          if(g.scoreGap!=null&&g.scoreGap>=25)m[k].divCount++;
        });
      });
      return Object.values(m).sort((a,b)=>b.count-a.count);
    }

    const mechList=buildMap(g=>g.mechanics);
    const themeList=buildMap(g=>g.themes);

    function coTable(items,title,minCnt){
      const filtered=items.filter(m=>m.count>=minCnt).slice(0,30);
      if(!filtered.length)return null;
      const wrap=mk('div','card');wrap.style.marginBottom='16px';
      const ttl=mk('div','ct');ttl.style.marginBottom='8px';ttl.textContent=title;wrap.appendChild(ttl);
      const tbl=mk('div','sa-co-table');
      tbl.innerHTML=`<div class="sa-co-header"><span>名稱</span><span>遊戲數</span><span>高CGN</span><span>高SC</span><span>高BWB</span><span>分歧</span><span>樣本可信度</span></div>`;
      filtered.forEach(m=>{
        const conf=m.count>=30?{t:'高',c:'var(--gn)'}:m.count>=10?{t:'中（偏低）',c:'var(--am)'}:{t:'低樣本觀察',c:'var(--rd)'};
        const row=mk('div','sa-co-row');
        row.innerHTML=`<span class="sa-co-name">${m.name}</span><span>${m.count}</span><span style="color:var(--am)">${m.count?Math.round(m.cgn80/m.count*100)+'%':'—'}</span><span style="color:var(--bl)">${m.count?Math.round(m.sc80/m.count*100)+'%':'—'}</span><span style="color:var(--gn)">${m.count?Math.round(m.bwb80/m.count*100)+'%':'—'}</span><span style="color:var(--rd)">${m.divCount}</span><span style="color:${conf.c};font-size:11px">${conf.t}</span>`;
        tbl.appendChild(row);
      });
      wrap.appendChild(tbl);
      return wrap;
    }

    const m30=coTable(mechList,'高分遊戲常見機制（樣本 ≥ 30）',30);if(m30)body.appendChild(m30);
    const m10=coTable(mechList.filter(m=>m.count>=10&&m.count<30),'機制共現觀察（樣本 10–29）',10);if(m10)body.appendChild(m10);

// ── Game Discovery ───────────────────────────────────────────────────────────
(function(){

  s.innerHTML=`

    </div>
    <div id="gd-panel-research"></div>
    <div id="gd-panel-year" style="display:none"></div>
    <div id="gd-panel-source" style="display:none"></div>
    <div id="gd-panel-series" style="display:none"></div>
    <div id="gd-panel-table" style="display:none"></div>`;

  // ── Helpers ───────────────────────────────────────────────────────────────
  // fmtSrc/fmtSrcNum are now global (Phase 6A, see top of script) — reused
  // here rather than redeclared.

  // Provider counts
  const provCounts={};
  D.games.forEach(g=>{provCounts[g.provider]=(provCounts[g.provider]||0)+1;});
  const BIG_PROVIDERS=new Set(Object.keys(provCounts).filter(p=>provCounts[p]>=100));

  // Research priority (internal sort only, not a quality score)
  function researchPriority(g){
    let sc=0;const yr=g.year||0;
    if(yr>=2025)sc+=30;else if(yr>=2023)sc+=15;else if(yr>=2021)sc+=5;
    if(g.cgscore!=null)sc+=Math.min(g.cgscore*0.25,25);
    const bwb=fmtSrcNum(g.bwb_rating);if(bwb!=null)sc+=Math.min(bwb*0.15,15);
    if((g.mechanics||[]).length>=3)sc+=5;
    const mw=parseFloat(g.max_win);if(mw>=5000)sc+=5;
    return sc;
  }

  // Series candidate detection via name patterns
  const SER_RE=/\b(2|3|4|5|ii|iii|iv|v|deluxe|ultimate|megaways|xways|xnudge|gigablox|powerblocks|christmas|xmas|halloween|revenge|respin|reloaded|turbo|extreme|xtreme|grande|ultra|mega|super|bonus|special|dark|legacy|reborn|remix|redux|power|king|queen|blast|fury|inferno|epic|jackpot|dream|infinity|fortune|popwins|hd)\b/i;
  const SER_KEYS=['book of','dog house','big bass','gates of olympus','sweet bonanza','fire in the hole','tombstone','le bandit','reactoonz','mental','sugar rush','starlight','crystal','thunder'];
  function isSeriesCandidate(name){
    if(SER_RE.test(name))return true;
    const low=name.toLowerCase();
    return SER_KEYS.some(k=>low.includes(k));
  }
  function seriesBase(name){
    return name.toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(SER_RE,'').replace(/\s+/g,' ').trim();
  }

  // Provider diversity: max provMax per provider
  function topNDiverse(arr,n,provMax){
    provMax=provMax||2;const cnt={};const res=[];
    for(const g of arr){const p=g.provider||'?';cnt[p]=(cnt[p]||0)+1;if(cnt[p]<=provMax)res.push(g);if(res.length>=n)break;}
    return res;
  }

  // Auto-generate research reasons for a game
  function researchReasons(g){
    const tags=[];const yr=g.year||0;
    if(yr>=2025)tags.push('近期新作');else if(yr===2024)tags.push('2024年作品');
    if(g.cgscore>=88)tags.push('CGN 高數值');
    const bwbN=fmtSrcNum(g.bwb_rating);
    if(bwbN!=null&&bwbN>=80)tags.push('BWB 高評價');else if(bwbN!=null&&bwbN>=65)tags.push('BWB 好評');
    const mw=parseFloat(g.max_win);
    if(mw>=20000)tags.push('超高倍率 '+g.max_win+'x');else if(mw>=10000)tags.push('高倍率 '+g.max_win+'x');
    const SMECHS=['Cluster Pays','Megaways','xNudge','xWays','Bonus Buy','Cascading','Colossal','Expanding','Popwins','Inferno'];
    const fm=(g.mechanics||[]).find(m=>SMECHS.some(s=>m.toLowerCase().includes(s.toLowerCase())));
    if(fm)tags.push(fm.length>18?fm.slice(0,16)+'…':fm);
    const STHEMES=['Horror','Crime','Dark','Chaos','Anime','Music','Mythology','Adventure'];
    const ftIdx=(g.themes_raw||g.themes||[]).findIndex(t=>STHEMES.some(s=>t.toLowerCase().includes(s.toLowerCase())));
    const ft=ftIdx>=0?(g.themes||g.themes_raw)[ftIdx]:null;
    if(ft)tags.push(ft+' 題材');
    if(!BIG_PROVIDERS.has(g.provider)&&provCounts[g.provider]<30&&(g.cgscore>=78||(bwbN&&bwbN>=65)))tags.push('中小廠高潛力');
    if(isSeriesCandidate(g.name))tags.push('系列候選');
    const scN=fmtSrcNum(g.sc_rating);
    if(scN!=null&&scN>=88&&(bwbN==null||bwbN<50))tags.push('高曝光待驗證');
    return tags.slice(0,4);
  }

  // Compact top-10 list (row style)
  function top10List(games,opts){
    opts=opts||{};const ul=mk('ul','gd-top10-list');
    if(!games.length){const li=mk('li');li.style.cssText='padding:12px 4px;color:var(--txd);font-size:13px';li.textContent='（目前資料不足）';ul.appendChild(li);return ul;}

      ul.appendChild(li);

  }

  // ── Pre-compute fixed lists ───────────────────────────────────────────────
  const baseAll=D.games;

  // 近期值得研究 (2024+, at least one score source)
  const recentTop=topNDiverse(

  // BWB 高評價
  const bwbTop=topNDiverse(
    baseAll.filter(g=>g.bwb_rating!=null)

  // 高曝光待驗證 (high SC but low/no BWB)
  const highExpTop=topNDiverse(

      .sort(function(a,b){return(fmtSrcNum(b.sc_rating)||0)-(fmtSrcNum(a.sc_rating)||0);}),10);

  // 非大廠高潛力 (exclude big studios, year>=2023)
  const indieTop=topNDiverse(

  function renderTable(){
    const q=(qs('#gsq')?.value||'').toLowerCase();
    const yf=qs('#gyf')?.value||'',pf=qs('#gpf')?.value||'',sf=qs('#gsf')?.value||'';
    const ef=qs('#gef')?.value||'',sk=qs('#gso')?.value||'priority';
    const hasBwb=qs('#gd-hb')?.checked,hasSc=qs('#gd-hs')?.checked;
    const serOnly=qs('#gd-so')?.checked,exclBig=qs('#gd-eb')?.checked,recent3=qs('#gd-r3')?.checked;

    let gs=baseAll.filter(g=>{
      if(researchMode&&!passResearch(g))return false;
      if(yf&&String(g.year)!==yf)return false;
      if(pf&&g.provider!==pf)return false;
      if(sf&&g.source!==sf)return false;
      if(ef&&g.ecosystem!==ef)return false;
      if(hasBwb&&g.bwb_rating==null)return false;
      if(hasSc&&g.sc_rating==null)return false;
      if(serOnly&&!isSeriesCandidate(g.name))return false;
      if(exclBig&&BIG_PROVIDERS.has(g.provider))return false;
      if(recent3&&(g.year||0)<2024)return false;
      if(q){const h=[g.name,g.provider,g.ecosystem,...(g.mechanics||[]),...(g.themes||[]),...(g.themes_raw||[])].join(' ').toLowerCase();if(!h.includes(q))return false;}
      return true;
    });

    gs.sort((a,b)=>{
      if(sk==='priority')return researchPriority(b)-researchPriority(a);
      if(sk==='sc_rating')return((fmtSrcNum(b.sc_rating)||0)-(fmtSrcNum(a.sc_rating)||0))*sd;
      if(sk==='bwb_rating')return((fmtSrcNum(b.bwb_rating)||0)-(fmtSrcNum(a.bwb_rating)||0))*sd;
      let av=a[sk]??'',bv=b[sk]??'';
      if(['cgscore','year','max_win'].includes(sk)){av=parseFloat(av)||0;bv=parseFloat(bv)||0;}
      return(typeof av==='number'?(av-bv):(String(av).localeCompare(String(bv))))*sd;
    });

    _gbAllFiltered=gs;
    const show=gs.slice(0,200);
    const tb=qs('#gtb');if(!tb)return;
    tb.innerHTML='';

    show.forEach(g=>{
      const tr=mk('tr');
      const reasons=researchReasons(g);
      const rHtml=reasons.slice(0,3).map(r=>`<span class="gc-reason">${r}</span>`).join('')||'<span style="color:var(--txd);font-size:11px">—</span>';
      const mt=(g.mechanics||[]).slice(0,2).map(m=>`<span class="tag tm" style="font-size:11px;padding:2px 5px">${m}</span>`).join('')||'<span style="color:var(--txd)">—</span>';
      const serTag=isSeriesCandidate(g.name)?'<span style="color:var(--vi);font-size:11px;font-weight:700">系列</span>':'<span style="color:var(--txd);font-size:11px">—</span>';
      tr.innerHTML=`<td>${g.name}</td><td style="font-size:13px">${g.provider||'—'}</td>`
        +`<td style="font-variant-numeric:tabular-nums">${g.year||'—'}</td>`
        +`<td style="padding:6px 8px">${rHtml}</td>`
        +`<td style="color:var(--am);font-variant-numeric:tabular-nums;text-align:right">${g.cgscore!=null?g.cgscore.toFixed(0):'—'}</td>`
        +`<td style="color:var(--bl);font-variant-numeric:tabular-nums;text-align:right">${fmtSrc(g.sc_rating)}</td>`
        +`<td style="color:#e96f6f;font-variant-numeric:tabular-nums;text-align:right">${fmtSrc(g.bwb_rating)}</td>`
        +`<td style="padding:4px 8px">${mt}</td><td>${serTag}</td>`
        +`<td style="text-align:center;padding:4px;white-space:nowrap"></td>`;

      const actCell=tr.lastElementChild;
      const addBtn=mk('button','wl-add'+(wlHas(g.name)?' added':''));
      addBtn.textContent=wlHas(g.name)?'✓':'加入';addBtn.title='加入研究板';
      addBtn.onclick=e=>{e.stopPropagation();
        if(wlHas(g.name)){wlRemove(g.name);addBtn.textContent='加入';addBtn.classList.remove('added');}
        else wlShowAddModal(g,added=>{if(added){addBtn.textContent='✓';addBtn.classList.add('added');}});};
      actCell.appendChild(addBtn);

      // Phase 6A: was an inline-expandable <tr class="gd-drawer"> built here
      // (depended on this row's own DOM via insertAdjacentElement/
      // nextElementSibling, so it couldn't be opened from anywhere else).
      // Now opens the shared Game Detail modal instead — single source of
      // truth, callable from Monthly Drilldown and any future caller too.
      const detBtn=mk('button','gc-btn');detBtn.textContent='詳情';detBtn.style.cssText='margin-left:4px;font-size:11px;padding:2px 6px';
      detBtn.onclick=e=>{e.stopPropagation();window.openGameDetail(g.id);};
      actCell.appendChild(detBtn);
      tb.appendChild(tr);
    });

    if(qs('#gc'))qs('#gc').textContent=`顯示 ${show.length} / ${gs.length} 筆${gs.length<baseAll.length?' （共 '+baseAll.length.toLocaleString()+' 筆）':''}`;
  }

  // ── Tab switching ─────────────────────────────────────────────────────────
  const defaultYr=allYears[0]||2025;
  qsa('#gd-tabs .gd-tab').forEach(btn=>{
    btn.addEventListener('click',()=>{
      qsa('#gd-tabs .gd-tab').forEach(b=>b.classList.remove('on'));btn.classList.add('on');
      const t=btn.dataset.t;
      ['research','year','source','series','table'].forEach(id=>{
        qs('#gd-panel-'+id).style.display=id===t?'':'none';
      });
      if(t==='year')renderYearTab(defaultYr);
      if(t==='source')renderSourceTab();
      if(t==='series')renderSeriesTab();
      if(t==='table')buildTableTab();
    });
  });

  // ── Initial render ────────────────────────────────────────────────────────
  renderResearchTab();
})();

(function(){

  const ECO_ACCENT={'Independent':'var(--am)','Hacksaw OpenRGS':'var(--am)','Yggdrasil Masters':'var(--bl)','Relax Silver Bullet':'var(--vi)','Unknown':'var(--txd)'};
  const ECO_SHORT={'Independent':'獨立廠商','Hacksaw OpenRGS':'Hacksaw OpenRGS','Yggdrasil Masters':'YGG Masters','Relax Silver Bullet':'Relax SB','Unknown':'未確認'};

  const ecoMap={},provMap={};
  D.games.forEach(g=>{
    const eco=g.ecosystem||'Unknown';
    if(!ecoMap[eco])ecoMap[eco]={name:eco,games:[],studios:new Set(),years:{},mechs:{},themes:{},needsCheck:0,smallStudio:0};
    const em=ecoMap[eco];
    em.games.push(g);
    if(g.provider){
      em.studios.add(g.provider);
      if(!provMap[g.provider])provMap[g.provider]=[];
      provMap[g.provider].push(g);
    }
    const yr=g.year?String(g.year):null;
    if(yr&&yr!=='null')em.years[yr]=(em.years[yr]||0)+1;
    (g.mechanics||[]).forEach(m=>{if(m)em.mechs[m]=(em.mechs[m]||0)+1;});
    (g.themes||[]).forEach(t=>{if(t)em.themes[t]=(em.themes[t]||0)+1;});
    if(g.needs_ecosystem_check)em.needsCheck++;
    if(g.is_small_studio_candidate)em.smallStudio++;
  });
  Object.values(ecoMap).forEach(em=>{
    em.studios=[...em.studios].sort();
    em.gameCount=em.games.length;
    em.studioCount=em.studios.length;
  });
  const ecoOrder=[...KNOWN_ECOS.filter(e=>ecoMap[e]),...Object.keys(ecoMap).filter(e=>!KNOWN_ECOS.includes(e))];

  // ── Helpers ──────────────────────────────────────────────────────────────
  function calcGrowth(em){
    const yrs=Object.keys(em.years).map(Number).filter(y=>!isNaN(y)).sort();
    if(!yrs.length||em.gameCount<5)return{label:'資料不足',color:'var(--txd)'};
    const mx=Math.max(...yrs);
    const recent=(em.years[String(mx)]||0)+(em.years[String(mx-1)]||0);
    const prior=(em.years[String(mx-2)]||0)+(em.years[String(mx-3)]||0);
    if(recent===0)return{label:'可能停滯',color:'var(--rd)'};
    if(recent<5)return{label:'低量觀察',color:'var(--txm)'};
    if(prior===0||recent/(prior||1)>1.5)return{label:'高速擴張',color:'var(--gn)'};
    return{label:'穩定活躍',color:'var(--bl)'};
  }
  function researchVal(n){if(n==='Independent')return{label:'低',color:'var(--txd)'};return{label:'高',color:n==='Unknown'?'var(--rd)':'var(--am)'};}
  function ecoConfLabel(n){
    const byProv=D.eco_by_provider[n]||[];
    if(n==='Unknown')return{label:'待人工確認',color:'var(--rd)'};
    const confirmed=byProv.filter(p=>p.ecosystem_confidence==='Confirmed').length;
    const inferred=byProv.filter(p=>p.ecosystem_confidence==='Inferred').length;
    if(confirmed>0)return{label:'高',color:'var(--gn)'};
    if(inferred>0)return{label:'中（推斷）',color:'var(--am)'};
    return{label:'低',color:'var(--txd)'};
  }

  function shortName(n){return ECO_SHORT[n]||n;}
  function getMappingCounts(){

      inferred:all.filter(p=>p.ecosystem_confidence==='Inferred').length,

  <div class="eco-concept-def"><div class="eco-concept-term">RGS（Remote Gaming Server）</div><div class="eco-concept-desc">提供技術平台讓小型 studio 接入賭場。例：Hacksaw OpenRGS、Yggdrasil Masters、Relax Silver Bullet。</div></div>
  <div class="eco-concept-def"><div class="eco-concept-term">Publisher / Aggregator</div><div class="eco-concept-desc">整合多個 studio 遊戲、協助接入賭場平台的中間商。有時兼任 RGS。</div></div>

  s.appendChild(conceptBox);

  [{key:'overview',label:'生態系總覽'},{key:'network',label:'RGS / Publisher 網絡'},{key:'studios',label:'Studio 分布'},{key:'growth',label:'近年擴張'},{key:'prefs',label:'機制 / 題材偏好'},{key:'pending',label:'待確認資料'}].forEach((t,i)=>{

<div class="eco-status-note">目前 RGS / Publisher mapping 尚未建立完整，因此本頁主要用途是辨識資料缺口與建立人工校正清單。</div>

</div>
</div>`;
    const sw=mk('div','');sw.innerHTML=statusHtml;bodyDiv.appendChild(sw);

      card.addEventListener('click',()=>{
        listDiv.querySelectorAll('.eco-card').forEach(c=>c.classList.remove('eco-card-selected'));

  function renderEcoDetail(ecoName,em,panel,ac,growth,rv,conf){
    const byProv=D.eco_by_provider[ecoName]||[];
    const topMechs=Object.entries(em.mechs).sort((a,b)=>b[1]-a[1]).slice(0,8);
    const yrs=Object.keys(em.years).filter(y=>y&&y!=='null').sort();
    let html=`<div class="eco-detail-title">${shortName(ecoName)}</div><div class="eco-detail-sub">${ecoName}</div>`;
    html+=`<div class="eco-detail-badges"><span class="eco-growth-badge" style="color:${growth.color};background:${growth.color}1a">${growth.label}</span><span class="eco-conf-badge" style="color:${conf.color};background:${conf.color}1a">資料信心：${conf.label}</span><span class="eco-rv-badge" style="color:${rv.color};background:${rv.color}1a">研究價值：${rv.label}</span></div>`;
    html+=`<div class="eco-detail-stats"><div class="eco-detail-stat"><div class="eco-dstat-val" style="color:${ac}">${em.gameCount.toLocaleString()}</div><div class="eco-dstat-key">款遊戲</div></div><div class="eco-detail-stat"><div class="eco-dstat-val">${em.studioCount}</div><div class="eco-dstat-key">個廠商</div></div></div>`;
    if(byProv.length){
      html+=`<div class="eco-detail-section">主要廠商（按遊戲數）</div>`;
      const maxC=byProv[0].count||1;
      byProv.slice(0,10).forEach(p=>{
        const cC=p.ecosystem_confidence==='Confirmed'?'var(--gn)':p.ecosystem_confidence==='Inferred'?'var(--am)':'var(--txd)';
        const cL=p.ecosystem_confidence==='Confirmed'?'★':p.ecosystem_confidence==='Inferred'?'≈':'?';
        const dTag=p.is_demo?'<span class="eco-demo-tag">DEMO</span>':'';
        html+=`<div class="eco-prov-row"><div class="eco-prov-name">${p.provider}${dTag}</div><span style="font-size:10px;color:${cC}" title="${p.ecosystem_confidence||''}">${cL}</span><div class="eco-prov-bar"><div class="eco-prov-bar-fill" style="width:${p.count/maxC*100}%;background:${ac}"></div></div><div class="eco-prov-count">${p.count}</div></div>`;
      });
      if(byProv.length>10)html+=`<div class="eco-more">…還有 ${byProv.length-10} 個廠商</div>`;
    }
    if(topMechs.length){
      html+=`<div class="eco-detail-section">常用機制（前8）</div>`;
      const maxM=topMechs[0][1];
      topMechs.forEach(([m,c])=>{html+=`<div class="eco-prov-row"><div class="eco-prov-name">${m}</div><div class="eco-prov-bar"><div class="eco-prov-bar-fill" style="width:${c/maxM*100}%;background:var(--vi)"></div></div><div class="eco-prov-count">${c}</div></div>`;});
    }
    if(yrs.length>1){
      const ySlice=yrs.slice(-8),maxYC=Math.max(...ySlice.map(y=>em.years[y]||0),1);
      html+=`<div class="eco-detail-section">年度遊戲數</div><div class="eco-year-trend">`;
      ySlice.forEach(yr=>{
        const h=Math.max(2,Math.round((em.years[yr]||0)/maxYC*40));
        html+=`<div class="eco-year-bar"><div class="eco-year-bar-fill" style="height:${h}px;background:${ac}"></div><div class="eco-year-label">${yr.slice(2)}</div></div>`;
      });
      html+=`</div>`;
    }
    if(ecoName==='Unknown'||em.needsCheck>0){
      const pList=byProv.slice(0,15).map(p=>`- ${p.provider}（${p.count} 款遊戲）`).join('\n');
      const prompt=`## 生態系研究：${ecoName}\n\n廠商數：${em.studioCount} · 遊戲數：${em.gameCount}\n\n請協助確認以下廠商的發行生態系（RGS平台、Publisher、或獨立發行）：\n${pList}\n\n對於每個廠商，請說明：\n1. 主要使用的 RGS 平台或 Publisher\n2. 是否有官方說明或業界報導可以確認？\n3. 建議的 ecosystem 分類（Independent / Hacksaw OpenRGS / Yggdrasil Masters / Relax Silver Bullet / 其他）`;
      html+=`<div class="eco-detail-section">研究提示詞</div><button class="eco-copy-btn" data-prompt="${prompt.replace(/"/g,'&quot;').replace(/\n/g,'&#10;')}">複製研究提示詞</button>`;
    }
    panel.innerHTML=html;
    const btn=panel.querySelector('.eco-copy-btn');
    if(btn){btn.addEventListener('click',()=>{navigator.clipboard.writeText(btn.dataset.prompt.replace(/&quot;/g,'"').replace(/&#10;/g,'\n')).catch(()=>{});btn.textContent='已複製';setTimeout(()=>{btn.textContent='複製研究提示詞';},2000);});}
  }

    ['Hacksaw OpenRGS','Yggdrasil Masters','Relax Silver Bullet'].forEach(rgsName=>{

  // ── Tab 4: 近年擴張 ─────────────────────────────────────────────────────
  function renderGrowth(){
    const allYrSet=new Set();
    ecoOrder.forEach(e=>{if(ecoMap[e])Object.keys(ecoMap[e].years).forEach(y=>{if(y&&y!=='null')allYrSet.add(y);});});
    const sortedYrs=[...allYrSet].sort().slice(-8);
    let html=`<div class="eco-growth-intro">每個生態系近年的遊戲發行數量趨勢。成長狀態以最近兩年 vs 前兩年相比計算（資料來自 D.games 的 release_year）。</div>`;
    html+=`<div class="eco-growth-table"><div class="eco-growth-hdr"><div class="eco-growth-name">生態系</div>${sortedYrs.map(y=>`<div class="eco-growth-yr">${y}</div>`).join('')}<div class="eco-growth-status">成長</div></div>`;
    ecoOrder.forEach(ecoName=>{
      const em=ecoMap[ecoName];if(!em||em.gameCount<2)return;
      const ac=accent(ecoName),growth=calcGrowth(em);
      const yVals=sortedYrs.map(y=>em.years[y]||0),maxYC=Math.max(...yVals,1);
      html+=`<div class="eco-growth-row"><div class="eco-growth-name" style="color:${ac}">${shortName(ecoName)}</div>`;
      yVals.forEach(cnt=>{const pct=cnt/maxYC*100;html+=`<div class="eco-growth-cell"><div class="eco-growth-bar" style="width:${pct}%;background:${ac}"></div><span>${cnt||''}</span></div>`;});
      html+=`<div class="eco-growth-status"><span style="color:${growth.color}">${growth.label}</span></div></div>`;
    });
    html+=`</div><div class="eco-growth-legend"><div class="eco-legend-item"><span style="color:var(--gn)">■</span> 高速擴張</div><div class="eco-legend-item"><span style="color:var(--bl)">■</span> 穩定活躍</div><div class="eco-legend-item"><span style="color:var(--txm)">■</span> 低量觀察</div><div class="eco-legend-item"><span style="color:var(--rd)">■</span> 可能停滯</div><div class="eco-legend-item"><span style="color:var(--txd)">■</span> 資料不足</div></div>`;
    bodyDiv.innerHTML=html;
  }

      const em=ecoMap[ecoName],ac=accent(ecoName);

      const topThemes=Object.entries(em.themes).sort((a,b)=>b[1]-a[1]).slice(0,6);

      h+=`</div>`;card.innerHTML=h;bodyDiv.appendChild(card);

  // ── Tab 6: 待確認資料 ────────────────────────────────────────────────────
  function renderPending(){
    const unknownProvs=D.eco_by_provider['Unknown']||[];
    const mc=getMappingCounts();
    const unknownGames=ecoMap['Unknown']?.gameCount||0;

    // Mapping status block
    let html=`<div class="eco-mapping-status">
<div class="eco-ms-title">Mapping 狀態</div>
<div class="eco-ms-grid">
  <div class="eco-ms-item"><span class="eco-ms-badge eco-ms-confirmed">★ 已確認</span><span class="eco-ms-count">${mc.confirmed} 廠商</span></div>
  <div class="eco-ms-item"><span class="eco-ms-badge eco-ms-inferred">≈ 推定</span><span class="eco-ms-count">${mc.inferred} 廠商</span></div>
  <div class="eco-ms-item"><span class="eco-ms-badge eco-ms-unknown">? Unknown / 待確認</span><span class="eco-ms-count">${mc.unknown} 廠商</span></div>
  <div class="eco-ms-item"><span class="eco-ms-badge eco-ms-small">小型廠商候選</span><span class="eco-ms-count">${mc.smallStudio} 廠商</span></div>
  <div class="eco-ms-item"><span class="eco-ms-badge eco-ms-hiprio">高優先補查（≥10款）</span><span class="eco-ms-count">${mc.highPrio} 廠商</span></div>
</div>
</div>`;
    html+=`<div class="eco-pending-intro">以下廠商的 ecosystem 尚未確認（共 ${unknownProvs.length} 個廠商 · ${unknownGames.toLocaleString()} 款遊戲）。<br>確認後請更新 <code style="color:var(--am)">MANUAL_ECOSYSTEM_MAP</code> 或 <code style="color:var(--am)">_KNOWN_INDEPENDENT</code>，然後重新產生 dashboard。<br><small style="color:var(--txd)">代表遊戲 / 近3年款數來自瀏覽器樣本（非全量），僅供參考。</small></div>`;

    const highPrio=unknownProvs.filter(p=>p.count>=10).sort((a,b)=>b.count-a.count);
    const midPrio=unknownProvs.filter(p=>p.count>=3&&p.count<10).sort((a,b)=>b.count-a.count);
    const lowPrio=unknownProvs.filter(p=>p.count<3);

    function buildProvStats(p){
      const games=provMap[p.provider]||[];
      const yrs=games.map(g=>g.year).filter(y=>y&&y!=='null'&&!isNaN(Number(y))).map(Number).sort((a,b)=>b-a);
      const latestYr=yrs[0]||null;
      const recentGames=games.filter(g=>g.year&&Number(g.year)>=CUR_YR-2);
      const sorted=[...games].sort((a,b)=>(b.cgscore||0)-(a.cgscore||0));
      const repGames=sorted.slice(0,3).map(g=>g.name).filter(Boolean);
      const issues=['缺少 RGS / Publisher mapping'];
      if(p.count<20)issues.push('小型 studio（< 20 款）');
      if(latestYr&&latestYr<CUR_YR-2)issues.push(`近年無新作（最新：${latestYr}）`);
      if(p.count>=50)issues.push('遊戲數多但未確認 — 可能漏收已知 studio');
      return{latestYr,recentCount:recentGames.length,repGames,issues};
    }

    function workRow(p){
      const st=buildProvStats(p);
      const repStr=st.repGames.length?st.repGames.join('、'):'（瀏覽器樣本中無資料）';
      const prompt=`請幫我查證以下 Slot provider 的發行生態系：\n\nProvider：${p.provider}\n遊戲數：${p.count}${st.latestYr?`\n最新作品年份：${st.latestYr}`:''}\n代表遊戲：${repStr}\n\n請確認：\n1. 它是獨立 studio、Publisher、RGS 使用者，還是 Aggregator 底下 studio？\n2. 是否使用 Hacksaw OpenRGS / Yggdrasil Masters / Relax Silver Bullet / 其他平台？\n3. 官方網站或公開資料是否能支持？\n4. 建議填入 MANUAL_ECOSYSTEM_MAP 的值是什麼？\n5. 信心等級：已確認 / 推定 / 待人工確認\n\n請用繁體中文回答。`;
      return`<div class="eco-work-row">
<div class="eco-wr-main">
  <div class="eco-wr-name">${p.provider}${p.is_small_studio?'<span class="eco-pend-tag" style="margin-left:6px">小廠</span>':''}</div>
  <div class="eco-wr-meta"><span class="eco-wr-count">${p.count} 款</span>${st.recentCount>0?`<span class="eco-wr-recent">近3年 ${st.recentCount} 款</span>`:''}<span class="eco-wr-yr">${st.latestYr?`最新：${st.latestYr}`:'年份未知'}</span></div>
  ${st.repGames.length?`<div class="eco-wr-games">代表遊戲：${st.repGames.map(n=>`<span class="eco-wr-game">${n}</span>`).join('')}</div>`:''}
  <div class="eco-wr-issues">${st.issues.map(i=>`<span class="eco-wr-issue">⚠ ${i}</span>`).join('')}</div>
  <div class="eco-wr-steps"><span class="eco-wr-step">查官方網站</span><span class="eco-wr-step">查 SlotCatalog provider 頁</span><span class="eco-wr-step">查遊戲規則頁</span><span class="eco-wr-step">加入 MANUAL_ECOSYSTEM_MAP</span></div>
</div>
<button class="eco-wr-copy" data-prompt="${prompt.replace(/"/g,'&quot;').replace(/\n/g,'&#10;')}">複製查證 Prompt</button>
</div>`;
    }

    if(highPrio.length){html+=`<div class="eco-pending-section">高優先度（≥ 10 款遊戲，${highPrio.length} 廠）</div>`;highPrio.forEach(p=>{html+=workRow(p);});}
    if(midPrio.length){
      html+=`<div class="eco-pending-section">中優先度（3–9 款，${midPrio.length} 廠）</div>`;
      midPrio.slice(0,25).forEach(p=>{html+=workRow(p);});
      if(midPrio.length>25)html+=`<div class="eco-more">…還有 ${midPrio.length-25} 個廠商（省略）</div>`;
    }
    if(lowPrio.length)html+=`<div class="eco-pending-section" style="color:var(--txd)">低優先度（&lt; 3 款，${lowPrio.length} 廠商）— 省略列表</div>`;
    const pList=highPrio.slice(0,15).map(p=>`- ${p.provider}（${p.count} 款遊戲）`).join('\n');
    const batchPrompt=`## 廠商生態系批量研究\n\n以下 ${Math.min(15,highPrio.length)} 個高優先廠商（≥ 10 款遊戲）需要確認其發行生態系：\n${pList}\n\n對於每個廠商，請回答：\n1. 主要使用的 RGS 平台（Hacksaw OpenRGS / Yggdrasil Masters / Relax Silver Bullet / 其他 / 獨立）\n2. 信心來源（官網、業界報導、無資料）\n3. 建議的 ecosystem 分類`;
    html+=`<div class="eco-pending-section">批量研究提示詞</div><button class="eco-copy-btn" id="eco-batch-copy">複製批量研究提示詞（${Math.min(15,highPrio.length)} 廠商）</button>`;

    bodyDiv.innerHTML=html;
    bodyDiv.querySelectorAll('.eco-wr-copy').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const txt=btn.dataset.prompt.replace(/&quot;/g,'"').replace(/&#10;/g,'\n');
        navigator.clipboard.writeText(txt).catch(()=>{});
        const orig=btn.textContent;btn.textContent='已複製';setTimeout(()=>{btn.textContent=orig;},2000);
      });
    });
    const batchBtn=bodyDiv.querySelector('#eco-batch-copy');
    if(batchBtn){batchBtn.addEventListener('click',()=>{navigator.clipboard.writeText(batchPrompt).catch(()=>{});batchBtn.textContent='已複製';setTimeout(()=>{batchBtn.textContent=`複製批量研究提示詞（${Math.min(15,highPrio.length)} 廠商）`;},2000);});}
  }

// ── Emerging Studio Radar ─────────────────────────────────────────────────────
(function(){
  const s=qs('#s-radar');
  const SI=D.series_index||D.games;
  const RECENT_YEARS=[2024,2025,2026];
  const CANDIDATES_MAX=80;  // upper limit: total <= this to be "candidates"
  const RAPID_MIN=50;       // lower limit: total >= this + new pattern → rapid growth
  const TOP_N=50;           // default display limit for candidates tab

  // ── Signature mechanics / themes for style detection
  const SIG_MECHS=['Megaways','Cluster Pays','PopWins','InfiniReels','AvalanchePays',
    'DoubleMax','FlexiWays','xNudge','xWays','xBomb','xSplit','Hold and Win','Respins',
    'Sticky Wilds','Big Catch Bar','Bullet Collector','Golden Squares','SuperSpinners',
    'Level Up','CollectR','Reel Chaos','Wanted Mechanic','Power Zones','Winner Selection',
    'Multiplier Wilds','Random Wilds','Sticky Symbols','Symbol Upgrade','Cascade','Pay Anywhere'];
  const SIG_THEMES=['Horror','Crime','Chaos','Anime','Cinematic','Music','Cartoon','Dark',
    'Psychedelic','Mythology','Tribal','Sci-Fi','Post-Apocalyptic','Surreal','Abstract'];

  // ── Build per-provider stats from full game index
  const provMap={};
  SI.forEach(g=>{
    const p=g.provider_normalized||g.provider_raw||'Unknown';
    if(!provMap[p]) provMap[p]={
      name:p, ecosystem:g.ecosystem||'Unknown', eco_conf:g.ecosystem_confidence||'Unknown',
      total:0, recent:0, scores:[], mechSet:new Set(), themeSet:new Set(),
      sigMechs:new Set(), sigThemes:new Set(), years:[],
    };
    const r=provMap[p];
    r.total++;
    const yr=g.year?parseInt(g.year):null;
    if(yr) r.years.push(yr);
    if(yr&&RECENT_YEARS.includes(yr)) r.recent++;
    if(g.score!=null) r.scores.push(g.score);
    (g.mechanics||[]).forEach(m=>{r.mechSet.add(m);if(SIG_MECHS.some(kw=>m.includes(kw)))r.sigMechs.add(m);});
    (g.themes||[]).forEach((t,i)=>{
      r.themeSet.add(t);
      const raw=(g.themes_raw||g.themes||[])[i]||t;
      if(SIG_THEMES.some(kw=>raw.toLowerCase().includes(kw.toLowerCase())))r.sigThemes.add(t);
    });
  });

  // ── Sample confidence: 1→低(0) 2→低(.5) 3-4→中低(.7) 5-9→中(.85) 10+→高(1)
  function calcSampleConfidence(total){
    if(total>=10) return{level:'高',cls:'er-conf-high',weight:1.0};
    if(total>=5)  return{level:'中',cls:'er-conf-mid',weight:0.85};
    if(total>=3)  return{level:'中低',cls:'er-conf-mid-low',weight:0.7};
    if(total>=2)  return{level:'低',cls:'er-conf-low',weight:0.5};
    return{level:'低',cls:'er-conf-low',weight:0.0};
  }

  // ── Priority score weighted by sample confidence
  function calcEmergingPriority(r,recentRatio){
    const{weight}=calcSampleConfidence(r.total);
    if(weight===0) return{score:0,priority:'低'};
    let base=0;
    if(recentRatio>=0.8) base+=3; else if(recentRatio>=0.6) base+=2; else if(recentRatio>=0.4) base+=1;
    if(r.sigMechs.size>=2) base+=2; else if(r.sigMechs.size>=1) base+=1;
    if(r.sigThemes.size>=1) base+=1;
    if(r.avgScore>=85) base+=2; else if(r.avgScore>=80) base+=1;
    if(r.recent>=4) base+=2; else if(r.recent>=2) base+=1;
    const score=Math.round(base*weight*10)/10;
    return{score,priority:score>=6?'高':score>=3.5?'中':'低'};
  }

  // ── Research reason text (for candidates/nursery/style)
  function buildEmergingReason(r,recentRatio){
    const rs=[];
    if(r.recent>=4) rs.push('近年持續高產出');
    else if(r.recent>=2) rs.push('近三年仍有新作');
    if(r.sigMechs.size>=2) rs.push('差異化機制明顯');
    else if(r.sigMechs.size===1) rs.push('有特殊玩法機制');
    if(r.sigThemes.size>=1) rs.push('題材風格鮮明');
    if(r.avgScore>=82) rs.push('評分表現不錯');
    if(r.ecosystem!=='Unknown'&&r.ecosystem!=='Independent') rs.push('有 RGS 平台背景');
    if(rs.length===0) rs.push('中小型廠商，持續有作品');
    return rs.slice(0,3).join(' · ');
  }

  // ── Classify reason (explains WHY a provider is in this bucket)
  function buildClassifyReason(r){
    const t=r.tier;
    if(t==='rapid') return'遊戲數 '+r.total+'，已超過新興候選上限（'+CANDIDATES_MAX+' 款）。近三年作品 '+r.recent+'，近期比例 '+Math.round(r.recentRatio*100)+'%，且最早年份 '+(r.minYear||'—')+' 年偏近，歸類為高速成長，不列入新興主榜。';
    if(t==='established') return'遊戲數 '+r.total+' 款，最早年份 '+(r.minYear||'—')+'，屬規模較大或成立較早的成熟廠商，作為對照標竿，不列入新興追蹤。';
    if(t==='nursery') return'遊戲數 '+r.total+' 款（1–2），樣本不足以確認廠商風格與穩定性；近三年有 '+r.recent+' 款新作，先放觀察苗圃。';
    if(t==='candidates') return'遊戲數 '+r.total+' 款（3–'+CANDIDATES_MAX+'），近三年作品 '+r.recent+' 款，最新年份 '+r.maxYear+'，符合中小型新興候選條件。';
    if(t==='noise') return r.noiseReason||'已標記為資料噪音，疑似非正式 studio 名稱。';
    return r.noiseReason||'不符合任一主分類條件：'+(r.recent===0?'近三年無新作品':r.total<3?'遊戲數不足 3 款':r.total>CANDIDATES_MAX?'遊戲數超過候選上限但不符高速成長條件':'資料不完整')+'，待人工確認。';
  }

  // ── Tier label & color (dashboard CSS variables only)
  const TIER_LABEL={candidates:'新興候選',rapid:'高速成長',nursery:'觀察苗圃',
    established:'成熟標竿',noise:'資料噪音',unclassified:'待確認',style:'風格鮮明'};
  const TIER_COLOR={candidates:'var(--gn)',rapid:'var(--am)',nursery:'var(--bl)',
    established:'var(--txd)',noise:'var(--rd)',unclassified:'var(--bl)',style:'var(--vi)'};

  // ── Badge helpers (no hardcoded colors)
  function confBadge(conf){return'<span class="er-badge '+conf.cls+'">樣本：'+conf.level+'</span>';}
  function prioBadge(prio){
    const c=prio.priority==='高'?'var(--gn)':prio.priority==='中'?'var(--am)':'var(--txd)';
    return'<span class="er-badge" style="color:'+c+';border-color:'+c+'">優先度：'+prio.priority+'</span>';
  }
  function tierBadge(tier){
    const c=TIER_COLOR[tier]||'var(--txd)';
    return'<span class="er-badge" style="color:'+c+';border-color:'+c+'">'+( TIER_LABEL[tier]||tier)+'</span>';
  }

  // ── Classify all providers
  const candidates=[], rapidGrowth=[], nursery=[], styleCands=[], established=[], noiseList=[], unclassified=[];

  Object.values(provMap).forEach(r=>{
    r.avgScore=r.scores.length?Math.round(r.scores.reduce((a,b)=>a+b,0)/r.scores.length*10)/10:null;
    const recentRatio=r.total>0?r.recent/r.total:0;
    const minYear=r.years.length?Math.min(...r.years):null;
    const maxYear=r.years.length?Math.max(...r.years):null;
    const conf=calcSampleConfidence(r.total);
    const isStyleCand=r.sigMechs.size>=2||r.sigThemes.size>=1||(r.avgScore!=null&&r.avgScore>=80);
    const prio=calcEmergingPriority(r,recentRatio);
    const reason=buildEmergingReason(r,recentRatio);
    const base={...r,recentRatio,minYear,maxYear,conf,isStyleCand,prio,reason};

    // 1. Data Noise
    if(DATA_NOISE_PROVIDERS_JS.has(r.name)){
      noiseList.push({...base,tier:'noise',noiseReason:'DATA_NOISE_PROVIDERS 清單中的名稱，疑似非正式 studio'});
      return;
    }
    // 2. Rapid Growth: large count but newly concentrated
    const isRapid=r.total>=RAPID_MIN&&(minYear!=null&&minYear>=2022)&&recentRatio>=0.7&&maxYear>=2024;
    if(isRapid){
      rapidGrowth.push({...base,tier:'rapid'});
      if(isStyleCand) styleCands.push({...base,tier:'rapid'});
      return;
    }
    // 3. Established: large studio (not rapid) — excluded from style candidates
    if(r.total>=RAPID_MIN){
      established.push({...base,tier:'established'});
      return;
    }
    // 4. Nursery: 1–2 games with recent activity
    if(r.total<=2&&r.recent>=1){
      nursery.push({...base,tier:'nursery'});
      if(isStyleCand) styleCands.push({...base,tier:'nursery'});
      return;
    }
    // 5. Candidates: 3–CANDIDATES_MAX, >=2 recent, active 2024+
    if(r.total>=3&&r.total<=CANDIDATES_MAX&&r.recent>=2&&maxYear>=2024){
      candidates.push({...base,tier:'candidates'});
      if(isStyleCand) styleCands.push({...base,tier:'candidates'});
      return;
    }
    // 6. Unclassified
    if(r.total>=1){
      unclassified.push({...base,tier:'unclassified',noiseReason:
        r.recent===0?'近三年無新作品，不列為主動追蹤對象':

      });
    }
  });

  const MANUAL_SERIES_RULES=[LE_SLOTS_RULES];

  const NAME_PATTERNS=[

  // ── Build series groups ───────────────────────────────────────────────────
  function buildSeriesGroups(games){
    const groups={},typeMap={};
    games.forEach(g=>{
      const pnorm=g.provider_normalized||g.provider_raw||'';
      NAME_PATTERNS.forEach(pat=>{
        if(!pat.re.test(g.name))return;
        if(pat.provider&&pat.provider!==pnorm)return;
        if(!groups[pat.series])groups[pat.series]=new Set();
        groups[pat.series].add(g.id);typeMap[pat.series]=pat.seriesType;
      });
    });
    MANUAL_SERIES_RULES.forEach(rule=>{
      const allNames=[...rule.coreTemplate,...rule.reskin,...rule.enhancedReskin,...rule.mechanicVariant,...rule.branchType,...rule.needsCheck];
      games.forEach(g=>{
        const pnorm=g.provider_normalized||g.provider_raw||'';
        if(allNames.some(n=>g.name.toLowerCase()===n.toLowerCase())||rule.detector(g.name,pnorm)){
          if(!groups[rule.seriesName])groups[rule.seriesName]=new Set();
          groups[rule.seriesName].add(g.id);typeMap[rule.seriesName]=rule.seriesType||'true_series';
        }
      });
    });
    // Merge window.MANUAL_SERIES entries into groups
    Object.values(MANUAL_SERIES).forEach(ms=>{
      const sn=ms.seriesName;if(!sn||!ms.games)return;
      const mt=manualSeriesType(ms.seriesType);
      games.forEach(g=>{
        if(ms.games[g.name]){
          if(!groups[sn])groups[sn]=new Set();
          groups[sn].add(g.id);if(!typeMap[sn])typeMap[sn]=mt;
        }
      });
    });
    const idMap={};games.forEach(g=>{idMap[g.id]=g;});
    const result={};
    Object.entries(groups).forEach(([sn,ids])=>{
      if(ids.size<2)return;
      result[sn]=([...ids]).map(id=>idMap[id]).filter(Boolean).sort((a,b)=>(a.year||9999)-(b.year||9999));
    });
    return{result,typeMap};
  }

  const {result:SG,typeMap:STM}=buildSeriesGroups(SI);
  const seriesNames=Object.keys(SG).sort((a,b)=>{
    const ta=ST_ORDER[STM[a]]??9,tb=ST_ORDER[STM[b]]??9;
    if(ta!==tb)return ta-tb;return SG[b].length-SG[a].length;
  });

  // ── Game classification ───────────────────────────────────────────────────
  const ENHANCING_MECHS=['Jackpot','Multiplier','Retrigger','Sticky Wild','Level Up','Mystery Symbol','Bonus Buy','Ante Bet','Progressive','Wheel Bonus'];
  const RHYTHM_MECHS=['Gamble','Hold and Win','Respins','Special Grid','Big Catch Bar','Bullet Collector','Cascade','Cluster','Shifting Reels','Expanding Grid','InfiniReels','CollectR','Pay Anywhere'];

  function classifySeriesGame(g,coreGame,manualRule){
    if(manualRule){
      const lu=(arr,cls)=>arr.some(n=>g.name.toLowerCase()===n.toLowerCase())?{cls,note:manualRule.variantNotes?.[g.name]||''}:null;
      return lu(manualRule.coreTemplate,'core')||lu(manualRule.reskin,'reskin')||lu(manualRule.enhancedReskin,'enhanced')||lu(manualRule.mechanicVariant,'variant')||lu(manualRule.branchType,'branch')||lu(manualRule.needsCheck,'unknown')||null;
    }
    if(!coreGame||g.id===coreGame.id)return{cls:'core',mechSim:1,themeSim:1,addedMechs:[],removedMechs:[],note:''};
    const mechSim=jaccard(g.mechanics||[],coreGame.mechanics||[]);
    const themeSim=jaccard(g.themes||[],coreGame.themes||[]);
    const coreSet=new Set(coreGame.mechanics||[]);
    const addedMechs=(g.mechanics||[]).filter(m=>!coreSet.has(m));
    const removedMechs=(coreGame.mechanics||[]).filter(m=>!(new Set(g.mechanics||[])).has(m));
    const hasEnhancing=addedMechs.some(m=>ENHANCING_MECHS.some(e=>m.includes(e)));
    const hasRhythm=addedMechs.some(m=>RHYTHM_MECHS.some(e=>m.includes(e)));
    let cls;
    if(mechSim>=0.75&&addedMechs.length<=2&&!hasRhythm)cls='reskin';
    else if(mechSim>=0.55&&(hasEnhancing||addedMechs.length<=4)&&!hasRhythm)cls='enhanced';
    else if(hasRhythm||mechSim>=0.35)cls='variant';
    else cls='branch';
    return{cls,mechSim,themeSim,addedMechs,removedMechs,note:''};
  }

  // Pre-classify all series
  const CS={};
  seriesNames.forEach(sn=>{
    const games=SG[sn];
    const mse=Object.values(MANUAL_SERIES).find(ms=>ms.seriesName===sn)||null;
    const mr=MANUAL_SERIES_RULES.find(r=>r.seriesName===sn)||null;
    let core=null;
    if(mr&&mr.coreTemplate.length)core=games.find(g=>mr.coreTemplate.some(n=>g.name.toLowerCase()===n.toLowerCase()))||null;
    // If no core from mr, check MANUAL_SERIES for a game classified as '核心模板'
    if(!core&&mse&&mse.games){
      const cn=Object.entries(mse.games).find(([,mg])=>mg.classification==='核心模板')?.[0];
      if(cn)core=games.find(g=>g.name===cn)||null;
    }
    if(!core)core=games.filter(g=>g.score!=null).sort((a,b)=>(b.score||0)-(a.score||0))[0]||games[0]||null;
    const classified=games.map(g=>{
      // MANUAL_SERIES takes priority over auto-classification
      if(mse&&mse.games&&mse.games[g.name]){
        const mg=mse.games[g.name];
        return{...g,cls:manualClsMap(mg.classification),note:mg.note||'',diffNote:mg.diffNote||'',isManual:true};
      }
      const r=classifySeriesGame(g,core,mr);return r?{...g,...r}:{...g,cls:'unknown',note:''};
    });
    const dist={};classified.forEach(g=>{dist[g.cls]=(dist[g.cls]||0)+1;});
    CS[sn]={games,core,classified,dist,mr,mse};
  });
  // Phase 5A: expose the already-computed series/reskin classification so
  // Monthly Competitive Analysis can reuse it instead of re-running
  // buildSeriesGroups()/classifySeriesGame() a second time.
  window.SERIES_RESEARCH_DATA={SG,STM,CS};

  // ── Detail panel ─────────────────────────────────────────────────────────

  // ── Tab: 系列總覽 ─────────────────────────────────────────────────────────
  function renderOverview(q){
    const p=qs('#sr-p-overview');p.innerHTML='';

    if(!list.length){const m=mk('div','sr-empty');m.textContent='沒有符合的系列。';p.appendChild(m);return;}
    const note=mk('div','sr-tab-note');note.textContent='共 '+list.length+' 個系列群組';p.appendChild(note);
    list.forEach(sn=>p.appendChild(seriesCard(sn)));
  }

  // ── Tab: 換皮高風險 ───────────────────────────────────────────────────────
  function renderReskinRisk(q){
    const p=qs('#sr-p-reskin');p.innerHTML='';
    const warn=mk('div','sr-tab-info');warn.textContent='高換皮比例不代表品質低，而是代表此系列較常沿用核心模板，透過題材、美術、包裝或小幅機制調整延展作品。排序依（純換皮 + 強化換皮）比例由高至低。';p.appendChild(warn);
    const risk=seriesNames.filter(sn=>{
      const {dist}=CS[sn];const total=SG[sn].length;
      const rs=(dist.reskin||0)+(dist.enhanced||0);
      return total>=3&&rs/total>=0.4&&(!q||sn.toLowerCase().includes(q.toLowerCase()));
    }).map(sn=>{const {dist}=CS[sn];const total=SG[sn].length;const rs=(dist.reskin||0)+(dist.enhanced||0);return{sn,rate:rs/total};}).sort((a,b)=>b.rate-a.rate);
    if(!risk.length){const m=mk('div','sr-empty');m.textContent='目前沒有換皮比例 ≥40% 的系列（需 ≥3 款）。';p.appendChild(m);return;}
    risk.forEach(({sn,rate})=>{
      const {classified,core}=CS[sn];
      const pct=Math.round(rate*100);
      const reskinNames=classified.filter(g=>g.cls==='reskin'||g.cls==='enhanced').slice(0,3).map(g=>g.name).join('、');
      const card=seriesCard(sn);
      const extra=mk('div','');extra.style.cssText='font-size:12px;color:var(--txd);margin:6px 0 8px;padding:6px 10px;background:var(--sfh);border-left:2px solid var(--rd)';
      extra.innerHTML='換皮比例 <b style="color:var(--rd)">'+pct+'%</b> · 核心：'+(core?.name||'?')+'<br>代表換皮：'+(reskinNames||'（無）')+'<br>主要差異：題材 / 美術 / 包裝更換';
      card.insertBefore(extra,card.querySelector('.gc-btn'));
      p.appendChild(card);
    });
  }

        vHdr.append(vName,vBadge);vWrap.appendChild(vHdr);
        const vBody=mk('div','');vBody.style.cssText='font-size:12px;line-height:1.7;color:var(--txd)';

        aBtn.onclick=e=>{e.stopPropagation();

  // ── Tab: 待確認 ───────────────────────────────────────────────────────────
  function renderCheck(q){
    const p=qs('#sr-p-check');p.innerHTML='';
    const warn=mk('div','sr-tab-warning');warn.textContent='以下系列因資料不足、命名矛盾或跨廠商相似命名，自動分類信心不足，建議人工確認。';p.appendChild(warn);
    const list=seriesNames.filter(sn=>{
      const type=STM[sn]||'needs_check';
      const {dist,games}=CS[sn];
      return(type==='needs_check'||(dist.unknown||0)>0||games.length<=2||games.every(g=>!(g.mechanics||[]).length))&&(!q||sn.toLowerCase().includes(q.toLowerCase()));
    });
    if(!list.length){const m=mk('div','sr-empty');m.textContent='目前沒有需要確認的系列。';p.appendChild(m);return;}
    list.forEach(sn=>{
      const {classified,games,dist}=CS[sn];
      const type=STM[sn]||'needs_check';
      const reasons=[];
      if(type==='needs_check')reasons.push('系列類型為「待確認」');
      if(games.length<=2)reasons.push('只有 '+games.length+' 款資料');
      if(games.every(g=>!(g.mechanics||[]).length))reasons.push('缺少 mechanics tag');
      if((dist.unknown||0)>0)reasons.push((dist.unknown)+' 款分類待確認');
      const card=seriesCard(sn);
      const extra=mk('div','');extra.style.cssText='font-size:12px;color:var(--txd);margin:6px 0 8px;padding:6px 10px;background:var(--sfh);border-left:2px solid var(--bd);line-height:1.7';
      extra.innerHTML='<b>原因：</b>'+reasons.join('、')+'<br><b>建議：</b>查看規則頁 / 補充 mechanics tag / 人工試玩確認';
      const unknownGames=classified.filter(g=>g.cls==='unknown');
      card.insertBefore(extra,card.querySelector('.gc-btn'));
      unknownGames.slice(0,3).forEach(g=>{
        const u=mk('div','');u.style.cssText='font-size:11px;color:var(--txd);padding:3px 10px;background:var(--sfh);border:1px solid var(--bd);margin:-2px 0 2px';

        card.insertBefore(u,card.querySelector('.gc-btn'));
      });
      p.appendChild(card);
    });
  }

    const q=srchIn.value.trim();

    else if(activeTab==='reskin')renderReskinRisk(q);

  s.appendChild(algNote);
})();

  'Sticky Symbols':{n:'Sticky Symbols',tr:['Symbol:Sticky']},
  'sticky symbols':{n:'Sticky Symbols',tr:['Symbol:Sticky']},
  'Sticky symbols':{n:'Sticky Symbols',tr:['Symbol:Sticky']},
  'sticky':{n:'Sticky Symbols',tr:['Symbol:Sticky']},
};
// Scatter Pays: separate from Scatter Trigger — do not merge
const _MSCATTER={
  'Scatter Pays':{n:'Scatter Pays',tr:['WinSystem:ScatterPays'],warn:true},
};

const _normCache=new Map();

function buildNormalization(rawMechanics){
  const normArr=[],traitsArr=[],warnings=[];
  const seenN=new Set(),seenT=new Set();
  const add=(n,trs)=>{
    if(!seenN.has(n)){seenN.add(n);normArr.push(n);}
    (trs||[]).forEach(t=>{if(!seenT.has(t)){seenT.add(t);traitsArr.push(t);}});
  };
  (rawMechanics||[]).forEach(raw=>{
    raw=String(raw).trim();
    if(!raw)return;
    // P3 high-risk specials first
    if(_MSCATTER[raw]){
      const s=_MSCATTER[raw];
      add(s.n,s.tr);
      if(s.warn)warnings.push('⚠ Scatter Pays 與 Scatter Trigger 語意不同，請確認是 pay-anywhere 機制');
      return;
    }
    if(_MEXPAND[raw]){const s=_MEXPAND[raw];add(s.n,s.tr);return;}
    if(_MSTICKY[raw]){const s=_MSTICKY[raw];add(s.n,s.tr);return;}
    // P2 subtypes
    if(_MSUBTYPE[raw]){const s=_MSUBTYPE[raw];add(s.p,s.tr);return;}
    // P0 case/plural → P1 alias
    let n=_MP0[raw]||raw;
    n=_MALIAS[n]||_MALIAS[raw]||n;
    add(n,[]);
  });
  if(seenN.has('Scatter Trigger')&&seenN.has('Scatter Pays'))
    warnings.push('⚠ Scatter Trigger 與 Scatter Pays 同時存在，請確認機制定義');
  return{normalized:normArr,normSet:seenN,traits:traitsArr,warnings};
}
function _getNorm(game){
  if(!_normCache.has(game.id)){_normCache.set(game.id,buildNormalization(game.mechanics));}
  return _normCache.get(game.id);
}
function getMechanicsNormalized(game){return _getNorm(game).normSet;}
function getMechanicsNormalizedArr(game){return _getNorm(game).normalized;}
function getMechanicsTraits(game){return _getNorm(game).traits;}
function getMechanicsWarnings(game){return _getNorm(game).warnings;}
const _TRAIT_LABELS={
  'FreeSpins:Multiplier':'Free Spins 期間有乘數',
  'FreeSpins:Retrigger':'可追加 Free Spins',
  'FreeSpins:ModeChoosing':'可選 Free Spins 模式',
  'FreeSpins:Gamble':'Free Spins 後可 Gamble',
  'FreeSpins:Extra':'有額外免費旋轉',
  'Multiplier:Random':'隨機乘數','Multiplier:Increasing':'累積遞增乘數',
  'Multiplier:Step':'梯級乘數','Multiplier:Reel':'輪軸乘數',
  'Multiplier:Bonus':'Bonus 乘數','Multiplier:Win':'勝利乘數',
  'Jackpot:Fixed':'固定彩金','Jackpot:Progressive':'累積彩金',
  'Jackpot:UnknownType':'Jackpot 類型未標註',
  'Wild:Sticky':'Wild 黏定','Wild:Expanding':'Wild 展開',
  'Wild:Multiplier':'Wild 帶乘數','Wild:Respin':'展開後重轉',
  'Symbol:Expanding':'符號展開','Symbol:Sticky':'符號黏定',
  'Reel:Expanding':'盤面格數增加',
  'Scatter:Trigger':'觸發 Bonus','WinSystem:ScatterPays':'Scatter Pays 勝利系統（需確認）',
};
function formatMechanicsForPrompt(game){
  const norm=getMechanicsNormalizedArr(game);
  const traits=getMechanicsTraits(game);
  const warnings=getMechanicsWarnings(game);
  const trLabels=traits.map(t=>_TRAIT_LABELS[t]||t);
  let out='核心機制：'+(norm.join('、')||'（未知）');
  if(trLabels.length)out+='\n重要子特徵：'+trLabels.join('、');
  if(warnings.length)out+='\n'+warnings.join('\n');
  return out;
}

// ── Competitor Matcher ────────────────────────────────────────────────────────
(function(){
  const s=qs('#s-matcher');
  if(!s)return;
  const GAMES=D.series_index||D.games;

  // ── Condition groups ──────────────────────────────────────────────────────
  // Built dynamically from D.mechanic_meta (Python's MECHANIC_META — the same
  // single source of truth the 玩法機制地圖 uses for primaryRole/ownership),
  // instead of a separately hand-maintained list. This guarantees the picker's
  // vocabulary and category grouping always match the mechanic map exactly
  // (same leaf names, same 9 primaryRole categories), and that newly
  // classified mechanics automatically become selectable here without a
  // manual edit. Note: this IIFE is its own closure, separate from the
  // Mechanic Explorer's IIFE further up the file — ROLE_ORDER/ROLE_COLORS
  // declared there are NOT visible here, so the role list/order/weight/id
  // mapping is kept as its own local copy (ROLE_WEIGHT's key order doubles
  // as the iteration order).
  const ROLE_WEIGHT={'中獎骨架':0.25,'版面/轉軸結構':0.10,'符號行為':0.05,'Wild行為':0.15,
    '倍數/成長':0.10,'Bonus模式':0.15,'觸發/入口':0.05,'收集/進度':0.05,'Jackpot/獎池':0.05};
  const ROLE_ID={'中獎骨架':'skeleton','版面/轉軸結構':'layout','符號行為':'symbol','Wild行為':'wild',
    '倍數/成長':'multiplier','Bonus模式':'bonus','觸發/入口':'trigger','收集/進度':'collect','Jackpot/獎池':'jackpot'};
  function mechItemLabel(leaf,meta){
    if(meta.ownershipType==='品牌專有'||meta.ownershipType==='授權框架')
      return leaf+'（'+(meta.owner||meta.ownershipType)+'）';
    return leaf;
  }
  function buildMechGroups(){
    const byRole={};
    Object.keys(D.mechanic_meta||{}).forEach(leaf=>{
      const meta=D.mechanic_meta[leaf];
      if(meta.entityType!=='mechanic'||!meta.primaryRole)return;
      (byRole[meta.primaryRole]=byRole[meta.primaryRole]||[]).push(leaf);
    });
    return Object.keys(ROLE_WEIGHT).filter(r=>byRole[r]&&byRole[r].length).map(role=>({
      id:ROLE_ID[role]||role,label:role,weight:ROLE_WEIGHT[role]||0.05,
      items:byRole[role].sort().map((leaf,i)=>(
        {id:'m'+i,label:mechItemLabel(leaf,D.mechanic_meta[leaf]),canonical:leaf})),
    }));
  }
  function buildArchetypeGroup(){
    const items=Object.keys(D.mechanic_meta||{}).filter(k=>D.mechanic_meta[k].entityType==='archetype');
    if(!items.length)return null;
    return{id:'archetype',label:'熱門機制模板（單一遊戲玩法被全產業複製）',weight:0,
      items:items.sort().map((leaf,i)=>({id:'a'+i,label:leaf,canonical:leaf}))};
  }
  const _archetypeGroup=buildArchetypeGroup();
  const GROUPS=[
    ...buildMechGroups(),
    ...(_archetypeGroup?[_archetypeGroup]:[]),
    {id:'cost',label:'成本限制',weight:0.05,items:[
      {id:'simple',label:'機制數量 ≤ 5（輕量）',special:'mech_lte5'},
      {id:'medium',label:'機制數量 ≤ 8（中等）',special:'mech_lte8'},
      {id:'nojp',label:'無 Jackpot（節省授權）',special:'no_jackpot'},
      {id:'nomw',label:'無 Megaways（節省授權）',special:'no_megaways'},
    ]},
    {id:'theme',label:'題材方向（參考用）',weight:0,items:[
      {id:'t_fantasy',label:'奇幻 / 神話 / 魔法',themeTags:['fantasy','myth','magic','dragon','wizard','fairy']},
      {id:'t_animal',label:'動物 / 自然 / 叢林',themeTags:['animal','wildlife','nature','jungle','wolf','bear','fish']},
      {id:'t_fruit',label:'水果 / 經典 / 復古',themeTags:['fruit','classic','retro','bar','vegas']},
      {id:'t_adventure',label:'冒險 / 探索 / 寶藏',themeTags:['adventure','treasure','pirate','cowboy','explorer']},
      {id:'t_asian',label:'東方 / 亞洲 / 福運',themeTags:['asian','chinese','japanese','temple','fortune','luck','panda']},
      {id:'t_crime',label:'犯罪 / 動作 / 幫派',themeTags:['crime','heist','gangster','mafia','action','agent']},
      {id:'t_holiday',label:'節慶 / 季節',themeTags:['christmas','holiday','halloween','easter']},
      {id:'t_egypt',label:'埃及 / 古文明',themeTags:['egypt','pharaoh','cleopatra','ancient','aztec','greek','roman']},
    ]},
  ];

  // ── Matching helpers ──────────────────────────────────────────────────────
  // Matches against g.mechanics_leaf — the Python-computed canonical layer
  // (same field the mechanic map's mechMap is built from), NOT the separate
  // buildNormalization()/getMechanicsNormalized() pipeline (that one is still
  // shared by Research Workbench/Prompt Templates and is intentionally left
  // untouched; it uses its own older, narrower alias table and is why the
  // picker's vocabulary used to drift from the mechanic map).
  const _leafSetCache=new Map();
  function leafSetOf(game){
    if(!_leafSetCache.has(game.id))_leafSetCache.set(game.id,new Set(game.mechanics_leaf||game.mechanics||[]));
    return _leafSetCache.get(game.id);
  }
  const NON_LINE_SKELETONS=['Ways','Megaways','Cluster Pays','Pay Anywhere','xWays'];
  const JACKPOT_FAMILY=['Jackpot','Fixed Jackpots','Progressive Jackpot','Dream Drop'];
  function mechMatch(game,item){
    return leafSetOf(game).has(item.canonical);
  }
  function themeMatch(themes,tags){
    const tl=(themes||[]).map(t=>t.toLowerCase());
    return tags.some(t=>tl.some(th=>th.includes(t)));
  }
  function specialMatch(game,special){
    const leafSet=leafSetOf(game);
    const mc=(game.mechanics_leaf||game.mechanics||[]).length;
    if(special==='mech_lte5')return mc<=5;
    if(special==='mech_lte8')return mc<=8;
    if(special==='no_jackpot')return!JACKPOT_FAMILY.some(j=>leafSet.has(j));
    if(special==='no_megaways')return!leafSet.has('Megaways');
    if(special==='is_paylines')return!NON_LINE_SKELETONS.some(c=>leafSet.has(c));
    return false;
  }
  function condMatch(game,item){
    if(item.special)return specialMatch(game,item.special);
    if(item.themeTags)return themeMatch(game.themes_raw||game.themes,item.themeTags);
    return mechMatch(game,item);
  }

  // ── Score computation ──────────────────────────────────────────────────────
  function computeScore(game,selected){
    let totalW=0,totalS=0;
    const groupRatios={};
    GROUPS.forEach(g=>{
      const sel=selected[g.id]||[];
      if(!sel.length||g.weight===0)return;
      totalW+=g.weight;
      let hit=0;
      sel.forEach(id=>{
        const item=g.items.find(i=>i.id===id);
        if(item&&condMatch(game,item))hit++;
      });
      const ratio=hit/sel.length;
      groupRatios[g.id]=ratio;
      totalS+=ratio*g.weight;
    });
    return{score:totalW>0?totalS/totalW:0,groupRatios};
  }

  // ── Match type label ──────────────────────────────────────────────────────
  const FEATURE_GROUP_IDS=['bonus','wild','symbol','multiplier','trigger','collect','jackpot','layout'];
  function matchType(groupRatios){
    const sk=groupRatios.skeleton||0;
    const featureMax=Math.max(0,...FEATURE_GROUP_IDS.map(k=>groupRatios[k]||0));
    if(sk>=0.6)return{label:'主骨架模板',color:'var(--gn)'};
    if(featureMax>=0.5)return{label:'Feature 參考',color:'var(--bl)'};
    return{label:'題材演出參考',color:'var(--vi)'};
  }

  // ── Dev cost risk ──────────────────────────────────────────────────────────
  function devRisk(game){
    const leaf=game.mechanics_leaf||game.mechanics||[];
    const mc=leaf.length;
    const hasJp=JACKPOT_FAMILY.some(j=>leaf.includes(j));
    const hasMw=leaf.includes('Megaways');
    if(mc>10||hasJp)return{label:'高',color:'var(--rd)'};
    if(mc>6||hasMw)return{label:'中',color:'var(--am)'};
    return{label:'低',color:'var(--gn)'};
  }

  // ── Research suggestion ────────────────────────────────────────────────────
  function researchNote(mtLabel,riskLabel){
    if(mtLabel==='主骨架模板'&&riskLabel==='高')return'骨架結構相符，但機制複雜度或授權成本偏高，建議解構邏輯後再評估是否直接參考';
    if(mtLabel==='主骨架模板')return'玩法骨架高度吻合，可作為主要框架參考，機制數量在合理範圍內';
    if(mtLabel==='Feature 參考')return'Bonus 觸發節奏或 Feature 設計值得拆解研究，骨架部分可依需求自行調整';
    return'題材包裝與演出風格值得參考，玩法骨架差異較大，適合作為美術與敘事方向參考';
  }

  // ── Result card ────────────────────────────────────────────────────────────
  function resultCard(game,scoreData,selected){
    const pct=Math.round(scoreData.score*100);
    const mt=matchType(scoreData.groupRatios);
    const risk=devRisk(game);
    const prov=game.provider_normalized||game.provider_raw||'';
    const yr=game.year||'?';
    const mechs=game.mechanics_leaf||game.mechanics||[];
    const themes=game.themes||[];

    // Matched / missed conditions
    const matched=[],missed=[];
    GROUPS.forEach(g=>{
      (selected[g.id]||[]).forEach(id=>{
        const item=g.items.find(i=>i.id===id);
        if(!item)return;
        (condMatch(game,item)?matched:missed).push(item.label);
      });
    });

    const noteText=researchNote(mt.label,risk.label);

      const row=mk('div','mc-tags-row');

      card.appendChild(row);

    // Mechanics + Themes info
    if(mechs.length||themes.length){
      const info=mk('div','mc-info-row');
      const parts=[];
      if(mechs.length){
        parts.push('<span class="mc-info-label">機制：</span>'+mechs.slice(0,5).join(' · '));
      }
      if(themes.length)parts.push('<span class="mc-info-label">題材：</span>'+themes.slice(0,4).join(' · '));
      info.innerHTML=parts.join('<br>');card.appendChild(info);
    }

    // Scores (separate per source, no averaging)
    const sc=mk('div','mc-score-row');

    if(cgn!=null&&cgn!=='')scoreParts.push('<span class="mc-src-cgn">CGN '+Math.round(parseFloat(cgn))+'</span>');
    if(scr!=null&&scr!=='')scoreParts.push('<span class="mc-src-sc">SC '+parseFloat(scr).toFixed(1)+'</span>');
    if(bwb!=null&&bwb!=='')scoreParts.push('<span class="mc-src-bwb">BWB '+parseFloat(bwb).toFixed(1)+'</span>');
    if(!scoreParts.length)scoreParts.push('<span style="color:var(--txd);font-size:11px">評分待補</span>');
    sc.innerHTML=scoreParts.join(' ');card.appendChild(sc);

    // Research note
    const noteEl=mk('div','mc-note');noteEl.textContent='建議：'+noteText;card.appendChild(noteEl);

    // Actions
    const acts=mk('div','mc-acts');
    const addBtn=mk('button','wl-add'+(wlHas(game.name)?' added':''));
    addBtn.style.cssText='font-size:12px;padding:4px 10px';
    addBtn.textContent=wlHas(game.name)?'✓ 已加入':'加入研究';
    addBtn.onclick=()=>{
      if(wlHas(game.name)){
        wlRemove(game.name);

          if(ok){addBtn.textContent='✓ 已加入';addBtn.classList.add('added');}
        },{

    };
    const cpBtn=mk('button','gc-btn');
    cpBtn.style.cssText='font-size:12px;padding:4px 10px';
    cpBtn.textContent='複製競品分析 Prompt';
    cpBtn.onclick=()=>copyPrompt(game,matched,missed,mt.label,risk.label,noteText);
    acts.append(addBtn,cpBtn);
    // Phase 6C: GAMES comes from D.series_index/D.games, so game.id is

  // ── Search ─────────────────────────────────────────────────────────────────
  function getMatchMode(){
    const el=s.querySelector('input[name=mc-matchmode]:checked');
    return el?el.value:'strict';
  }
  function checkAllSelectedMatched(game,selected){
    for(const group of GROUPS){
      if(group.id==='theme')continue;
      const ids=selected[group.id]||[];
      for(const id of ids){
        const item=group.items.find(i=>i.id===id);
        if(!item)continue;
        if(!condMatch(game,item))return false;
      }
    }
    return true;
  }
  function runSearch(){
    const selected={};
    GROUPS.forEach(g=>{
      const checked=[...s.querySelectorAll('input[data-gid="'+g.id+'"]:checked')];
      if(checked.length)selected[g.id]=checked.map(c=>c.value);
    });
    const hasAny=Object.values(selected).some(v=>v.length>0);
    const resultsEl=qs('#mc-results');
    const countEl=qs('#mc-count');
    if(!hasAny){
      resultsEl.innerHTML='<div class="mc-empty">請先勾選至少一個玩法條件，再搜尋競品。</div>';
      if(countEl)countEl.textContent='';return;
    }
    const mode=getMatchMode();
    let scored=GAMES.map(game=>{
      const sd=computeScore(game,selected);
      const allMatched=checkAllSelectedMatched(game,selected);
      return{game,sd,allMatched};
    });
    if(mode==='strict'){
      scored=scored.filter(x=>x.allMatched);
    }else{
      scored=scored.filter(x=>x.sd.score>=0.20).slice(0,50);
    }
    scored.sort((a,b)=>b.sd.score-a.sd.score);

    resultsEl.innerHTML='';
    if(countEl){
      if(mode==='strict'){
        countEl.textContent=scored.length
          ?'找到 '+scored.length+' 款完全符合條件的競品（共 '+GAMES.length.toLocaleString()+' 款資料）'
          :'找不到完全符合所有條件的競品，可切換「相似推薦」查看部分符合案例。';
      }else{
        countEl.textContent=scored.length
          ?'找到 '+scored.length+' 款相似競品（允許部分條件未命中）'
          :'找不到相關遊戲，請嘗試減少條件或放寬限制。';
      }
    }
    if(!scored.length){
      const hint=mode==='strict'
        ?'找不到完全符合所有條件的競品。<br>提示：可切換「相似推薦」模式查看部分符合案例，或減少勾選的條件數量。'

// ── Monthly Competitive Analysis (Phase 5A) ────────────────────────────────────
(function(){

    if(!md)return[];

  }
  function fmtDelta(cur,prev,{pp=false,decimal=false}={}){
    if(prev==null)return'';
    const d=cur-prev;
    const sign=d>0?'+':'';
    if(pp)return`${sign}${d.toFixed(1)}pp`;
    if(decimal)return`${sign}${d.toFixed(1)}`;

  }
  function deltaColor(d){return d>0?'var(--gn)':d<0?'var(--rd)':'var(--txd)';}
  function gameChip(g,extra){
    return `<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--bd);font-size:13px"><span>${g.name} <span style="color:var(--txd)">· ${g.provider_normalized||g.provider_raw||''}</span></span><span style="color:var(--txd)">${extra}</span></div>`;
  }

  // Union of every game id that belongs to any series/reskin group (reused
  // by Section A's "有系列關聯" count and Section F) — computed once.
  let _seriesIdSet=null;
  function getSeriesIdSet(){
    if(_seriesIdSet)return _seriesIdSet;
    _seriesIdSet=new Set();
    const SRD=window.SERIES_RESEARCH_DATA;
    if(SRD)Object.values(SRD.SG).forEach(members=>members.forEach(g=>_seriesIdSet.add(g.id)));

  }

  function penetrationRows(curCounts,curDenom,prevCounts,prevDenom){
    const names=new Set([...Object.keys(curCounts),...(prevCounts?Object.keys(prevCounts):[])]);
    const rows=[];
    names.forEach(name=>{
      const c=curCounts[name]||0;
      const p=prevCounts?(prevCounts[name]||0):0;
      if(c<MIN_TAG_SUPPORT&&(c+p)<MIN_TAG_SUPPORT)return;  // low-frequency filter
      const curPct=curDenom?c/curDenom*100:0;
      const prevPct=(prevCounts&&prevDenom)?p/prevDenom*100:null;
      rows.push({name,c,p,curPct,prevPct,deltaPp:prevPct!=null?curPct-prevPct:null});
    });
    return rows;
  }
  // Phase 5A.6: names in these lists open the Trend Explorer modal. Reuses
  // the same escaping convention already used for provider names in
  // Emerging Studio Radar's onclick attributes (see wlRadarAdd call sites).
  function jsEscape(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");}
  function clickableName(entityType,name){
    return `<span style="cursor:pointer;text-decoration:underline dotted;text-underline-offset:2px" onclick="openTrendExplorer('${entityType}','${jsEscape(name)}')" title="查看過去 12 個月趨勢">${name}</span>`;
  }
  function trendList(rows,emptyMsg,entityType){
    if(!rows.length)return`<div style="font-size:12px;color:var(--txd);padding:8px 0">${emptyMsg}</div>`;
    return rows.map(r=>`<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--bd);font-size:13px"><span>${clickableName(entityType,r.name)}</span><span>${r.prevPct.toFixed(0)}% → ${r.curPct.toFixed(0)}% <b style="color:${deltaColor(r.deltaPp)}">(${r.deltaPp>0?'+':''}${r.deltaPp.toFixed(1)}pp)</b></span></div>`).join('');
  }
  function trendListPlain(rows,entityType){
    if(!rows.length)return`<div style="font-size:12px;color:var(--txd);padding:8px 0">本月無足夠資料</div>`;
    return rows.slice(0,8).map(r=>`<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--bd);font-size:13px"><span>${clickableName(entityType,r.name)}</span><span style="color:var(--txd)">${r.curPct.toFixed(0)}%（${r.c} 款）</span></div>`).join('');
  }
  // Phase 5A.1: gate the Growing/Declining comparison behind coverage
  // reliability. Low confidence never shows a ranked delta (that's the part
  // that can be visually misread as a real market trend) — it can still show
  // this month's plain usage numbers, which make no comparative claim.
  function trendBlock(curPct,prevPct,growingRows,decliningRows,topRows,growLabel,declLabel,entityType){
    const tier=combinedTier(curPct,prevPct);
    if(tier==='low'){
      return `<div style="font-size:13px;color:var(--rd);margin-bottom:8px">● 資料不足，暫不判定趨勢（覆蓋率過低，兩個月份的差異不可靠）</div>
        <div style="font-size:12px;font-weight:700;margin-bottom:6px">本月使用量（僅供參考，非趨勢判定）</div>

    }
    const warnLine=tier==='medium'?'<div style="font-size:12px;color:var(--am);margin-bottom:8px">⚠ Coverage 中等，趨勢僅供參考</div>':'';
    return `${warnLine}<div class="g2"><div><div style="font-size:12px;font-weight:700;color:var(--gn);margin-bottom:6px">${growLabel}</div>${trendList(growingRows,'本月無明顯成長',entityType)}</div><div><div style="font-size:12px;font-weight:700;color:var(--rd);margin-bottom:6px">${declLabel}</div>${trendList(decliningRows,'本月無明顯下降',entityType)}</div></div>`;
  }
  function seriesList(rows,emptyMsg){
    if(!rows.length)return`<div style="font-size:12px;color:var(--txd);padding:8px 0">${emptyMsg}</div>`;
    return rows.slice(0,6).map(r=>`<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--bd);font-size:13px"><span>${r.sn}</span><span style="color:var(--txd)">${r.count} 款</span></div>`).join('');
  }
  function scoreNum100(v){if(v==null)return null;const n=Number(v);if(!Number.isFinite(n))return null;return n<=10?n*10:n;}

  // Phase 5A.5: Markdown export helpers. Priority CGN/SC/BWB per report;
  // only existing fields, never a guessed URL.
  function bestSourceUrl(g){return g.cgn_url||g.sc_url||g.bwb_url||null;}
  function mdGameLine(g,extra){
    const url=bestSourceUrl(g);
    const label=url?`[${g.name}](${url})`:g.name;
    const prov=g.provider_normalized||g.provider_raw||'';
    return `- ${label}（${prov}）${extra?' — '+extra:''}`;
  }
  function mdDeltaTable(rows){
    if(!rows.length)return'_無明顯變化_';
    let out='| 項目 | 上月 | 本月 | Δ |\n|---|---:|---:|---:|\n';
    rows.forEach(r=>{out+=`| ${r.name} | ${r.prevPct.toFixed(0)}% | ${r.curPct.toFixed(0)}% | ${r.deltaPp>0?'+':''}${r.deltaPp.toFixed(1)}pp |\n`;});
    return out.trim();
  }
  function mdTopTable(rows){
    if(!rows.length)return'_本月無足夠資料_';
    let out='| 項目 | 本月使用率 |\n|---|---:|\n';
    rows.forEach(r=>{out+=`| ${r.name} | ${r.curPct.toFixed(0)}%（${r.c} 款） |\n`;});
    return out.trim();
  }
  // Mirrors trendBlock()'s reliability gating exactly (same tiers, same
  // "low never shows a ranked delta" rule) so export can never show a
  // trend the UI itself would have suppressed.
  function mdTrendSection(tier,pmd,growingRows,decliningRows,topRows){
    if(!pmd)return'_無足夠前月資料，僅顯示本月排行_\n\n'+mdTopTable(topRows);
    if(tier==='low'){
      return '資料不足，暫不判定趨勢。\n\n- 僅列目前使用分布，不作 Growing / Declining 判定。\n\n'+mdTopTable(topRows);
    }
    const warn=tier==='medium'?'> ⚠ Coverage 中等，趨勢僅供參考\n\n':'';
    return `${warn}### Growing\n\n${mdDeltaTable(growingRows)}\n\n### Declining\n\n${mdDeltaTable(decliningRows)}`;
  }
  function buildMonthlyMarkdown(vm){
    const lines=[];
    const push=x=>lines.push(x);
    push(`# Slot Analytics｜${vm.monthKey} 月度競品分析`);
    push('');
    const statusLine=vm.status==='ongoing'?'進行中，本月尚未結束':vm.status==='future'?'預告 / 未完整月份，僅供參考':'完整月份';
    push(`> 狀態：${statusLine}`);
    push(`> 比較基準：${vm.pmd?vm.pmKey:'無足夠前月資料'}`);
    push(`> 資料可信度：Mechanics ${vm.curMechPct.toFixed(0)}% / Themes ${vm.curThemePct.toFixed(0)}%`);
    push('');
    push('## 月度總覽');
    push('');
    push(`- 本月發行遊戲數：${vm.total}${vm.pmd?`（上月 ${vm.pgs.length}，${fmtDelta(vm.total,vm.pgs.length)}）`:''}`);
    push(`- 活躍 Provider 數：${vm.activeProviders}${vm.pActiveProviders!=null?`（上月 ${vm.pActiveProviders}，${fmtDelta(vm.activeProviders,vm.pActiveProviders)}）`:''}`);
    push(`- 平均綜合分：${vm.md.avg_score??'—'}${(vm.pmd&&vm.pmd.avg_score!=null)?`（上月 ${vm.pmd.avg_score}，${fmtDelta(vm.md.avg_score,vm.pmd.avg_score,{decimal:true})}）`:''}`);

    push('');

    push('');

      });
    } else push('_無足夠資料_');
    push('');
    push('## Mechanic Trends');
    push('');
    push(mdTrendSection(vm.mechTier,vm.pmd,vm.growingMech,vm.decliningMech,vm.topMechByPen));
    push('');
    push('## Theme Trends');
    push('');
    push(mdTrendSection(vm.themeTier,vm.pmd,vm.growingTheme,vm.decliningTheme,vm.topThemeByPen));
    push('');
    push('## Notable Games');
    push('');
    push('### Top Rated');
    push('');
    if(vm.topRated.length)vm.topRated.forEach(g=>push(mdGameLine(g,g.score.toFixed(0)+' 分')));
    else push('_本月無評分資料_');
    push('');
    push('### Score Disagreement');
    push('');

    else push('_本月無明顯評分分歧_');
    push('');
    push('### Mechanic Outlier');
    push('');

    else push('_本月無機制離群遊戲_');

    } else {

    else if(vm.notableProviders.length)vm.notableProviders.slice(0,8).forEach(p=>push(`- ${p.name}（${vm.md.provider_counts[p.name]||0} 款本月）`));
    else push('_本月無新興廠商雷達候選有發行_');
    push('');
    push('**本月值得研究 Game（研究工作台）**');
    push('');
    if(vm.notableGames.length)vm.notableGames.slice(0,8).forEach(g=>push(mdGameLine(g)));
    else push('_研究工作台中無本月發行遊戲_');
    push('');
    push('## 資料品質');
    push('');
    push(`- Mechanics Coverage：${vm.curMechPct.toFixed(0)}%（${vm.md.mechanic_denom}/${vm.total}）`);
    push(`- Theme Coverage：${vm.curThemePct.toFixed(0)}%（${vm.md.theme_denom}/${vm.total}）`);
    push(`- Score Coverage：${(vm.md.score_count/vm.total*100).toFixed(0)}%（${vm.md.score_count}/${vm.total}）`);
    return lines.join('\n');
  }

  // Phase 5A.1: coverage-based trend reliability. Thresholds (≥80% high,
  // 50–79% medium, <50% low) were chosen from the actual last-36-month
  // coverage distribution (see report), not guessed — mechanic coverage's
  // real cliff for under-scraped recent months falls well below 80%, while
  // "settled" months cluster at 87–100%; theme coverage is chronically low
  // (median ~7% in the recent window) and is expected to sit in "low" most
  // of the time — that is a correct reflection of the data, not a bug, and
  // the threshold must not be lowered just to make Theme Trends look active.
  const REL_HIGH=80,REL_MED=50;
  const REL_RANK={low:0,medium:1,high:2};
  const REL_LABEL={high:'高可信',medium:'中等可信',low:'資料不足'};
  const REL_ICON={high:'●',medium:'⚠',low:'●'};
  const REL_COLOR={high:'var(--gn)',medium:'var(--am)',low:'var(--rd)'};
  function coverageTier(pct){return pct>=REL_HIGH?'high':(pct>=REL_MED?'medium':'low');}
  // A trend delta spans two months — reliability must reflect whichever
  // month is weaker, not just the current one (see report section 三).
  function combinedTier(curPct,prevPct){
    if(prevPct==null)return coverageTier(curPct);
    const a=coverageTier(curPct),b=coverageTier(prevPct);
    return REL_RANK[a]<=REL_RANK[b]?a:b;
  }
  function coverageBadge(label,pct){
    const t=coverageTier(pct);
    return `<span style="color:${REL_COLOR[t]}">${label} ${pct.toFixed(0)}% ${REL_ICON[t]} ${REL_LABEL[t]}</span>`;
  }
  // Ongoing / future month status — separate concern from coverage: even a
  // fully-tagged ongoing month is not a finished monthly result yet (see
  // report section 十二/十三).
  function monthStatus(monthKey){
    if(monthKey>curKey)return'future';
    if(monthKey===curKey)return'ongoing';
    return'complete';
  }
  function monthStatusBadge(monthKey){
    const st=monthStatus(monthKey);
    if(st==='ongoing')return' <span style="font-size:13px;font-weight:400;color:var(--am)">（進行中，本月尚未結束）</span>';
    if(st==='future')return' <span style="font-size:13px;font-weight:400;color:var(--rd)">（預告 / 未完整月份，僅供參考）</span>';
    return'';
  }

  // Phase 5A.6: Monthly Trend Explorer — 12-month drill-down for a single
  // provider/mechanic/theme, computed entirely from the existing
  // D.monthly.by_month (no new payload, no Snapshot). Chronological order is
  // built by explicit unshift, never by iterating an object's/Set's keys, so
  // output order is deterministic regardless of any month's internal key
  // insertion order.
  function monthsWindow(endMonth,n){
    const out=[];
    let [y,m]=endMonth.split('-').map(Number);
    for(let i=0;i<n;i++){
      out.unshift(`${y}-${String(m).padStart(2,'0')}`);
      m--;if(m===0){m=12;y--;}
    }
    return out;
  }
  function computeTrendSeries(entityType,entityName,endMonth){
    const months=monthsWindow(endMonth,12);
    return months.map(mo=>{
      const md2=MD.by_month[mo];
      const total=md2?md2.game_ids.length:0;
      if(entityType==='provider'){
        const count=md2?(md2.provider_counts[entityName]||0):0;
        let avgScore=null;
        if(md2&&count>0){
          const scores=monthGames(mo).filter(g=>(g.provider_normalized||g.provider_raw||'Unknown')===entityName).map(g=>g.score).filter(v=>v!=null);
          avgScore=scores.length?scores.reduce((a,b)=>a+b,0)/scores.length:null;
        }
        // share/avgScore null (not 0%) when there is literally no release
        // data for the month at all — see report section 七.
        return{month:mo,exists:!!md2,count,total,share:total?count/total*100:null,avgScore};
      }
      const counts=md2?(entityType==='mechanic'?md2.mechanic_counts:md2.theme_counts):{};
      const denom=md2?(entityType==='mechanic'?md2.mechanic_denom:md2.theme_denom):0;
      const count=counts[entityName]||0;
      const penetration=denom?count/denom*100:null;   // null (N/A), never 0%, when denom=0
      const coverage=total?denom/total*100:null;
      const reliability=coverage!=null?coverageTier(coverage):null;
      return{month:mo,exists:!!md2,count,denom,total,penetration,coverage,reliability};
    });
  }
  // Phase 5A.7: Trend Driver Drilldown — resolves a single 12-month-table row
  // back to the actual games behind that month's count. Membership must use
  // the exact same fields build_monthly_data() counted from (see Python:
  // provider_normalized||provider_raw, mechanics_leaf via set(), themes via
  // set()) so drilldown.length always equals pt.count — checking presence in
  // an array gives the same result as checking presence in a Python set,
  // since neither cares about duplicate occurrences within one game.
  function driverGames(entityType,entityName,month){
    const gs=monthGames(month);
    let filtered;
    if(entityType==='provider'){
      filtered=gs.filter(g=>(g.provider_normalized||g.provider_raw||'Unknown')===entityName);
    }else if(entityType==='mechanic'){
      filtered=gs.filter(g=>(g.mechanics_leaf||[]).includes(entityName));
    }else{
      filtered=gs.filter(g=>(g.themes||[]).includes(entityName));
    }
    // Deterministic order: score desc -> release date asc (all tied at the
    // month level here, since D.games only carries year/month precision) ->
    // name asc -> id asc.
    filtered.sort((a,b)=>{
      const sa=a.score!=null?a.score:-Infinity,sb=b.score!=null?b.score:-Infinity;
      if(sb!==sa)return sb-sa;
      if(a.name!==b.name)return a.name<b.name?-1:1;
      return a.id-b.id;
    });
    return filtered;
  }

  // Global entry point — called from inline onclick attributes generated by
