  // Phase 5A.5: all data computation lives here, shared by render() (HTML)
  // and buildMonthlyMarkdown() (export) — neither re-derives or re-scores
  // anything; both just format the same vm differently.
  function computeMonthlyViewModel(monthKey){
    const md=MD.by_month[monthKey];
    const gs=monthGames(monthKey);
    const total=gs.length;
    const monthIdSet=new Set(md.game_ids);
    const pmKey=prevMonthKey(monthKey);
    const pmd=MD.by_month[pmKey];
    const pgs=pmd?monthGames(pmKey):[];

    const curMechPct=md.mechanic_denom/total*100,curThemePct=md.theme_denom/total*100;
    const prevMechPct=(pmd&&pgs.length)?pmd.mechanic_denom/pgs.length*100:null;
    const prevThemePct=(pmd&&pgs.length)?pmd.theme_denom/pgs.length*100:null;

    const activeProviders=Object.keys(md.provider_counts).length;
    const seriesLinked=gs.filter(g=>getSeriesIdSet().has(g.id)).length;
    const pActiveProviders=pmd?Object.keys(pmd.provider_counts).length:null;
    const pSeriesLinked=pmd?pgs.filter(g=>getSeriesIdSet().has(g.id)).length:null;

    const provRows=Object.keys(md.provider_counts).map(p=>{
      const cur=md.provider_counts[p]||0;
      const prev=pmd?(pmd.provider_counts[p]||0):null;
      const scores=gs.filter(g=>(g.provider_normalized||g.provider_raw||'Unknown')===p).map(g=>g.score).filter(v=>v!=null);
      const avgS=scores.length?scores.reduce((a,b)=>a+b,0)/scores.length:null;
      return{name:p,cur,prev,diff:prev!=null?cur-prev:null,avgS};
    }).sort((a,b)=>b.cur-a.cur||a.name.localeCompare(b.name)).slice(0,10);

    const mechRows=penetrationRows(md.mechanic_counts,md.mechanic_denom,pmd?pmd.mechanic_counts:null,pmd?pmd.mechanic_denom:null);
    const growingMech=mechRows.filter(r=>r.deltaPp!=null&&r.deltaPp>0).sort((a,b)=>b.deltaPp-a.deltaPp||a.name.localeCompare(b.name)).slice(0,8);
    const decliningMech=mechRows.filter(r=>r.deltaPp!=null&&r.deltaPp<0).sort((a,b)=>a.deltaPp-b.deltaPp||a.name.localeCompare(b.name)).slice(0,8);
    const topMechByPen=mechRows.slice().sort((a,b)=>b.curPct-a.curPct||a.name.localeCompare(b.name)).slice(0,10);
    const mechTier=pmd?combinedTier(curMechPct,prevMechPct):null;

    const themeRows=penetrationRows(md.theme_counts,md.theme_denom,pmd?pmd.theme_counts:null,pmd?pmd.theme_denom:null);
    const growingTheme=themeRows.filter(r=>r.deltaPp!=null&&r.deltaPp>0).sort((a,b)=>b.deltaPp-a.deltaPp||a.name.localeCompare(b.name)).slice(0,8);
    const decliningTheme=themeRows.filter(r=>r.deltaPp!=null&&r.deltaPp<0).sort((a,b)=>a.deltaPp-b.deltaPp||a.name.localeCompare(b.name)).slice(0,8);
    const topThemeByPen=themeRows.slice().sort((a,b)=>b.curPct-a.curPct||a.name.localeCompare(b.name)).slice(0,10);
    const themeTier=pmd?combinedTier(curThemePct,prevThemePct):null;

    const topRated=gs.filter(g=>g.score!=null).sort((a,b)=>b.score-a.score||a.id-b.id).slice(0,5);
    const disagreement=gs.map(g=>{
      const vals=[scoreNum100(g.cgscore),scoreNum100(g.sc_rating),scoreNum100(g.bwb_rating)].filter(v=>v!=null);
      const gap=vals.length>=2?Math.max(...vals)-Math.min(...vals):null;
      return{g,gap};
    }).filter(x=>x.gap!=null&&x.gap>=25).sort((a,b)=>b.gap-a.gap||a.g.id-b.g.id).slice(0,5);
    const rareTagSet=new Set(mechRows.filter(r=>r.c>0&&r.c<MIN_TAG_SUPPORT).map(r=>r.name));
    const mechOutliers=gs.filter(g=>(g.mechanics_leaf||[]).some(m=>rareTagSet.has(m))).slice(0,5);

    const SRD=window.SERIES_RESEARCH_DATA;
    const reskinThisMonth=[],sequelThisMonth=[];
    if(SRD){
      Object.entries(SRD.CS).forEach(([sn,cs])=>{
        cs.classified.forEach(cg=>{
          if(!monthIdSet.has(cg.id))return;
          if(cg.cls==='reskin'||cg.cls==='enhanced')reskinThisMonth.push({...cg,seriesName:sn});
          else if(cs.games.length>1&&cg.id!==cs.core?.id)sequelThisMonth.push({...cg,seriesName:sn});
        });
      });
    }

    let newSeries=[],continuedSeries=[],concentrated=[];
    if(SRD){
      Object.entries(SRD.SG).forEach(([sn,members])=>{
        const monthMembers=members.filter(g=>monthIdSet.has(g.id));
        if(!monthMembers.length)return;
        const sortedByYear=[...members].sort((a,b)=>(a.year||9999)-(b.year||9999));
        if(monthMembers.some(g=>g.id===sortedByYear[0].id)&&members.length===monthMembers.length){
          newSeries.push({sn,count:monthMembers.length});
        } else {
          continuedSeries.push({sn,count:monthMembers.length});
        }
        if(monthMembers.length>=2)concentrated.push({sn,count:monthMembers.length});
      });
      [newSeries,continuedSeries,concentrated].forEach(arr=>arr.sort((a,b)=>b.count-a.count||a.sn.localeCompare(b.sn)));
    }

    const RD=window.RADAR_DATA;
    let notableProviders=[];
    if(RD){
      const providersThisMonth=new Set(Object.keys(md.provider_counts));
      const seen=new Set();
      [...RD.candidates,...RD.rapidGrowth,...RD.styleCands].forEach(p=>{
        if(providersThisMonth.has(p.name)&&!seen.has(p.name)){seen.add(p.name);notableProviders.push(p);}
      });
      notableProviders.sort((a,b)=>(b.prio?.score||b.recent||0)-(a.prio?.score||a.recent||0)||a.name.localeCompare(b.name));
    }
    const notableGames=WL.filter(g=>monthIdSet.has(g.id)).sort((a,b)=>a.name.localeCompare(b.name));

    return {
      monthKey, md, gs, total, monthIdSet, pmKey, pmd, pgs,
      status:monthStatus(monthKey),
      curMechPct, prevMechPct, curThemePct, prevThemePct, mechTier, themeTier,
      activeProviders, seriesLinked, pActiveProviders, pSeriesLinked,
      provRows, mechRows, growingMech, decliningMech, topMechByPen,
      themeRows, growingTheme, decliningTheme, topThemeByPen,
      topRated, disagreement, mechOutliers, reskinThisMonth, sequelThisMonth,
      newSeries, continuedSeries, concentrated,
      hasSRD:!!SRD, hasRD:!!RD, notableProviders, notableGames,
    };
  }

    secC.appendChild(barChart(vm.topMechByPen.map(r=>[r.name,Math.round(r.curPct*10)/10]),{color:'var(--am)',limit:10,pctLabel:true}));

        <div><div style="font-size:12px;font-weight:700;margin-bottom:6px">Suspected Reskin / New Series</div>${(vm.reskinThisMonth.length||vm.sequelThisMonth.length)?[...vm.reskinThisMonth.slice(0,3).map(g=>gameChip(g,'疑似換皮 · '+g.seriesName)),...vm.sequelThisMonth.slice(0,3).map(g=>gameChip(g,'系列續作 · '+g.seriesName))].join(''):'<div style="font-size:12px;color:var(--txd)">本月無系列/換皮相關訊號</div>'}</div>

      <div style="font-size:12px;color:var(--txd);margin-bottom:10px">沿用「系列研究 / 換皮判斷」既有分類結果，不重新計算相似度演算法。</div>
      <div class="g2">
        <div><div style="font-size:12px;font-weight:700;margin-bottom:6px">新系列（本月首次出現）</div>${vm.hasSRD?seriesList(vm.newSeries,'本月無新系列'):'<div style="font-size:12px;color:var(--txd)">系列研究資料尚未載入</div>'}</div>
        <div><div style="font-size:12px;font-weight:700;margin-bottom:6px">系列續作</div>${vm.hasSRD?seriesList(vm.continuedSeries,'本月無系列續作'):''}</div>

        <div><div style="font-size:12px;font-weight:700;margin-bottom:6px">同系列集中發行（同月 ≥2 款）</div>${vm.hasSRD?seriesList(vm.concentrated,'本月無集中發行系列'):''}</div>
      </div>`;
    body.appendChild(secF);

    // ── Section G: Emerging / Watchlist ─────────────────────────────────────
    const secG=mk('div','card');
    secG.innerHTML=`<div class="ct">值得追蹤 (Emerging / Watchlist)</div>
      <div style="font-size:12px;color:var(--txd);margin-bottom:10px">「值得關注」沿用新興廠商雷達既有規則分類結果；「值得研究」為目前研究工作台中，本月發行的遊戲。</div>
      <div class="g2">
        <div><div style="font-size:12px;font-weight:700;margin-bottom:6px">本月值得關注 Provider</div>${vm.hasRD?(vm.notableProviders.length?vm.notableProviders.slice(0,8).map(p=>`<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--bd);font-size:13px"><span>${p.name}</span><span style="color:var(--txd)">${md.provider_counts[p.name]||0} 款本月</span></div>`).join(''):'<div style="font-size:12px;color:var(--txd)">本月無新興廠商雷達候選有發行</div>'):'<div style="font-size:12px;color:var(--txd)">新興廠商雷達資料尚未載入</div>'}</div>
        <div><div style="font-size:12px;font-weight:700;margin-bottom:6px">本月值得研究 Game（研究工作台）</div>${vm.notableGames.length?vm.notableGames.slice(0,8).map(g=>gameChip(g,'')).join(''):'<div style="font-size:12px;color:var(--txd)">研究工作台中無本月發行遊戲</div>'}</div>
      </div>`;

  render();
})();

// ── Research Workbench ────────────────────────────────────────────────────────
(function(){
  const s=qs('#s-workbench');
  const sh=mk('div','sh');
  sh.innerHTML='<div class="st">研究工作台</div><div class="ss">管理研究任務 · 追蹤截圖進度 · 產出 AI Prompt</div>';
  s.appendChild(sh);

  const TABS=[
    {key:'status',label:'依狀態'},
    {key:'priority',label:'依優先'},
    {key:'goal',label:'依目標'},
    {key:'ready',label:'可分享'},
    {key:'missing',label:'缺截圖'},
    {key:'prompt',label:'Prompt 產出'},
  ];
  let activeTab='status';
  const tabBar=mk('div','wb-tabs');
  const content=mk('div','');
  s.append(tabBar,content);

  function renderTab(){
    content.innerHTML='';
    tabBar.querySelectorAll('.wb-tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===activeTab));
    if(activeTab==='prompt'){renderPromptBuilder();return;}
    if(!WL.length){content.innerHTML='<div style="padding:40px;text-align:center;color:var(--txd)">研究板尚無任務<br><span style="font-size:12px">從遊戲瀏覽、新興廠商雷達或系列偵測頁面加入</span></div>';return;}
    const groups={};
    if(activeTab==='status'){
      WL_STATUSES.forEach(st=>{const items=WL.filter(g=>g.research_status===st);if(items.length)groups[st]=items;});
    }else if(activeTab==='priority'){
      ['High','Medium','Low'].forEach(p=>{const items=WL.filter(g=>g.priority===p);if(items.length)groups[p]=items;});
    }else if(activeTab==='goal'){
      WL_GOALS.forEach(goal=>{const items=WL.filter(g=>(g.research_goal||[]).includes(goal));if(items.length)groups[goal]=items;});
    }else if(activeTab==='ready'){
      const items=WL.filter(g=>g.research_status==='可分享');
      if(items.length)groups['可分享']=items;else{content.innerHTML='<div style="padding:40px;text-align:center;color:var(--txd)">尚無「可分享」狀態的任務</div>';return;}
    }else if(activeTab==='missing'){
      const items=WL.filter(g=>WL_SS_KEYS.some(k=>!(g.screenshot_checklist||{})[k]));
      if(items.length)groups['缺少截圖']=items;else{content.innerHTML='<div style="padding:40px;text-align:center;color:var(--gn)">截圖全部齊備！</div>';return;}
    }
    if(!Object.keys(groups).length){content.innerHTML='<div style="padding:40px;text-align:center;color:var(--txd)">此篩選下無符合任務</div>';return;}
    Object.entries(groups).forEach(([groupName,items])=>{
      const sec=mk('div','');sec.style.marginBottom='24px';
      const col=WL_STATUS_COL[groupName]||WL_PRIO_COL[groupName]||'var(--txm)';
      const ghdr=mk('div','');ghdr.style.cssText='display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--bd)';
      ghdr.innerHTML=`<span style="font-size:13px;font-weight:700;color:${col}">${groupName}</span><span style="font-size:12px;color:var(--txd)">${items.length} 項</span>`;
      sec.appendChild(ghdr);
      items.forEach(g=>sec.appendChild(makeTaskCard(g)));
      content.appendChild(sec);
    });
  }

  function makeTaskCard(g){
    const card=mk('div','task-card');
    const ss=g.screenshot_checklist||{};
    const prioCol=WL_PRIO_COL[g.priority]||'var(--txd)';
    const statCol=WL_STATUS_COL[g.research_status]||'var(--txd)';
    const head=mk('div','task-card-head');
    head.innerHTML=`<div class="task-card-title">${g.name}</div><span class="status-pill" style="color:${prioCol};border-color:${prioCol}">${g.priority}</span><span class="status-pill" style="color:${statCol};border-color:${statCol};margin-left:4px">${g.research_status}</span>`;
    card.appendChild(head);
    const meta=mk('div','');meta.style.cssText='font-size:12px;color:var(--txd);margin-bottom:8px;line-height:1.6';
    meta.textContent=`${g.provider_normalized||g.provider||'?'} · ${g.year||'?'} · 分數 ${g.score!=null?Number(g.score).toFixed(1):'—'} · 生態系 ${g.ecosystem||'Unknown'}`;
    card.appendChild(meta);
    if((g.research_goal||[]).length){
      const gb=mk('div','');gb.style.cssText='display:flex;flex-wrap:wrap;gap:3px;margin-bottom:8px';
      g.research_goal.forEach(goal=>{const sp=mk('span','radar-tag rt-active');sp.style.padding='1px 5px';sp.textContent=goal;gb.appendChild(sp);});
      card.appendChild(gb);
    }
    const infoGrid=mk('div','');infoGrid.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:12px;margin-bottom:10px';
    [['分類',g.variant_type||'未判斷'],['加入原因',g.added_reason||'—']].forEach(([lbl,val])=>{
      const cell=mk('div','');cell.innerHTML=`<span style="color:var(--txd);font-weight:600">${lbl}：</span>${val}`;infoGrid.appendChild(cell);
    });
    if(g.video_url){const cell=mk('div','');cell.innerHTML=`<span style="color:var(--txd);font-weight:600">Video：</span><a href="${g.video_url}" target="_blank" style="color:var(--bl)">${g.video_url.slice(0,35)}</a>`;infoGrid.appendChild(cell);}
    if(g.source_url){const cell=mk('div','');cell.innerHTML=`<span style="color:var(--txd);font-weight:600">Source：</span><a href="${g.source_url}" target="_blank" style="color:var(--bl)">開啟</a>`;infoGrid.appendChild(cell);}
    card.appendChild(infoGrid);
    if(g.notes){const nn=mk('div','');nn.style.cssText='font-size:12px;color:var(--txd);padding:6px 10px;background:var(--sfh);border:1px solid var(--bd);margin-bottom:8px';nn.textContent='筆記：'+g.notes;card.appendChild(nn);}
    const ssDiv=mk('div','ss-check');
    WL_SS_KEYS.forEach(k=>{
      const sp=mk('span','ss-badge '+(ss[k]?'ss-done':'ss-miss'));sp.textContent=(ss[k]?'✓ ':'✗ ')+WL_SS_LABELS[k];ssDiv.appendChild(sp);
    });
    card.appendChild(ssDiv);
    const editRow=mk('div','');editRow.style.cssText='display:flex;gap:6px;margin-top:10px;flex-wrap:wrap';
    const statSel=document.createElement('select');statSel.className='series-select';statSel.style.cssText='font-size:11px;padding:3px 6px;flex:1;min-width:100px';
    WL_STATUSES.forEach(st=>{const o=document.createElement('option');o.value=st;o.textContent=st;if(st===g.research_status)o.selected=true;statSel.appendChild(o);});
    statSel.onchange=()=>{wlUpdate(g.name,{research_status:statSel.value});renderTab();};
    const editBtn=mk('button','');editBtn.style.cssText='padding:4px 10px;background:none;border:1px solid var(--am);color:var(--am);font-family:inherit;font-size:11px;cursor:pointer';editBtn.textContent='編輯';
    editBtn.onclick=()=>{wlShowEditModal(g.name);};
    const deepBtn=mk('button','');deepBtn.style.cssText='padding:4px 10px;background:none;border:1px solid var(--vi);color:var(--vi);font-family:inherit;font-size:11px;cursor:pointer';deepBtn.textContent='深度拆解 Prompt';
    deepBtn.onclick=()=>{
      const cur=wlGet(g.name)||g;const txt=promptDeep(cur);
      if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast('Prompt 已複製！'));else dlBlob(txt,'prompt.txt','text/plain');
    };
    const rmBtn=mk('button','');rmBtn.style.cssText='padding:4px 10px;background:none;border:1px solid var(--rd);color:var(--rd);font-family:inherit;font-size:11px;cursor:pointer';rmBtn.textContent='移除';
    rmBtn.onclick=()=>{if(confirm(`移除「${g.name}」？`)){wlRemove(g.name);renderTab();}};
    editRow.append(statSel,editBtn,deepBtn,rmBtn);
    // Phase 6C: legacy items added before `id` existed on every WL entry
    // (or added via some other path that dropped it) skip this button
    // entirely rather than guessing/fuzzy-matching a game — per phase scope.
    if(g.id!=null){
      const detBtn=mk('button','');detBtn.style.cssText='padding:4px 10px;background:none;border:1px solid var(--bd);color:var(--txd);font-family:inherit;font-size:11px;cursor:pointer';detBtn.textContent='詳情';
      detBtn.onclick=()=>window.openGameDetail(g.id);
      editRow.appendChild(detBtn);
    }
    const cur2=wlGet(g.name)||g;
    const urlRow=mk('div','');urlRow.style.cssText='display:flex;gap:6px;margin-top:4px;flex-wrap:wrap';
    if(cur2.source_url){const a=mk('a','');a.href=cur2.source_url;a.target='_blank';a.style.cssText='padding:4px 10px;border:1px solid var(--bl);color:var(--bl);font-size:11px;text-decoration:none;cursor:pointer;font-family:inherit';a.textContent='Source';urlRow.appendChild(a);}
    if(cur2.video_url){const a=mk('a','');a.href=cur2.video_url;a.target='_blank';a.style.cssText='padding:4px 10px;border:1px solid var(--bl);color:var(--bl);font-size:11px;text-decoration:none;cursor:pointer;font-family:inherit';a.textContent='Video';urlRow.appendChild(a);}
    card.append(editRow);if(cur2.source_url||cur2.video_url)card.appendChild(urlRow);
    return card;
  }

  function renderPromptBuilder(){
    const pCard=mk('div','card');pCard.style.marginBottom='20px';
    const ph=mk('div','ct');ph.textContent='Prompt 產出器';pCard.appendChild(ph);

    const selDiv=mk('div','');selDiv.style.cssText='margin:12px 0';
    const selLbl=mk('label','wl-modal-label');selLbl.style.marginTop='0';selLbl.textContent='選擇遊戲（可複選）';selDiv.appendChild(selLbl);
    const gameChecks=mk('div','');gameChecks.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:3px;max-height:160px;overflow-y:auto;border:1px solid var(--bd);padding:8px;margin-top:4px';
    const selectedGames=new Set();
    WL.forEach(g=>{
      const lbl=document.createElement('label');lbl.className='wl-goal-check';lbl.style.fontSize='12px';
      const cb=document.createElement('input');cb.type='checkbox';
      cb.onchange=()=>{if(cb.checked)selectedGames.add(g.name);else selectedGames.delete(g.name);};
      lbl.append(cb,document.createTextNode(' '+g.name));gameChecks.appendChild(lbl);
    });
    selDiv.appendChild(gameChecks);
    const selAllRow=mk('div','');selAllRow.style.cssText='display:flex;gap:6px;margin-top:6px';
    const selAll=mk('button','seg-btn');selAll.textContent='全選';selAll.onclick=()=>{gameChecks.querySelectorAll('input').forEach(cb=>{cb.checked=true;selectedGames.add(cb.closest('label').textContent.trim());});};
    const selNone=mk('button','seg-btn');selNone.textContent='清除';selNone.onclick=()=>{gameChecks.querySelectorAll('input').forEach(cb=>{cb.checked=false;});selectedGames.clear();};
    selAllRow.append(selAll,selNone);selDiv.appendChild(selAllRow);
    pCard.appendChild(selDiv);

    const tmplLbl=mk('label','wl-modal-label');tmplLbl.style.marginTop='0';tmplLbl.textContent='Prompt 模板';pCard.appendChild(tmplLbl);
    const tmplSel=document.createElement('select');tmplSel.className='series-select';tmplSel.style.cssText='width:100%;margin:4px 0 12px';
    [{v:'scan',t:'快速掃描版 — 批次判斷研究價值'},{v:'series',t:'系列差異版 — 系列演化分析'},{v:'deep',t:'單款深度拆解版 — 選一款遊戲'},{v:'meeting',t:'分享會版 — 整理討論素材'}].forEach(({v,t})=>{
      const o=document.createElement('option');o.value=v;o.textContent=t;tmplSel.appendChild(o);
    });
    pCard.appendChild(tmplSel);

    const genBtn=mk('button','prompt-action-btn');genBtn.style.cssText='width:100%;justify-content:center;padding:10px;margin-bottom:10px;background:var(--vi1);border-color:var(--vi);color:var(--vi)';genBtn.textContent='生成 Prompt';
    const outWrap=mk('div','');outWrap.style.display='none';
    const outArea=document.createElement('textarea');outArea.readOnly=true;outArea.style.cssText='width:100%;min-height:200px;background:var(--bg);border:1px solid var(--bd);color:var(--tx);padding:10px;font-family:inherit;font-size:12px;box-sizing:border-box;resize:vertical;line-height:1.6';
    const copyBtn=mk('button','prompt-action-btn');copyBtn.style.cssText='width:100%;justify-content:center;margin-top:6px;padding:8px';copyBtn.textContent='複製到剪貼簿';
    const dlBtn=mk('button','prompt-action-btn');dlBtn.style.cssText='width:100%;justify-content:center;margin-top:4px;padding:6px;font-size:11px';dlBtn.textContent='下載 prompt.txt';
    outWrap.append(outArea,copyBtn,dlBtn);
    genBtn.onclick=()=>{
      const games=WL.filter(g=>selectedGames.has(g.name));
      let txt='';
      if(tmplSel.value==='deep'){
        if(games.length===0){toast('單款深度拆解：請先勾選 1 款遊戲');return;}
        if(games.length>1){toast(`單款深度拆解只能選 1 款（目前已選 ${games.length} 款）`);return;}
        txt=promptDeep(games[0]);
      } else {
        if(!games.length){toast('請先勾選至少 1 款遊戲');return;}
        if(tmplSel.value==='scan')txt=promptScan(games);
        else if(tmplSel.value==='series')txt=promptSeries(games);
        else txt=promptMeeting(games);
      }
      outArea.value=txt;outWrap.style.display='block';
    };
    copyBtn.onclick=()=>{if(navigator.clipboard){navigator.clipboard.writeText(outArea.value).then(()=>toast('已複製！'));}else{outArea.select();document.execCommand('copy');toast('已複製！');}};
    dlBtn.onclick=()=>dlBlob(outArea.value,'prompt.txt','text/plain');
    pCard.append(genBtn,outWrap);content.appendChild(pCard);

    const expCard=mk('div','card');
    const eh=mk('div','ct');eh.textContent='匯出資料';expCard.appendChild(eh);
    const expRow=mk('div','');expRow.style.cssText='display:flex;gap:8px;margin-top:10px';
    [{label:'匯出 JSON（完整）',fn:()=>dlBlob(wlToJSON(),'research-board.json','application/json')},
     {label:'匯出 CSV（摘要）',fn:()=>dlBlob(wlToCSV(),'research-board.csv','text/csv;charset=utf-8')}
    ].forEach(({label,fn})=>{
      const b=mk('button','prompt-action-btn');b.textContent=label;b.onclick=fn;b.style.cssText='flex:1;justify-content:center;padding:8px';expRow.appendChild(b);
    });
    expCard.appendChild(expRow);content.appendChild(expCard);
  }

  TABS.forEach(({key,label})=>{
    const btn=mk('button','wb-tab');btn.dataset.tab=key;btn.textContent=label;
    btn.onclick=()=>{activeTab=key;renderTab();};
    if(key===activeTab)btn.classList.add('on');
    tabBar.appendChild(btn);
  });
  wbRefresh=()=>renderTab();
  renderTab();
})();

// ── Theme toggle ──────────────────────────────────────────────────────────────
function toggleTheme(){
  const isLight=document.documentElement.classList.toggle('light');
  localStorage.setItem('slot_theme',isLight?'light':'dark');
  document.getElementById('theme-icon').textContent=isLight?'☾':'☀';
  document.getElementById('theme-label').textContent=isLight?'深色':'淺色';
}
(function(){
  const isLight=document.documentElement.classList.contains('light');
  const icon=document.getElementById('theme-icon');
  const label=document.getElementById('theme-label');
  if(icon) icon.textContent=isLight?'☾':'☀';
  if(label) label.textContent=isLight?'深色':'淺色';
})();
</script>
