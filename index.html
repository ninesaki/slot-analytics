// ── Router ──────────────────────────────────────────────────────────────────
function nav(id){
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('on'));
  document.querySelectorAll('.ni').forEach(n=>n.classList.toggle('on',n.dataset.s===id));
  const el=document.getElementById('s-'+id);
  if(el) el.classList.add('on');
}
document.querySelectorAll('.ni').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.s)));
// Phase 6A: "遊戲查詢" is the same #s-games section as "遊戲瀏覽" (shares
// data-s="games", so nav() above already handles showing it) — this just
// additionally pre-selects the 完整資料表 sub-tab so a first click lands
// straight on the actual search/filter table instead of the research-
// candidates tab. Looked up at click time (not cached) since Game Discovery
// builds #gd-tabs once at page load, well before this can ever fire.
(function(){
  const b=document.getElementById('nav-gsearch');
  if(!b)return;
  b.addEventListener('click',()=>{
    const t=document.querySelector('#gd-tabs [data-t="table"]');
    if(t)t.click();
  });
})();

// ── Utils ───────────────────────────────────────────────────────────────────
const mk=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.innerHTML=h;return e};
const qs=(s,p)=>(p||document).querySelector(s);
const qsa=(s,p)=>[...(p||document).querySelectorAll(s)];

// ── Game-by-id lookup (Phase 6A) ────────────────────────────────────────────
// Single site-wide id→game lookup. Before this, the only such map (in
// Monthly Competitive Analysis, Phase 5A) was private to that section's IIFE
// and unreachable from anywhere else — this replaces it as the one shared
// copy rather than adding a second (see report).
const GAME_BY_ID={};D.games.forEach(g=>{GAME_BY_ID[g.id]=g;});
// Safe source score formatter: 0-10 → ×10, already 0-100 → as-is. Hoisted
// out of the Game Discovery IIFE (was function-local there) so the shared
// Game Detail modal below can use the same formatting without a duplicate.
function fmtSrc(v){
  if(v==null)return'—';const n=Number(v);
  if(!Number.isFinite(n))return'—';
  return n<=10?(n*10).toFixed(0):n.toFixed(0);
}
function fmtSrcNum(v){
  if(v==null)return null;const n=Number(v);
  if(!Number.isFinite(n))return null;
  return n<=10?n*10:n;
}

// ── Shared Game Detail (Phase 6A) ───────────────────────────────────────────
// The only Game Detail rendering in the codebase used to be the "完整資料表"
// tab's per-row expandable <tr class="gd-drawer"> (Game Discovery IIFE),
// which only worked because it could reach into its own table row's DOM
// (insertAdjacentElement/nextElementSibling). That can't be called safely
// from other sections, so this extracts the same field set (same order,
// same labels, same gd-drawer-* classes) into one shared function and
// exposes it as a modal — the drawer's call site now opens this modal
// instead of building its own inline row (single source of truth, see
// report section 八).
function buildGameDetailBody(g){
  const srcLinks=[
    g.cgn_url?{label:'CasinoGamesOnNet',url:g.cgn_url}:null,
    g.sc_url?{label:'SlotCatalog',url:g.sc_url}:null,
    g.bwb_url?{label:'BigWinBoard',url:g.bwb_url}:null,
  ].filter(Boolean);
  const srcSectionHtml=srcLinks.length?`<div class="gd-drawer-section"><div class="gd-drawer-label">資料來源</div>
      <div class="gd-drawer-val" style="display:flex;flex-direction:column;gap:6px;align-items:flex-start">${srcLinks.map(s=>`<a href="${s.url}" target="_blank" rel="noopener noreferrer" class="gc-btn" style="font-size:11px;text-decoration:none">${s.label}</a>`).join('')}</div></div>`:'';
  return `<div class="gd-drawer-grid">
    <div class="gd-drawer-section"><div class="gd-drawer-label">基礎資料</div>
      <div class="gd-drawer-val">RTP：${g.rtp||'—'}<br>最高倍率：${g.max_win?g.max_win+'x':'—'}<br>輪軸：${g.reels||'—'}<br>波動：${g.volatility||'—'}<br>命中率：${g.hit_freq_pct!=null?g.hit_freq_pct.toFixed(1)+'%':'—'}</div></div>
    <div class="gd-drawer-section"><div class="gd-drawer-label">評分來源</div>
      <div class="gd-drawer-val"><span style="color:var(--txd);font-size:10px">CGN 數值吸引力</span><br>${g.cgscore!=null?g.cgscore.toFixed(0):'—'}<br><span style="color:var(--txd);font-size:10px">SlotCatalog 玩家評分</span><br>${fmtSrc(g.sc_rating)}<br><span style="color:var(--txd);font-size:10px">BWB 評價</span><br>${fmtSrc(g.bwb_rating)}</div></div>
    <div class="gd-drawer-section"><div class="gd-drawer-label">生態系</div>
      <div class="gd-drawer-val">${g.ecosystem||'—'}<br><span style="font-size:10px;color:var(--txd)">${g.ecosystem_confidence||''}</span></div></div>
    ${srcSectionHtml}
    <div class="gd-drawer-section"><div class="gd-drawer-label">全部機制（${(g.mechanics||[]).length}）</div>
      <div class="gd-drawer-val">${(g.mechanics||[]).map(m=>`<span class="tag tm" style="font-size:11px;margin:1px">${m}</span>`).join('')||'—'}</div></div>
    <div class="gd-drawer-section"><div class="gd-drawer-label">全部主題（${(g.themes||[]).length}）</div>
      <div class="gd-drawer-val">${(g.themes||[]).map(t=>`<span class="tag tt" style="font-size:11px;margin:1px">${t}</span>`).join('')||'—'}</div></div>
    <div class="gd-drawer-section"><div class="gd-drawer-label">操作</div>
      <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start">
        <button class="gc-btn" id="gdm-cp-name" style="font-size:11px">複製遊戲名稱</button>
        <button class="gc-btn" id="gdm-cp-prompt" style="font-size:11px">複製 Claude 分析 Prompt</button>
        <button class="gc-btn" id="gdm-ser-link" style="font-size:11px">查看系列偵測</button>
      </div></div>
  </div>`;
}
window.openGameDetail=function(gameId){
  const g=GAME_BY_ID[gameId];
  if(!g){toast('找不到這款遊戲資料',false);return;}
  const ov=mk('div','wl-modal-overlay');
  const modal=mk('div','wl-modal');
  modal.style.width='620px';
  const metaLine=`${g.provider_normalized||g.provider||'?'} · ${g.year||'?'} · 分數 ${g.score!=null?Number(g.score).toFixed(1):'N/A'}`;
  modal.innerHTML=`
    <div class="wl-modal-title">${g.name}<br><span style="font-size:11px;color:var(--txd);font-weight:400">${metaLine}</span></div>
    <div style="max-height:60vh;overflow-y:auto;margin:10px 0">${buildGameDetailBody(g)}</div>
    <div style="display:flex;gap:8px">
      <button id="gdm-wl" class="wl-add${wlHas(g.name)?' added':''}" style="flex:1;padding:8px">${wlHas(g.name)?'✓ 已加入 Watchlist':'加入 Watchlist'}</button>
      <button id="gdm-close" style="flex:1;padding:8px;background:none;border:1px solid var(--bd);color:var(--txd);font-family:inherit;font-size:13px;cursor:pointer">關閉</button>
    </div>`;
  modal.querySelector('#gdm-cp-name').onclick=()=>{navigator.clipboard?.writeText(g.name);toast('已複製：'+g.name);};
  modal.querySelector('#gdm-cp-prompt').onclick=()=>{
    const pt='請分析以下 slot 遊戲：「'+g.name+'」（廠商：'+(g.provider||'?')+'，年份：'+(g.year||'?')+'）\\n機制：'+((g.mechanics||[]).join('、')||'未知')+'\\nRTP：'+(g.rtp||'?')+'，最高倍率：'+(g.max_win?g.max_win+'x':'?');
    navigator.clipboard?.writeText(pt);toast('已複製分析 Prompt');
  };
  modal.querySelector('#gdm-ser-link').onclick=()=>{
    ov.remove();
    if(window.srGoToSeries){window.srGoToSeries(g.series_group||g.name||'');}
    else{const b=qs('[data-s="series"]');if(b)b.click();toast('已切換到系列研究 / 換皮判斷');}
  };
  const wlBtn=modal.querySelector('#gdm-wl');
  wlBtn.onclick=()=>{
    if(wlHas(g.name)){wlRemove(g.name);wlBtn.textContent='加入 Watchlist';wlBtn.classList.remove('added');}
    else wlShowAddModal(g,ok=>{if(ok){wlBtn.textContent='✓ 已加入 Watchlist';wlBtn.classList.add('added');}});
  };
  modal.querySelector('#gdm-close').onclick=()=>ov.remove();
  ov.appendChild(modal);document.body.appendChild(ov);
  ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});
};

// ── Top 3 快速洞察 ────────────────────────────────────────────────────────────
const RANK_COLORS=['#f0a500','#7a8eab','#9b7ef8'];
const RANK_LABELS=['1','2','3'];

function top3Card(title, items){
  // items: [{label, value, sub}]  (最多3筆)
  const card=mk('div','card');
  card.style.cssText='flex:1;min-width:0;padding:14px 16px';
  card.innerHTML=`<div class="ct">${title}</div>`;
  items.slice(0,3).forEach((item,i)=>{
    const row=mk('div','');
    row.style.cssText='display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--bd)';
    if(i===items.slice(0,3).length-1) row.style.borderBottom='none';
    const rank=mk('div','');
    rank.style.cssText=`width:24px;height:24px;border-radius:50%;background:${RANK_COLORS[i]}22;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:${RANK_COLORS[i]};flex-shrink:0`;
    rank.textContent=RANK_LABELS[i];
    const info=mk('div','');
    info.style.cssText='flex:1;min-width:0';
    info.innerHTML=`<div style="font-size:14px;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${item.label}">${item.label}</div>${item.sub?`<div style="font-size:12px;color:var(--txd);margin-top:2px">${item.sub}</div>`:''}`;
    const val=mk('div','');
    val.style.cssText='font-size:14px;font-weight:600;color:var(--am);font-variant-numeric:tabular-nums;flex-shrink:0';
    val.textContent=item.value??'';
    row.append(rank,info,val);
    card.appendChild(row);
  });
  return card;
}

function top3Row(cards){
  const row=mk('div','');
  row.style.cssText='display:flex;gap:14px;margin-bottom:20px';
  cards.forEach(c=>row.appendChild(c));
  return row;
}

// ── Toast ─────────────────────────────────────────────────────────────────────
const toastEl=mk('div','');toastEl.id='toast';document.body.appendChild(toastEl);
let _toastTimer=null;
function toast(msg,ok=true){
  toastEl.textContent=msg;
  toastEl.style.borderColor=ok?'var(--gn)':'var(--rd)';
  toastEl.style.color=ok?'var(--gn)':'var(--rd)';
  toastEl.style.opacity='1';
  clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>{toastEl.style.opacity='0';},2200);
}

// ── Reliability Badge ─────────────────────────────────────────────────────────
const SOURCE_META={
  all3:    {color:'var(--gn)',  label:'三來源驗證'},
  both:    {color:'#7ecfb3',   label:'CGN + SC'},
  cgn_bwb: {color:'var(--am)', label:'CGN + BWB'},
  sc_bwb:  {color:'var(--vi)', label:'SC + BWB'},
  cgn:     {color:'var(--txd)',label:'僅 CGN'},
  sc:      {color:'var(--bl)', label:'僅 SC'},
  bwb:     {color:'#e96f6f',   label:'僅 BWB'},
  none:    {color:'#444',      label:'無評分'},
};
function reliabilityBadge(count,source){
  const b=mk('span','rel-badge');
  const m=SOURCE_META[source]||{color:'#444',label:source};
  b.style.cssText=`border-color:${m.color};color:${m.color}`;
  b.innerHTML=`<span>${m.label}</span><span style="opacity:.6;margin-left:4px">${count} 款</span>`;
  return b;
}
function reliabilityRow(games){
  const counts={};
  games.forEach(g=>{const s=g.source||'none';counts[s]=(counts[s]||0)+1;});
  const row=mk('div','rel-row');
  ['all3','both','cgn_bwb','sc_bwb','cgn','sc','bwb','none'].forEach(s=>{
    if(counts[s]>0) row.appendChild(reliabilityBadge(counts[s],s));
  });
  return row;
}

// ── Prompt Button ─────────────────────────────────────────────────────────────
function promptBtn(buildFn,label='複製 AI 分析 Prompt'){
  const wrap=mk('div','prompt-action-wrap');
  const btn=mk('button','prompt-action-btn');
  btn.innerHTML=`<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1z"/><path d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5z"/><rect x="3" y="7" width="10" height="1"/><rect x="3" y="10" width="10" height="1"/><rect x="3" y="13" width="7" height="1"/></svg> ${label}`;
  btn.onclick=()=>{
    const txt=buildFn();
    if(navigator.clipboard){
      navigator.clipboard.writeText(txt).then(()=>toast('Prompt 已複製！'),()=>toast('複製失敗，請手動複製。',false));
    } else {
      const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Prompt 已複製！');
    }
  };
  wrap.appendChild(btn);
  return wrap;
}

// ── Prompt Builders ───────────────────────────────────────────────────────────
function buildProviderPrompt(name,stats,topMechs,topThemes,sigMechs){
  const mechList=(topMechs||[]).slice(0,8).map(([m])=>m).join(', ');
  const themeList=(topThemes||[]).slice(0,5).map(([t])=>t).join(', ');
  const sigList=(sigMechs||[]).slice(0,5).map(s=>`${s.name}(${s.ratio}×avg)`).join(', ');
  return `你是一位資深博弈遊戲競品分析師。請根據以下數據，對 ${name} 進行深度策略分析。

【遊戲商基本數據】
- 遊戲總數：${(stats||{}).count||'N/A'} 款
- 平均綜合分數：${(stats||{}).avg_score||'N/A'} / 100
- 平均 CGN 分數：${(stats||{}).avg_cgn||'N/A'}
- 平均 SC 評分：${(stats||{}).avg_sc||'N/A'}

【機制特徵】
- 熱門機制：${mechList||'N/A'}
- 招牌機制（vs 市場平均）：${sigList||'N/A'}

【主題特徵】
- 熱門主題：${themeList||'N/A'}

請提供：
1. ${name} 的產品策略定位（機制組合代表什麼遊玩體驗？目標玩家是誰？）
2. 相較市場平均，${name} 的差異化優勢與潛在弱點
3. 若我方要與 ${name} 競爭，應優先佈局哪些機制或主題切入？
4. 建議 3 個可借鑑的設計方向（具體到機制層）`;
}

function buildMechPrompt(name,providerList,yearTrend,topGames){
  const provs=(providerList||[]).slice(0,8).map(p=>p[0]).join(', ');
  const trend=(yearTrend||[]).slice(-5).map(y=>`${y.year}:${y.pct}%`).join(', ');
  const games=(topGames||[]).slice(0,5).map(g=>`${g.name}(${g.provider},${g.score}分)`).join('; ');
  return `你是一位資深博弈遊戲機制研究員。請根據以下數據，分析「${name}」這個遊戲機制的市場潛力與設計應用。

【機制市場數據】
- 主要使用遊戲商：${provs||'N/A'}
- 近五年採用趨勢：${trend||'N/A'}
- 代表性高分遊戲：${games||'N/A'}

請提供：
1. 「${name}」的核心玩法體驗是什麼？為什麼玩家喜歡這個機制？
2. 目前採用此機制的遊戲商有哪些明顯的設計差異或變體？
3. 趨勢分析：此機制是上升、成熟還是衰退期？背後原因？
4. 若我方要開發含「${name}」的新遊戲，有哪些創新的機制搭配或設計切入點？
5. 需要特別注意的設計風險或玩家期待管理問題？`;
}

// ── Watchlist Config ──────────────────────────────────────────────────────────
const WL_GOALS=['玩法機制','系列差異','美術','FX','UI','題材','新興廠商','RGS/Publisher 生態','分享會候選'];
const WL_STATUSES=['候選','待試玩','已截圖','已拆機制','已美術分析','已 FX 分析','可分享','已歸檔'];
const WL_VARIANT_TYPES=['未判斷','純換皮','換皮加強','機制變體','分支玩法','新題材樣本','新廠商樣本','Data Noise / 待清理'];
const WL_SS_KEYS=['base_game','info_page','feature_trigger','free_spins','big_win','bonus_buy','special_mechanic'];
const WL_SS_LABELS={base_game:'Base Game',info_page:'Info Page',feature_trigger:'Feature Trigger',free_spins:'Free Spins',big_win:'Big Win',bonus_buy:'Bonus Buy',special_mechanic:'Special Mechanic'};
const WL_STATUS_COL={'候選':'var(--txd)','待試玩':'var(--am)','已截圖':'var(--bl)','已拆機制':'var(--vi)','已美術分析':'var(--vi)','已 FX 分析':'var(--vi)','可分享':'var(--gn)','已歸檔':'var(--txd)'};
const WL_PRIO_COL={High:'var(--rd)',Medium:'var(--am)',Low:'var(--txd)'};

// ── Prompt Templates ──────────────────────────────────────────────────────────
function _gb(g,i){
  const ss=g.screenshot_checklist||{};
  const miss=WL_SS_KEYS.filter(k=>!ss[k]).map(k=>WL_SS_LABELS[k]);
  return `${i+1}. **${g.name}** — ${g.provider_normalized||g.provider||'?'} (${g.year||'?'})

// ── WL Core ───────────────────────────────────────────────────────────────────
let wbRefresh=null;
let WL=[];
(function(){
  try{WL=JSON.parse(localStorage.getItem('slot_wl')||'[]');}catch(e){WL=[];}
  WL=WL.map(wlMigrateItem);wlSave();
})();
function wlMigrateItem(g){
  const out={...g};
  if(!out.id)out.id=String(Date.now()+Math.random());
  if(!out.added_at)out.added_at=new Date().toISOString();
  if(out.added_reason===undefined)out.added_reason='';
  if(!out.research_goal)out.research_goal=[];
  if(!out.research_status)out.research_status='候選';
  if(!out.variant_type)out.variant_type='未判斷';
  if(!out.priority)out.priority='Medium';
  if(out.notes===undefined)out.notes='';
  if(!out.screenshot_checklist)out.screenshot_checklist={};
  WL_SS_KEYS.forEach(k=>{if(out.screenshot_checklist[k]===undefined)out.screenshot_checklist[k]=false;});
  if(out.video_url===undefined)out.video_url='';
  if(out.extra_source_url===undefined)out.extra_source_url='';
  if(!out.provider_normalized)out.provider_normalized=out.provider||'';
  if(!out.provider_group)out.provider_group=out.provider||'';
  return out;
}
function wlSave(){localStorage.setItem('slot_wl',JSON.stringify(WL));}
function wlHas(name){return WL.some(g=>g.name===name);}
function wlGet(name){return WL.find(g=>g.name===name);}
function wlAdd(game,meta={}){
  if(wlHas(game.name))return;
  const item=wlMigrateItem({...game,...meta});
  WL.push(item);wlSave();wlRender();if(wbRefresh)wbRefresh();
  toast(`已加入研究板：${game.name}`);
}
function wlUpdate(name,upd){
  const i=WL.findIndex(g=>g.name===name);if(i<0)return;
  Object.assign(WL[i],upd);wlSave();
}
function wlRemove(name){WL=WL.filter(g=>g.name!==name);wlSave();wlRender();if(wbRefresh)wbRefresh();toast(`已移除：${name}`);}
function wlToCSV(){
  if(!WL.length)return'';
  const h='名稱,遊戲商,年份,分數,RTP,最高倍率,生態系,優先度,研究狀態,研究目的,分類,加入原因,筆記,截圖進度';
  const rows=WL.map(g=>{
    const ss=g.screenshot_checklist||{};
    const done=WL_SS_KEYS.filter(k=>ss[k]).length;
    return[g.name,g.provider_normalized||g.provider||'',g.year||'',g.score||'',g.rtp||'',g.max_win||'',
      g.ecosystem||'',g.priority||'',g.research_status||'',(g.research_goal||[]).join('|'),
      g.variant_type||'',g.added_reason||'',g.notes||'',`${done}/${WL_SS_KEYS.length}`
    ].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',');
  });
  return[h,...rows].join('\\n');
}
function wlToJSON(){return JSON.stringify(WL,null,2);}
function dlBlob(content,name,type){const a=mk('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();}

function wlShowAddModal(game,onDone,prefill={}){
  if(wlHas(game.name)){wlRemove(game.name);if(onDone)onDone(false);return;}
  const ov=mk('div','wl-modal-overlay');
  const modal=mk('div','wl-modal');
  const selectedGoals=new Set(prefill.research_goal||[]);
  let selectedPrio=prefill.priority||'Medium';
  modal.innerHTML=`
    <div class="wl-modal-title">加入研究板：${game.name}</div>
    <div style="font-size:12px;color:var(--txd);margin-bottom:12px">${game.provider||''} · ${game.year||''} · score ${game.score!=null?Number(game.score).toFixed(1):'N/A'}</div>
    <label class="wl-modal-label">加入原因</label>
    <input class="wl-modal-input" id="wlm-reason" placeholder="例如：換皮確認、Le Slots 對照組…" value="${(prefill.added_reason||'').replace(/"/g,'&quot;')}">
    <label class="wl-modal-label">研究目的（可複選）</label>
    <div class="wl-goals-grid" id="wlm-goals"></div>
    <label class="wl-modal-label">優先度</label>
    <div class="wl-prio-row" id="wlm-prio"></div>
    <div style="display:flex;gap:8px;margin-top:18px">
      <button id="wlm-cancel" style="flex:1;padding:8px;background:none;border:1px solid var(--bd);color:var(--txd);font-family:inherit;font-size:13px;cursor:pointer">取消</button>
      <button id="wlm-ok" style="flex:2;padding:8px;background:var(--am);border:none;color:#000;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer">加入研究板</button>
    </div>`;
  const goalsDiv=modal.querySelector('#wlm-goals');
  WL_GOALS.forEach(g2=>{
    const lbl=document.createElement('label');lbl.className='wl-goal-check';
    const cb=document.createElement('input');cb.type='checkbox';cb.checked=selectedGoals.has(g2);
    cb.onchange=()=>{if(cb.checked)selectedGoals.add(g2);else selectedGoals.delete(g2);};
    lbl.append(cb,document.createTextNode(g2));goalsDiv.appendChild(lbl);
  });
  const prioDiv=modal.querySelector('#wlm-prio');
  ['High','Medium','Low'].forEach(p=>{
    const btn=mk('button','wl-prio-btn');btn.textContent=p;
    if(p===selectedPrio)btn.classList.add(`active-${p}`);
    btn.onclick=()=>{
      prioDiv.querySelectorAll('.wl-prio-btn').forEach(b=>b.className='wl-prio-btn');
      btn.classList.add(`active-${p}`);selectedPrio=p;
    };
    prioDiv.appendChild(btn);
  });
  modal.querySelector('#wlm-cancel').onclick=()=>ov.remove();
  modal.querySelector('#wlm-ok').onclick=()=>{
    const reason=modal.querySelector('#wlm-reason').value.trim();
    wlAdd(game,{added_reason:reason,research_goal:[...selectedGoals],priority:selectedPrio,...(prefill.variant_type?{variant_type:prefill.variant_type}:{})});
    ov.remove();if(onDone)onDone(true);
  };
  ov.appendChild(modal);document.body.appendChild(ov);
  ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});
  setTimeout(()=>modal.querySelector('#wlm-reason').focus(),50);
}

function wlRadarAdd(provName,priority){
  const SI=D.series_index||D.games;
  const recent=SI.filter(g=>(g.provider_normalized||g.provider_raw||'')===provName&&(g.year||0)>=2023)
    .sort((a,b)=>(b.score||0)-(a.score||0)).slice(0,6);
  if(!recent.length){toast(`${provName} 無 2023 年後遊戲資料`);return;}
  const ov=mk('div','wl-modal-overlay');
  const modal=mk('div','wl-modal');
  const sel=new Set(recent.map(g=>g.name));
  let selPrio=priority||'Medium';
  const html=`
    <div class="wl-modal-title">加入研究板 — ${provName}</div>
    <div style="font-size:12px;color:var(--txd);margin-bottom:10px">選擇近期遊戲（${recent.length} 款，預設全選）</div>
    <div id="brm-games" style="max-height:200px;overflow-y:auto;border:1px solid var(--bd);padding:8px;margin-bottom:12px"></div>
    <label class="wl-modal-label">加入原因</label>
    <input class="wl-modal-input" id="brm-reason" value="新興廠商雷達 — ${provName}">
    <label class="wl-modal-label">優先度</label>
    <div class="wl-prio-row" id="brm-prio"></div>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button id="brm-cancel" style="flex:1;padding:8px;background:none;border:1px solid var(--bd);color:var(--txd);font-family:inherit;font-size:13px;cursor:pointer">取消</button>
      <button id="brm-ok" style="flex:2;padding:8px;background:var(--am);border:none;color:#000;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer">批次加入</button>
    </div>`;
  modal.innerHTML=html;
  const gDiv=modal.querySelector('#brm-games');
  recent.forEach(g=>{
    const lbl=document.createElement('label');lbl.className='wl-goal-check';lbl.style.cssText='justify-content:space-between;flex:1;min-width:0';
    const cb=document.createElement('input');cb.type='checkbox';cb.checked=!wlHas(g.name);
    if(wlHas(g.name)){cb.checked=false;cb.disabled=true;}
    cb.onchange=()=>{if(cb.checked)sel.add(g.name);else sel.delete(g.name);};
    const info=mk('span','');info.style.fontSize='12px';
    info.textContent=`${g.name} · ${g.year||'?'} · ${g.score!=null?Number(g.score).toFixed(1):'—'}${wlHas(g.name)?' ✓（已加入）':''}`;
    lbl.append(cb,info);
    // Phase 6C: SI comes from D.series_index/D.games, so g.id is always
    // present — no legacy-data guard needed. Kept as a sibling of the
    // <label> (not nested) so clicking it doesn't also toggle the checkbox.
    const row=mk('div','');row.style.cssText='display:flex;align-items:center;gap:6px';
    row.appendChild(lbl);
    if(g.id!=null){
      const detBtn=mk('button','gc-btn');detBtn.style.cssText='font-size:10px;padding:2px 6px;flex-shrink:0';detBtn.textContent='詳情';
      detBtn.onclick=(e)=>{e.preventDefault();e.stopPropagation();window.openGameDetail(g.id);};
      row.appendChild(detBtn);
    }
    gDiv.appendChild(row);
    if(!wlHas(g.name))sel.add(g.name);else sel.delete(g.name);
  });
  const prioDiv=modal.querySelector('#brm-prio');
  ['High','Medium','Low'].forEach(p=>{
    const btn=mk('button','wl-prio-btn');btn.textContent=p;
    if(p===selPrio)btn.classList.add(`active-${p}`);
    btn.onclick=()=>{prioDiv.querySelectorAll('.wl-prio-btn').forEach(b=>b.className='wl-prio-btn');btn.classList.add(`active-${p}`);selPrio=p;};
    prioDiv.appendChild(btn);
  });
  modal.querySelector('#brm-cancel').onclick=()=>ov.remove();
  modal.querySelector('#brm-ok').onclick=()=>{
    const reason=modal.querySelector('#brm-reason').value.trim();
    let added=0;
    recent.filter(g=>sel.has(g.name)&&!wlHas(g.name)).forEach(g=>{
      wlAdd(g,{added_reason:reason,research_goal:['新興廠商'],priority:selPrio,variant_type:'新廠商樣本'});added++;
    });
    ov.remove();if(added)toast(`已加入 ${added} 款 ${provName} 遊戲`);
  };
  ov.appendChild(modal);document.body.appendChild(ov);
  ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});
}

function barChart(items,{color='var(--am)',total,limit=20,pctLabel=false}={}){
  const top=items.slice(0,limit);
  const max=top[0]?.[1]||1;
  const div=mk('div','bc');
  top.forEach(([name,val])=>{
    const pct=val/max;
    const absPct=total?(val/total*100).toFixed(1)+' %':'';
    const row=mk('div','br');
    row.innerHTML=`<div class="bn" title="${name}">${name}</div><div class="bt"><div class="bf" style="width:${pct*100}%;background:${color}"></div></div><div class="bv">${pctLabel?(val.toFixed(1)+'%'):val} <span class="bpct">${absPct}</span></div>`;
    div.appendChild(row);
  });
  return div;
}

function lineChart(datasets,years,{h=180}={}){
  const W=620,H=h,PL=38,PR=12,PT=14,PB=28;
  const cW=W-PL-PR,cH=H-PT-PB;
  const allVals=datasets.flatMap(d=>years.map(y=>d.values[y]||0));
  const maxV=Math.max(...allVals,1);
  const xs=i=>PL+(i/(Math.max(years.length-1,1)))*cW;
  const ys=v=>PT+cH-(v/maxV)*cH;
  let svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="overflow:visible">`;
  [0,.25,.5,.75,1].forEach(t=>{
    const y=PT+cH*(1-t),v=Math.round(maxV*t);
    svg+=`<line x1="${PL}" x2="${PL+cW}" y1="${y}" y2="${y}" stroke="var(--bd)" stroke-width="1"/>`;
    if(t>0)svg+=`<text x="${PL-5}" y="${y+4}" text-anchor="end" font-size="9" fill="var(--txd)" font-variant-numeric="tabular-nums">${v}</text>`;
  });
  years.forEach((yr,i)=>{
    svg+=`<text x="${xs(i)}" y="${PT+cH+18}" text-anchor="middle" font-size="10" fill="var(--txd)">${yr}</text>`;
  });
  datasets.forEach(({color,values})=>{
    const pts=years.map((y,i)=>[xs(i),ys(values[y]||0)]);
    const path='M '+pts.map(p=>p.join(',')).join(' L ');
    svg+=`<path d="${path} L ${pts.at(-1)[0]},${PT+cH} L ${pts[0][0]},${PT+cH} Z" fill="${color}" opacity=".1"/>`;
    svg+=`<path d="${path}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach(([x,y])=>svg+=`<circle cx="${x}" cy="${y}" r="2.5" fill="${color}" stroke="var(--sf)" stroke-width="1.5"/>`);
  });
  svg+='</svg>';
  const w=mk('div','lc-wrap');w.innerHTML=svg;return w;
}

// ── Completeness — split into 3 categories ────────────────────────────────────
// 1. Source completeness: where did this data come from?
function sourceCompleteness(g){
  const checks=[
    {k:'source_url',v:g.source_url},
    {k:'source_type',v:g.source_type},
    {k:'source_reliability',v:g.source_reliability},
  ];
  const filled=checks.filter(c=>c.v!=null&&c.v!=='').length;
  return{filled,total:checks.length,checks};
}
// 2. Ecosystem completeness: studio/RGS/publisher/aggregator identity
function ecosystemCompleteness(g){
  const hasEco=g.ecosystem&&g.ecosystem!=='Unknown';
  const hasConf=g.ecosystem_confidence&&g.ecosystem_confidence!=='Unknown';
  const checks=[
    {k:'studio',v:g.studio},
    {k:'rgs',v:g.rgs},
    {k:'publisher',v:g.publisher},
    {k:'aggregator',v:g.aggregator},
    {k:'ecosystem',v:hasEco?g.ecosystem:null},
    {k:'ecosystem_confidence',v:hasConf?g.ecosystem_confidence:null},
  ];
  const filled=checks.filter(c=>c.v!=null).length;
  return{filled,total:checks.length,checks};
}
// 3. Research completeness: has it been researched / verified?
function researchCompleteness(g){
  const checks=[{k:'research_status',v:g.research_status}];
  const filled=checks.filter(c=>c.v!=null).length;
  return{filled,total:checks.length,checks};
}
function _compLevel({filled,total}){
  const r=total?filled/total:0;
  return r>=1?'full':r>=0.5?'part':'miss';
}
function completenessBadge(g){
  const sc=sourceCompleteness(g),ec=ecosystemCompleteness(g),rc=researchCompleteness(g);
  const tip=`來源 ${sc.filled}/${sc.total} · 生態系 ${ec.filled}/${ec.total} · 研究 ${rc.filled}/${rc.total}`;
  return[
    `<span class="dc-chip dc-${_compLevel(sc)}" title="${tip}" style="padding:1px 5px;font-size:10px">S${sc.filled}</span>`,
    `<span class="dc-chip dc-${_compLevel(ec)}" title="${tip}" style="padding:1px 5px;font-size:10px">E${ec.filled}</span>`,
    `<span class="dc-chip dc-${_compLevel(rc)}" title="${tip}" style="padding:1px 5px;font-size:10px">R${rc.filled}</span>`,
  ].join(' ');
}

function scoreTag(g){
  if(g.score==null)return'<span style="color:var(--txd)">—</span>';
  const v=g.score.toFixed(1);
  if(g.source==='both')return`<span class="score-val sb-both">${v}</span>`;
  if(g.source==='cgn') return`<span class="score-val sb-cgn">${v}</span>`;
  return`<span class="score-val sb-sc">${v}</span>`;
}

// ── Provider Strategy ────────────────────────────────────────────────────────
(function(){
  const s=qs('#s-provider');
  const RECENT=['2024','2025','2026'];

  // Pre-compute derived metrics for each provider
  const pdata={};
  Object.entries(D.providers).forEach(([name,p])=>{
    const rc=RECENT.reduce((sum,y)=>sum+(p.by_year[y]||0),0);
    const yrKeys=Object.keys(p.by_year).sort();
    const latestYr=yrKeys.length?yrKeys[yrKeys.length-1]:'—';
    const maxYr=yrKeys.length?yrKeys.reduce((pk,y)=>((p.by_year[y]||0)>=(p.by_year[pk]||0)?y:pk),yrKeys[0]):'—';
    const size=p.count>=100?'大型廠商':p.count>=30?'中型廠商':p.count>=5?'小型廠商':'新興 / 資料少';
    const sizeKey=p.count>=100?'large':p.count>=30?'medium':p.count>=5?'small':'emerging';
    const act=rc>=10?'高度活躍':rc>=3?'仍有活躍':rc>=1?'低活躍':'近年未活躍';
    const actKey=rc>=10?'high':rc>=3?'active':rc>=1?'low':'inactive';
    const cred=p.count>=20?'高':p.count>=5?'中':p.count>=1?'低':'無';
    const credColor=p.count>=20?'var(--gn)':p.count>=5?'var(--am)':p.count>=1?'var(--rd)':'var(--txd)';
    const sigs=p.signature_mechs||[];
    const topLift=sigs.reduce((m,sm)=>Math.max(m,sm[3]||0),0);
    pdata[name]={...p,rc,latestYr,maxYr,size,sizeKey,act,actKey,cred,credColor,sigs,topLift};
  });
  const names=Object.keys(pdata).sort();

  // Section header
  s.innerHTML=`<div class="sh">
    <div class="st">遊戲商定位與研究入口</div>
    <div class="ss">了解各遊戲商的規模、活躍度、差異化機制與評分可信度 · ${names.length} 間遊戲商</div>
  </div>`;

  // ── 研究入口卡片 ──────────────────────────────────────────────────────────────
  // 大型標竿廠商：規模最大的廠商，依總遊戲數排序（非近三年）
  const benchmarks=names.filter(n=>pdata[n].count>=100).sort((a,b)=>pdata[b].count-pdata[a].count).slice(0,6);
  // 近期活躍廠商：排除大型廠商，依近期比例排序
  const benchSet=new Set(benchmarks);
  const actives=names.filter(n=>{
    const p=pdata[n];if(benchSet.has(n)||p.count<5)return false;
    const ratio=p.rc/Math.max(p.count,1);
    return p.rc>=3&&(ratio>=0.3||parseInt(p.latestYr)>=2025);
  }).sort((a,b)=>{
    const ra=pdata[a].rc/Math.max(pdata[a].count,1),rb=pdata[b].rc/Math.max(pdata[b].count,1);
    return rb-ra||pdata[b].rc-pdata[a].rc;
  }).slice(0,6);
  // 風格鮮明廠商：差異化機制顯著，topLift 需 > 0
  const styled=names.filter(n=>pdata[n].count>=5&&pdata[n].sigs.length>0&&pdata[n].topLift>0).sort((a,b)=>pdata[b].topLift-pdata[a].topLift).slice(0,5);

  function makeEntryCard(name,lines){

    c.onmouseenter=()=>c.style.borderColor='var(--am)';
    c.onmouseleave=()=>c.style.borderColor='var(--bd)';

    const wrap=mk('div','');wrap.style.marginBottom='22px';
    wrap.innerHTML=`<div style="font-size:13px;font-weight:700;color:var(--tx);margin-bottom:3px">${title}</div>

      p=>[`近三年：${p.rc} 款`,`近期比例：${Math.round(p.rc/Math.max(p.count,1)*100)}%`,`最新年份：${p.latestYr}`,`規模：${p.size}`]),
    entryGroup('風格鮮明廠商','差異化機制突出 · 玩法 DNA 參考',styled,
      p=>[`差異化機制：${p.sigs.slice(0,2).map(m=>m[0]).join('、')||'—'}`,`最高差異倍數：${p.topLift.toFixed(1)}×`,`可信度：${p.cred}`]),
  ].filter(Boolean).forEach(g=>entryWrap.appendChild(g));
  s.appendChild(entryWrap);

  // ── 篩選 + 遊戲商選單 ────────────────────────────────────────────────────────
  const selCard=mk('div','card');selCard.style.cssText='padding:16px 20px;margin-bottom:16px';

  [['name','排序：名稱'],['count','排序：遊戲數'],['recent','排序：近三年'],['sig','排序：差異化程度'],['cgn','排序：CGN 吸引力'],['sc','排序：SC 玩家評分']].forEach(([v,l])=>{
    const o=mk('option');o.value=v;o.textContent=l;sortSel.appendChild(o);
  });
  sortSel.onchange=rebuildSel;
  selCard.appendChild(sortSel);

  const psel=mk('select');psel.id='psel';
  psel.style.cssText='display:block;background:var(--sf);color:var(--tx);border:1px solid var(--bd);padding:6px 12px;font-family:inherit;font-size:13px;cursor:pointer;width:100%;max-width:460px;margin-top:4px';
  psel.onchange=renderProvider;
  selCard.appendChild(psel);

  const countLbl=mk('div','');countLbl.style.cssText='font-size:11px;color:var(--txd);margin-top:6px';
  selCard.appendChild(countLbl);
  s.appendChild(selCard);

  // Detail area
  const detailEl=mk('div','');detailEl.id='pdetail';
  s.appendChild(detailEl);

  // ── Helper functions ──────────────────────────────────────────────────────────
  function getFiltered(){
    const q=searchInput.value.trim().toLowerCase();
    return names.filter(n=>{
      const p=pdata[n];
      if(sizeF!=='all'&&p.sizeKey!==sizeF) return false;
      if(actF!=='all'&&p.actKey!==actF) return false;
      if(q&&!n.toLowerCase().includes(q)) return false;
      return true;
    }).sort((a,b)=>{
      const pa=pdata[a],pb=pdata[b],sv=sortSel.value;
      if(sv==='count') return pb.count-pa.count;
      if(sv==='recent') return pb.rc-pa.rc;
      if(sv==='sig') return pb.topLift-pa.topLift;
      if(sv==='cgn') return (pb.avg_cgscore||0)-(pa.avg_cgscore||0);
      if(sv==='sc') return (pb.avg_sc||0)-(pa.avg_sc||0);
      return a.localeCompare(b,'zh');
    });
  }

  function rebuildSel(){
    const cur=psel.value;
    const filtered=getFiltered();
    psel.innerHTML='';
    filtered.forEach(n=>{
      const p=pdata[n];
      const o=mk('option');o.value=n;
      o.textContent=`${n} （${p.size}・${p.act}）`;
      psel.appendChild(o);
    });
    if(filtered.includes(cur)) psel.value=cur;
    countLbl.textContent=`顯示 ${filtered.length} / ${names.length} 間遊戲商`;
    renderProvider();
  }

  function selectProvider(name){
    if(!getFiltered().includes(name)){
      sizeF='all';actF='all';searchInput.value='';
      Object.values(filterBtns.size).forEach(b=>b.classList.remove('on'));filterBtns.size['all'].classList.add('on');
      Object.values(filterBtns.act).forEach(b=>b.classList.remove('on'));filterBtns.act['all'].classList.add('on');
      rebuildSel();
    }
    psel.value=name;
    renderProvider();
    detailEl.scrollIntoView({behavior:'smooth',block:'start'});
  }

  function mkSparkline(byYear){
    const yrKeys=Object.keys(byYear).sort();
    if(yrKeys.length<2) return null;
    const vals=yrKeys.map(y=>byYear[y]||0);
    const maxV=Math.max(...vals)||1;
    const W=220,H=44;
    const NS='http://www.w3.org/2000/svg';
    const svg=document.createElementNS(NS,'svg');
    svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
    svg.style.cssText=`width:${W}px;height:${H}px;display:block;overflow:visible`;
    const pts=vals.map((v,i)=>`${Math.round(i/(vals.length-1)*(W-4)+2)},${Math.round((1-v/maxV)*(H-6)+3)}`);
    const area=document.createElementNS(NS,'polygon');
    area.setAttribute('points',`2,${H-1} ${pts.join(' ')} ${W-2},${H-1}`);
    area.setAttribute('fill','rgba(240,165,0,.08)');svg.appendChild(area);
    const line=document.createElementNS(NS,'polyline');
    line.setAttribute('points',pts.join(' '));
    line.setAttribute('fill','none');line.setAttribute('stroke','var(--am)');
    line.setAttribute('stroke-width','2');line.setAttribute('stroke-linejoin','round');line.setAttribute('stroke-linecap','round');
    svg.appendChild(line);
    RECENT.forEach(ry=>{
      const idx=yrKeys.indexOf(ry);if(idx<0)return;
      const cx=Math.round(idx/(vals.length-1)*(W-4)+2);
      const cy=Math.round((1-vals[idx]/maxV)*(H-6)+3);
      const dot=document.createElementNS(NS,'circle');
      dot.setAttribute('cx',cx);dot.setAttribute('cy',cy);dot.setAttribute('r','3');
      dot.setAttribute('fill','var(--gn)');svg.appendChild(dot);
    });
    return svg;
  }

  function actBlurb(p){
    if(p.rc>=10) return `近三年高度活躍（${p.rc} 款），${p.maxYr} 年附近為發布高峰。`;
    if(p.rc>=3) return `近三年仍有持續發布（${p.rc} 款）。`;
    if(p.rc>=1) return `近三年發布量低（${p.rc} 款），活躍度下降中。`;
    return `主要作品集中於早期年份，近三年無新作記錄。`;
  }

  function renderProvider(){
    const name=psel.value;
    if(!name||!pdata[name]){
      detailEl.innerHTML='<div style="padding:40px;text-align:center;color:var(--txd)">無符合篩選的遊戲商</div>';return;
    }
    const p=pdata[name];
    detailEl.innerHTML='';

    // ── 廠商概況 + 評分來源 ────────────────────────────────────────────────────

      <div style="display:flex;flex-direction:column;gap:0">
        ${[['規模分類',p.size,'var(--tx)'],['遊戲數',p.count+' 款','var(--am)'],['近三年作品',p.rc+' 款','var(--tx)'],['活躍度',p.act,'var(--tx)']].map(([k,v,c])=>`
        <div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--bd)">
          <span style="font-size:12px;color:var(--txm)">${k}</span>
          <span style="font-size:13px;font-weight:600;color:${c};font-variant-numeric:tabular-nums">${v}</span>

        <div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0">
          <span style="font-size:12px;color:var(--txm)">資料可信度</span>

        </div>
        ${p.count<5?'<div style="font-size:11px;color:var(--rd);margin-top:4px">樣本數過少，評分數據僅供參考。</div>':''}
        <div style="font-size:10px;color:var(--txd);margin-top:6px;font-style:italic">目前以遊戲數暫估可信度，未來可改用實際評分樣本數。</div>
      </div>`;
    r1.appendChild(ovCard);

    const scCard=mk('div','card');
    function sBlock(label,val,desc,color){

      ${sBlock('SlotCatalog 玩家評分',p.avg_sc!=null?p.avg_sc.toFixed(1):'—','訪客自行投票的平均分數，樣本數普遍很小，與其他來源相關性低，非遊戲品質指標。',p.avg_sc!=null?'var(--bl)':'var(--txd)')}
      <div style="padding:10px 0">

        <div style="font-size:12px;color:var(--txd);font-style:italic">目前此廠商尚無 Bigwinboard 平均資料。</div>
      </div>`;
    r1.appendChild(scCard);
    detailEl.appendChild(r1);

    // ── 發布節奏 ──────────────────────────────────────────────────────────────
    const yrKeys=Object.keys(p.by_year).sort();
    if(yrKeys.length>0){
      const rytCard=mk('div','card');rytCard.style.marginBottom='14px';
      const peakYr=yrKeys.reduce((pk,y)=>((p.by_year[y]||0)>=(p.by_year[pk]||0)?y:pk),yrKeys[0]);
      const topRow=mk('div','');topRow.style.cssText='display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px';

        <div style="font-size:12px;color:var(--txm);text-align:right;line-height:1.6">
          高峰年份：<b style="color:var(--am)">${peakYr}</b><br>近三年：${p.rc} 款

      rytCard.appendChild(topRow);

        bodyRow.appendChild(spkWrap);
      }
      const blurbEl=mk('div','');blurbEl.style.cssText='font-size:13px;color:var(--txm);font-style:italic;line-height:1.6;max-width:200px;flex-shrink:0';

    const sigCard=mk('div','card');sigCard.style.marginBottom='14px';
    sigCard.innerHTML=`<div class="ct">差異化機制</div>
      <div style="font-size:12px;color:var(--txd);margin-bottom:12px;font-style:italic">相較市場平均更常使用的機制，不等於官方招牌玩法。</div>`;
    if(p.count<5){
      sigCard.innerHTML+=`<div style="font-size:13px;color:var(--txd);padding:6px 0">遊戲數不足 5 款，無法計算差異化機制。</div>`;
    } else if(!p.sigs.length){
      sigCard.innerHTML+=`<div style="font-size:13px;color:var(--txd);padding:6px 0">此廠商目前無顯著差異化機制資料。</div>`;
    } else {
      const sg=mk('div','');sg.style.cssText='display:flex;flex-direction:column;gap:6px';
      p.sigs.slice(0,5).forEach(([mn,pr2,gr,lift])=>{

        const row2=mk('div','');
        row2.style.cssText='padding:10px 14px;background:var(--sfh);border:1px solid var(--bd)';

            <div style="text-align:center">

// ── Year Trends ──────────────────────────────────────────────────────────────
(function(){
  const s=qs('#s-year');
  const years=Object.keys(D.years).sort();
  s.innerHTML=`
    <div class="sh"><div class="st">年份趨勢</div><div class="ss">按發布年份的機制與主題採用率 · 熱力圖顯示當年遊戲使用各機制的比例</div></div>
    <div class="yp" id="yp"></div>
    <div id="yc"></div>
    <div class="card" style="margin-top:20px">
      <div class="ct">機制熱力圖 — 各年度使用該機制的遊戲比例</div>
      <div class="hm-wrap" id="hm"></div>
    </div>`;

  // Top 3 快速洞察 (global year trends)
  const sortedYears=years.slice().sort((a,b)=>(D.years[b]?.count||0)-(D.years[a]?.count||0));
  const sortedYearsByScore=years.filter(y=>D.years[y]?.avg_score!=null).sort((a,b)=>(D.years[b]?.avg_score||0)-(D.years[a]?.avg_score||0));
  const latestYd=D.years[years[years.length-1]]||{};
  s.insertBefore(top3Row([
    top3Card('最多遊戲年份 Top 3', sortedYears.slice(0,3).map(y=>({label:y+'年',value:(D.years[y]?.count||0)+'款',sub:''}))),
    top3Card('最高平均分年份 Top 3', sortedYearsByScore.slice(0,3).map(y=>({label:y+'年',value:D.years[y]?.avg_score?.toFixed(1),sub:(D.years[y]?.count||0)+'款遊戲'}))),
    top3Card('最新年熱門機制 Top 3', (latestYd.top_mechanics||[]).slice(0,3).map(([l,v])=>({label:l,value:v+'款',sub:''}))),
  ]), s.firstChild);

  let cur=years[years.length-2]||years[years.length-1];
  const yp=qs('#yp');
  years.forEach(yr=>{
    const b=mk('button','ybtn'+(yr===cur?' on':''));
    b.textContent=yr;b.dataset.y=yr;
    b.addEventListener('click',()=>{qsa('.ybtn',yp).forEach(p=>p.classList.remove('on'));b.classList.add('on');cur=yr;renderYear();});
    yp.appendChild(b);
  });

  const COLORS=['var(--am)','var(--bl)','var(--vi)','var(--gn)','#e05252'];

  function renderYear(){
    const yd=D.years[cur];const c=qs('#yc');c.innerHTML='';
    if(!yd){c.innerHTML='<p style="color:var(--txm);padding:20px 0">No data.</p>';return;}
    const avgStr=yd.avg_score!=null?` · 平均分 ${yd.avg_score}`:'';
    if(D.mechanics_trend&&years.length>1){
      const top5=yd.top_mechanics.slice(0,5).map(m=>m[0]);
      const ds=top5.map((m,i)=>({label:m,color:COLORS[i%COLORS.length],values:D.mechanics_trend[m]||{}})).filter(d=>Object.values(d.values).some(v=>v>0));
      if(ds.length>0){
        const tc=mk('div','card');tc.style.marginBottom='16px';
        tc.innerHTML=`<div class="ct">機制採用趨勢 — ${cur} 年前 5 名</div>`;
        tc.appendChild(lineChart(ds,years));
        const leg=mk('div','lc-legend');
        ds.forEach(d=>{leg.innerHTML+=`<span style="color:${d.color}">■ ${d.label}</span>`;});
        tc.appendChild(leg);c.appendChild(tc);
      }
    }
    const g=mk('div','g2');
    const mc=mk('div','card');mc.innerHTML=`<div class="ct">${cur} 年熱門機制 · ${yd.count} 款遊戲${avgStr}</div>`;
    mc.appendChild(barChart(yd.top_mechanics,{color:'var(--bl)',total:yd.count}));
    g.appendChild(mc);
    const tc=mk('div','card');tc.innerHTML=`<div class="ct">${cur} 年熱門主題</div>`;
    tc.appendChild(barChart(yd.top_themes||[],{color:'var(--vi)',total:yd.count}));
    g.appendChild(tc);c.appendChild(g);
  }

  // Build heatmap
  function buildHeatmap(){
    const hm=qs('#hm');hm.innerHTML='';
    const mechs=D.heatmap.mechs;
    const hmYears=D.heatmap.years;
    const data=D.heatmap.data;
    // Find global max for color scaling
    let max=0;
    mechs.forEach(m=>{hmYears.forEach(y=>{max=Math.max(max,data[m]?.[y]||0);});});
    if(max===0)return;

    // Header row
    const headerRow=mk('div','');
    headerRow.style.cssText=`display:grid;grid-template-columns:160px repeat(${hmYears.length},40px);gap:2px;margin-bottom:2px`;
    headerRow.appendChild(mk('div',''));
    hmYears.forEach(y=>{
      const cell=mk('div','hm-label-x');cell.textContent=y.slice(2);
      headerRow.appendChild(cell);
    });
    hm.appendChild(headerRow);

    // Data rows
    mechs.forEach(m=>{
      const row=mk('div','');
      row.style.cssText=`display:grid;grid-template-columns:160px repeat(${hmYears.length},40px);gap:2px`;
      const label=mk('div','hm-label-y');label.textContent=m;label.title=m;
      row.appendChild(label);
      hmYears.forEach(y=>{
        const v=(data[m]?.[y])||0;
        const t=v/max;
        const cell=mk('div','hm-cell');
        cell.title=`${m} · ${y}: ${v.toFixed(1)}%`;
        if(t>0.01){
          const r=Math.round(240*t),g2=Math.round(165*t),b=0;
          cell.style.background=`rgba(${r},${g2},${b},${0.15+t*0.75})`;
          if(t>0.4) cell.textContent=v.toFixed(0);
        }
        row.appendChild(cell);
      });
      hm.appendChild(row);
    });
  }

  renderYear();
  buildHeatmap();
})();

function normM(m){return MECH_ALIASES[m]||m;}
function conf(n){return n>=30?'高':n>=10?'中':n>=5?'中低':'低';}
function confColor(n){return n>=30?'var(--gn)':n>=10?'var(--bl)':n>=5?'var(--am)':'var(--rd)';}
function catOf(m){return MECH_DICT[m]?.cat||'待確認';}
function avg(arr){return arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:null;}
function pct(n,d){return d?Math.round(n/d*100):0;}
function scoreN(g){
  const v=[g.cgscore!=null?Number(g.cgscore):null,
    g.sc_rating!=null?Number(g.sc_rating)*10:null,
    g.bwb_rating!=null?Number(g.bwb_rating)*10:null]
    .filter(v=>v!=null&&isFinite(v));
  return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;
}

// Build mechMap from D.games (normalized keys)
// Priority: g.mechanics_leaf (Python-computed canonical leaf names — already
// fully normalized, must NOT be run through normM() again). Only falls back
// to the legacy (mechanics_normalized||mechanics).map(normM) path for games
// that predate mechanics_leaf (shouldn't happen in current data, but keeps
// this from erroring on stale/partial payloads).
const mechMap={};
D.games.forEach(g=>{
  const mechs=g.mechanics_leaf||(g.mechanics_normalized||g.mechanics||[]).map(normM);
  const yr=String(g.year||'');
  const sc=scoreN(g);
  const cgn=g.cgscore!=null&&isFinite(Number(g.cgscore))?Number(g.cgscore):null;
  const uniq=new Set(mechs);
  uniq.forEach(m=>{
    if(!mechMap[m])mechMap[m]={count:0,games:[],scores:[],cgnScores:[],years:{}};
    mechMap[m].count++;
    if(g.name)mechMap[m].games.push(g);
    if(sc!=null)mechMap[m].scores.push(sc);
    if(cgn!=null)mechMap[m].cgnScores.push(cgn);
    if(yr)mechMap[m].years[yr]=(mechMap[m].years[yr]||0)+1;
  });
});
Object.values(mechMap).forEach(d=>{d.avgScore=avg(d.scores);d.avgCgn=avg(d.cgnScores);});

const total=D.games.length;
const mechList=Object.entries(mechMap).map(([m,d])=>({m,cat:catOf(m),...d})).sort((a,b)=>b.count-a.count);

const unknownList=mechList.filter(d=>!knownSet.has(d.m)&&d.count>=2).sort((a,b)=>b.count-a.count);
const yearKeys=Object.keys(D.years||{}).filter(y=>Number(y)>=2019).sort();

// 常見搭配：改讀 Python 算好的 2 項組合資料（D.combos.pair），不再用舊的
// D.cooc / 別名反查邏輯。回傳格式比照舊版 [[partnerName, count], ...] 供既有
// renderDetail() 呼叫端沿用，但可讀性資訊已經是 mechanics_leaf 等級。
function getCooc(mechName){
  const pairs=(D.combos&&D.combos.pair)||[];
  const rows=pairs.filter(p=>p.items.includes(mechName));
  if(!rows.length)return null;
  return rows.sort((a,b)=>b.support-a.support).slice(0,8)
    .map(p=>[p.items.find(x=>x!==mechName), p.support]);
}

}

function renderDetail(mechName,panelEl){
  const d=mechMap[mechName];
  const dictEntry=MECH_DICT[mechName];
  const cat=catOf(mechName);
  const catColor=CAT_COLORS[cat]||'var(--txd)';
  const catBg=CAT_BG[cat]||'rgba(126,146,170,.10)';
  const n=d?d.count:0;
  const panel=mk('div','mm-detail-card');

  let html=`<div class="mm-detail-title">${mechName}</div>`;
  // Badges row
  html+=`<div class="mm-detail-badges">`;
  html+=`<span class="mm-detail-cat" style="color:${catColor};background:${catBg}">${cat}</span>`;
  if(dictEntry){
    if(dictEntry.owner&&dictEntry.owner!=='通用')html+=`<span class="mm-detail-owner">${dictEntry.owner}</span>`;
    const ssColor=STATUS_COLORS[dictEntry.sourceStatus]||'var(--txd)';
    const ssBg=STATUS_BG[dictEntry.sourceStatus]||'rgba(126,146,170,.10)';
    html+=`<span class="mm-status-badge" style="color:${ssColor};background:${ssBg}" title="${dictEntry.sourceNote||''}">${dictEntry.sourceStatus||'未標示'}</span>`;
  } else {
    html+=`<span class="mm-status-badge" style="color:var(--rd);background:var(--rd1)">待人工確認</span>`;
  }
  html+=`</div>`;

  // ── Structural metadata (Python D.mechanic_meta) — additive, does not
  // replace the existing cat/owner/sourceStatus badges above. Renders nothing
  // if this leaf has no mechanic_meta entry (e.g. still-unclassified tags).
  const meta=D.mechanic_meta&&D.mechanic_meta[mechName];
  if(meta){
    html+=`<div class="mm-detail-stats" style="margin-bottom:12px">`;
    if(meta.entityType==='archetype'){
      html+=`<div class="mm-stat-row"><span class="mm-stat-label">類型</span><span class="mm-stat-val" style="color:var(--vi)">玩法模板 / 市場仿作（非單一機制，不計入機制組合統計）</span></div>`;
    } else {
      const roleColor=ROLE_COLORS[meta.primaryRole]||'var(--txd)';
      html+=`<div class="mm-stat-row"><span class="mm-stat-label">主要分類</span><span class="mm-stat-val" style="color:${roleColor}">${meta.primaryRole||'—'}</span></div>`;
      if(meta.roles&&meta.roles.length)
        html+=`<div class="mm-stat-row"><span class="mm-stat-label">其他角色</span><span class="mm-stat-val">${meta.roles.join('、')}</span></div>`;
      if(meta.parentMechanics&&meta.parentMechanics.length){
        const links=meta.parentMechanics.map(p=>`<a href="#" class="mm-parent-link" data-m="${p}" style="color:var(--bl);text-decoration:underline;cursor:pointer">${p}</a>`).join('、');
        html+=`<div class="mm-stat-row"><span class="mm-stat-label">上位概念</span><span class="mm-stat-val">${links}</span></div>`;
      }
      if(meta.ownershipType)
        html+=`<div class="mm-stat-row"><span class="mm-stat-label">性質</span><span class="mm-stat-val">${OWNERSHIP_LABELS[meta.ownershipType]||meta.ownershipType}</span></div>`;
    }
    html+=`</div>`;
  }

  // Description
  if(dictEntry){
    html+=`<div class="mm-detail-desc">${dictEntry.desc}</div>`;
    if(dictEntry.gameplay)html+=`<div class="mm-detail-extra"><div class="mm-detail-extra-label">玩法設計重點</div>${dictEntry.gameplay}</div>`;
    if(dictEntry.fxImpact)html+=`<div class="mm-detail-extra"><div class="mm-detail-extra-label">FX / 製作負擔</div>${dictEntry.fxImpact}</div>`;
    if(dictEntry.examples&&dictEntry.examples.length){
      html+=`<div class="mm-detail-section-title">字典參考作品</div><div class="mm-dict-examples">`;
      dictEntry.examples.forEach(e=>html+=`<span class="mm-dict-ex-tag">${e}</span>`);
      html+=`</div>`;
    }
    if(dictEntry.sourceNote)html+=`<div class="mm-source-note">${dictEntry.sourceNote}</div>`;
  } else {
    html+=`<div class="mm-detail-unknown-note">此機制尚未建立可信說明，可能是品牌專有名詞、單款遊戲功能、資料標記差異或爬蟲誤抓。建議查看代表遊戲規則頁或影片確認後再加入字典。</div>`;
  }

  // Stats
  html+=`<div class="mm-detail-stats">`;
  html+=`<div class="mm-stat-row"><span class="mm-stat-label">全站遊戲數</span><span class="mm-stat-val">${n.toLocaleString()} 款</span></div>`;
  html+=`<div class="mm-stat-row"><span class="mm-stat-label">佔全站比例</span><span class="mm-stat-val">${pct(n,total)}%</span></div>`;
  if(d&&d.avgCgn!=null)html+=`<div class="mm-stat-row"><span class="mm-stat-label">CGN均分</span><span class="mm-stat-val" style="color:var(--am)">${d.avgCgn.toFixed(1)}</span></div>`;
  html+=`<div class="mm-stat-row"><span class="mm-stat-label">資料可信度</span><span class="mm-stat-val" style="color:${confColor(n)}">${conf(n)}（${n}款）</span></div>`;
  html+=`</div>`;

  // Provider evidence
  if(d&&d.games.length>0){
    const provCnt={};
    d.games.forEach(g=>{const p=g.provider||'—';provCnt[p]=(provCnt[p]||0)+1;});
    const provSorted=Object.entries(provCnt).sort((a,b)=>b[1]-a[1]).slice(0,5);
    const topProv=provSorted[0];
    const concentrated=topProv&&topProv[1]/n>=0.8&&n>=5;
    html+=`<div class="mm-detail-section-title">出現廠商分布</div><div class="mm-prov-evidence">`;
    provSorted.forEach(([prov,cnt])=>{
      const w=Math.round(cnt/n*100);
      html+=`<div class="mm-prov-row"><span class="mm-prov-name">${prov}</span><span class="mm-prov-cnt">${cnt}款</span><div class="mm-prov-bar-wrap"><div style="height:100%;width:${w}%;background:var(--bl)"></div></div><span class="mm-prov-pct">${w}%</span></div>`;
    });
    html+=`</div>`;
    if(concentrated)html+=`<div class="mm-prov-warn">⚠ 高度集中於 ${topProv[0]}（${Math.round(topProv[1]/n*100)}%），可能是品牌專有機制。</div>`;
    if(dictEntry?.owner&&dictEntry.owner!=='通用'&&topProv&&topProv[0]!==dictEntry.owner&&concentrated)
      html+=`<div class="mm-prov-conflict">⚠ 字典來源（${dictEntry.owner}）與資料分布（${topProv[0]} 主導）不一致，建議人工確認。</div>`;
  }

  // Co-occurring mechanics
  const cooc=getCooc(mechName);
  if(cooc&&cooc.length){
    html+=`<div class="mm-detail-section-title">常見搭配機制</div><div class="mm-cooc-list">`;
    cooc.slice(0,7).forEach(([other,cnt])=>{
      html+=`<div class="mm-cooc-row"><span class="mm-cooc-name">${other}</span><span class="mm-cooc-cnt">${cnt}款</span></div>`;
    });
    html+=`</div>`;
  }

  // Top games by CGN
  if(d&&d.games.length){
    const topG=d.games.filter(g=>g.cgscore!=null).sort((a,b)=>(Number(b.cgscore)||0)-(Number(a.cgscore)||0)).slice(0,5);
    if(topG.length){
      html+=`<div class="mm-detail-section-title">代表遊戲（CGN最高）</div><div class="mm-game-list">`;
      topG.forEach(g=>{html+=`<div class="mm-game-row"><span class="mm-game-name">${g.name}</span><span class="mm-game-sub">${g.provider||'—'} · ${g.year||'?'}</span><span class="mm-game-score">${Number(g.cgscore).toFixed(0)}</span></div>`;});
      html+=`</div>`;
    }
  }

  html+=`<div class="mm-detail-actions"><button class="mm-btn mm-btn-primary mm-copy-btn">複製研究提示詞</button></div>`;
  panel.innerHTML=html;
  panel.querySelectorAll('.mm-parent-link').forEach(a=>{
    a.addEventListener('click',e=>{e.preventDefault();renderDetail(a.dataset.m,panelEl);});
  });
  const copyBtn=panel.querySelector('.mm-copy-btn');
  const prompt=mkResearchPrompt(mechName,d,dictEntry);
  copyBtn.addEventListener('click',()=>{
    navigator.clipboard.writeText(prompt).catch(()=>{});
    copyBtn.textContent='已複製';setTimeout(()=>{copyBtn.textContent='複製研究提示詞';},2000);
  });
  panelEl.innerHTML='';panelEl.appendChild(panel);
}

// ── Tab 4: 機制組合 ────────────────────────────────────────────────────────
const REL_LABELS={'parent-child':'父子概念','brand-parent':'品牌上位','trigger-result':'觸發-結果','related':'獨立搭配'};
function comboLabel(items){return items.join(' + ');}
function comboDescription(items){
  const roles=[...new Set(items.map(m=>roleOf(m)).filter(Boolean))];
  return roles.length?('類型：'+roles.join(' + ')):'';
}
function renderCombos(){
  const combos=D.combos||{pair:[],triple:[],quadruple:[]};
  const bySize={2:combos.pair||[],3:combos.triple||[],4:combos.quadruple||[]};
  const hasAny=bySize[2].length+bySize[3].length+bySize[4].length>0;
  if(!hasAny){body.innerHTML='<div class="mm-empty">尚無機制組合資料。</div>';return;}

  const state={view:'template',size:3,minSupport:20,sortBy:'support',
    hideLowInfo:true,hideSubsumed:true,hideConcentrated:true,exploreMech:''};

  body.innerHTML=`
    <div class="mm-combo-ctrl" style="flex-wrap:wrap">
      <button class="mm-tab on" data-v="template">常見玩法模板</button>
      <button class="mm-tab" data-v="lift">高關聯組合</button>
      <button class="mm-tab" data-v="explore">指定機制展開</button>
    </div>
    <div id="mm-combo-note" class="mm-section-note"></div>
    <div id="mm-combo-ctrl2" class="mm-combo-ctrl" style="flex-wrap:wrap"></div>
    <div id="mm-combo-body"></div>`;

  const viewBtns=[...body.querySelectorAll('.mm-tab')];
  viewBtns.forEach(b=>b.addEventListener('click',()=>{
    viewBtns.forEach(x=>x.classList.remove('on'));b.classList.add('on');
    state.view=b.dataset.v;
    // 常見玩法模板預設依出現次數排序；高關聯組合預設依關聯強度排序
    state.sortBy=state.view==='lift'?'lift':'support';
    render();
  }));

  function scoreCell(label,v){return v!=null&&isFinite(Number(v))?`<span style="margin-right:8px">${label} <strong style="color:var(--am)">${Number(v).toFixed(1)}</strong></span>`:'';}

  function repGamesHtml(reps){
    if(!reps||!reps.length)return'<div style="color:var(--txd);font-size:12px">尚無代表遊戲</div>';
    return reps.map(g=>`<div class="mm-game-row"><span class="mm-game-name">${g.name}</span><span class="mm-game-sub">${g.provider||'—'} · ${g.year||'?'}</span><span style="font-size:11px;color:var(--txd);white-space:nowrap">${scoreCell('CGN',g.cgscore)}${scoreCell('SC',g.sc_rating)}${scoreCell('BWB',g.bwb_rating)}</span></div>`).join('');
  }

  function comboCard(it,rank){
    const colors=it.items.map(m=>ROLE_COLORS[roleOf(m)]||'var(--txd)');
    const bgs=it.items.map(m=>ROLE_BG[roleOf(m)]||'rgba(126,146,170,.10)');
    const tags=it.items.map((m,i)=>`<span class="mm-combo-tag" style="color:${colors[i]};background:${bgs[i]}">${m}</span>`).join('<span class="mm-combo-plus">+</span>');
    const dirEntries=Object.entries(it.coverage_detail||{}).sort((a,b)=>b[1]-a[1]);
    const dirHtml=dirEntries.map(([m,v])=>`<div style="display:flex;justify-content:space-between;font-size:11px;padding:2px 0"><span style="color:var(--txd)">缺 ${m} 時</span><span>${Math.round(v*100)}%</span></div>`).join('');
    const concentrated=it.top_provider_share>=0.8;
    const card=mk('div','mm-combo-card');
    card.style.cssText='padding:14px 16px';
    let html=`<div class="mm-combo-rank">#${rank}</div>`;
    html+=`<div class="mm-combo-tags">${tags}</div>`;
    const descTxt=comboDescription(it.items);
    if(descTxt)html+=`<div style="font-size:11px;color:var(--txd);margin-bottom:8px">${descTxt}</div>`;
    if(it.matched_archetype)html+=`<div style="display:inline-block;font-size:11px;color:var(--vi);background:rgba(155,126,248,.12);border:1px solid var(--vi);padding:2px 8px;border-radius:2px;margin-bottom:8px">疑似「${it.matched_archetype}」模板</div>`;
    if(it.is_subsumed)html+=`<div style="font-size:11px;color:var(--txd);background:var(--sfh);border-left:2px solid var(--bd);padding:4px 8px;margin-bottom:8px">完整組合優先／高度涵蓋：已被 ${it.subsumed_by.join(' + ')} 涵蓋</div>`;
    html+=`<div class="mm-combo-cnt">${it.support.toLocaleString()} 款</div>`;
    html+=`<div class="mm-combo-bar" style="margin-bottom:10px"><div style="height:100%;width:${Math.min(it.market_share*100*4,100)}%;background:var(--vi)"></div></div>`;
    html+=`<div class="mm-detail-stats" style="margin-bottom:10px">`;
    html+=`<div class="mm-stat-row"><span class="mm-stat-label">市場佔比</span><span class="mm-stat-val">${(it.market_share*100).toFixed(2)}%</span></div>`;
    html+=`<div class="mm-stat-row"><span class="mm-stat-label" title="卡片顯示各方向中的最低涵蓋率；展開可看各方向明細">最低方向涵蓋率</span><span class="mm-stat-val">${Math.round(it.coverage*100)}%</span></div>`;
    html+=`<div class="mm-stat-row"><span class="mm-stat-label">關聯強度 Lift</span><span class="mm-stat-val" style="color:var(--vi)">${it.lift!=null?it.lift.toFixed(2)+'×':'—'}</span></div>`;
    html+=`<div class="mm-stat-row"><span class="mm-stat-label">廠商數${concentrated?' ⚠':''}</span><span class="mm-stat-val" style="${concentrated?'color:var(--am)':''}">${it.provider_count}${concentrated?`（單廠商佔${Math.round(it.top_provider_share*100)}%）`:''}</span></div>`;
    html+=`<div class="mm-stat-row"><span class="mm-stat-label">近三年佔比</span><span class="mm-stat-val">${Math.round(it.recent_ratio*100)}%</span></div>`;
    html+=`</div>`;
    if(dirEntries.length>1){
      html+=`<details style="margin-bottom:10px"><summary style="font-size:11px;color:var(--txd);cursor:pointer">各方向涵蓋率明細</summary><div style="padding-top:4px">${dirHtml}</div></details>`;
    }
    if(it.relation_types&&it.relation_types.length){
      html+=`<div style="font-size:11px;color:var(--txd);margin-bottom:8px">內部關係：${it.relation_types.map(t=>REL_LABELS[t]||t).join('、')}</div>`;
    }
    html+=`<div class="mm-detail-section-title">代表遊戲</div><div class="mm-game-list">${repGamesHtml(it.representative_games)}</div>`;
    html+=`<div class="mm-detail-actions">`;
    html+=`<button class="mm-btn" data-act="matcher">跳轉競品反查</button>`;
    html+=`<button class="mm-btn" data-act="research">加入研究</button>`;
    html+=`<button class="mm-btn mm-btn-primary" data-act="prompt">複製組合研究Prompt</button>`;
    html+=`</div>`;
    card.innerHTML=html;

    card.querySelector('[data-act="matcher"]').addEventListener('click',()=>{
      navigator.clipboard?.writeText(it.items.join('、')).catch(()=>{});
      toast('已複製機制名稱，跳轉競品反查（機制詞彙非完全對應，需自行勾選）');
      nav('matcher');
    });
    card.querySelector('[data-act="research"]').addEventListener('click',()=>{
      const g=(it.representative_games||[])[0];
      if(!g){toast('尚無代表遊戲可加入');return;}
      wlAdd(g,{added_reason:'來自機制組合：'+comboLabel(it.items)});
    });
    card.querySelector('[data-act="prompt"]').addEventListener('click',e=>{
      const txt='## 機制組合研究：'+comboLabel(it.items)+'\n\n'
        +'組合大小：'+it.size+'\nSupport：'+it.support+' 款\n市場佔比：'+(it.market_share*100).toFixed(2)+'%\n'
        +'最低方向涵蓋率：'+Math.round(it.coverage*100)+'%\n關聯強度 Lift：'+(it.lift!=null?it.lift.toFixed(2):'—')+'×\n'
        +'廠商數：'+it.provider_count+'\n近三年佔比：'+Math.round(it.recent_ratio*100)+'%\n'
        +'代表遊戲：'+(it.representative_games||[]).map(g=>g.name).join('、')+'\n\n'
        +'請分析這個機制組合：\n1. 各機制在此組合中的功能分工\n2. 為什麼這些機制常一起使用\n'
        +'3. 玩家體驗節奏\n4. 是否適合作為成本估算/微調骨架\n5. 對FX/UI負擔的意涵\n'
        +'6. 這個組合值不值得進一步研究\n7. 共現數據是否可能有雜訊';
      navigator.clipboard?.writeText(txt).catch(()=>{});
      e.target.textContent='已複製';setTimeout(()=>{e.target.textContent='複製組合研究Prompt';},2000);
    });
    return card;
  }

  function applyFilters(items){
    let out=items;
    if(state.hideLowInfo)out=out.filter(it=>!it.low_information);
    if(state.hideSubsumed)out=out.filter(it=>!it.is_subsumed);
    if(state.view==='lift'){
      out=out.filter(it=>it.support>=state.minSupport&&it.lift!=null);
      if(state.hideConcentrated)out=out.filter(it=>it.top_provider_share<0.8);
    } else {
      out=out.filter(it=>it.support>=state.minSupport);
    }
    return out;
  }

  function sortItems(items){
    const key={support:'support',market_share:'market_share',lift:'lift',
      provider_count:'provider_count',recent_ratio:'recent_ratio'}[state.sortBy]||'support';
    return [...items].sort((a,b)=>(b[key]??-1)-(a[key]??-1));
  }

  function renderCtrl2(){
    const el=qs('#mm-combo-ctrl2');
    if(state.view==='explore'){
      const opts=mechList.filter(d=>knownSet.has(d.m)).sort((a,b)=>b.count-a.count)
        .map(d=>`<option value="${d.m}" ${state.exploreMech===d.m?'selected':''}>${d.m}</option>`).join('');
      el.innerHTML=`<span class="mm-ctrl-label">選擇機制</span><select id="mm-explore-sel" style="background:var(--sf);color:var(--tx);border:1px solid var(--bd);padding:5px 8px;font-family:inherit"><option value="">— 請選擇 —</option>${opts}</select>`;
      qs('#mm-explore-sel').addEventListener('change',function(){state.exploreMech=this.value;render();});
      return;
    }
    let html=`<span class="mm-ctrl-label">組合大小</span>`;
    [2,3,4].forEach(n=>{html+=`<button class="mm-chip${state.size===n?' on':''}" data-size="${n}">${n}項</button>`;});
    html+=`<span class="mm-ctrl-label" style="margin-left:12px">最低出現次數</span><input type="number" id="mm-min-sup" value="${state.minSupport}" min="1" style="width:64px;background:var(--sf);color:var(--tx);border:1px solid var(--bd);padding:4px 6px;font-family:inherit">`;
    html+=`<span class="mm-ctrl-label" style="margin-left:12px">排序</span><select id="mm-sort-sel" style="background:var(--sf);color:var(--tx);border:1px solid var(--bd);padding:5px 8px;font-family:inherit">`;
    html+=`<option value="support"${state.sortBy==='support'?' selected':''}>出現次數</option><option value="market_share"${state.sortBy==='market_share'?' selected':''}>市場佔比</option><option value="lift"${state.sortBy==='lift'?' selected':''}>關聯強度</option><option value="provider_count"${state.sortBy==='provider_count'?' selected':''}>廠商多樣性</option><option value="recent_ratio"${state.sortBy==='recent_ratio'?' selected':''}>近年比例</option></select>`;
    html+=`<label style="font-size:12px;color:var(--txd);margin-left:12px"><input type="checkbox" id="mm-hide-lowinfo" ${state.hideLowInfo?'checked':''}> 隱藏低資訊量組合</label>`;
    html+=`<label style="font-size:12px;color:var(--txd)"><input type="checkbox" id="mm-hide-subsumed" ${state.hideSubsumed?'checked':''}> 隱藏被涵蓋子組合</label>`;
    if(state.view==='lift')html+=`<label style="font-size:12px;color:var(--txd)"><input type="checkbox" id="mm-hide-concentrated" ${state.hideConcentrated?'checked':''}> 排除單一廠商高度集中</label>`;
    el.innerHTML=html;
    el.querySelectorAll('.mm-chip').forEach(b=>b.addEventListener('click',()=>{state.size=Number(b.dataset.size);render();}));
    qs('#mm-min-sup').addEventListener('change',function(){state.minSupport=Math.max(1,Number(this.value)||1);render();});
    qs('#mm-sort-sel').addEventListener('change',function(){state.sortBy=this.value;render();});
    qs('#mm-hide-lowinfo').addEventListener('change',function(){state.hideLowInfo=this.checked;render();});
    qs('#mm-hide-subsumed').addEventListener('change',function(){state.hideSubsumed=this.checked;render();});
    const hc=qs('#mm-hide-concentrated');if(hc)hc.addEventListener('change',function(){state.hideConcentrated=this.checked;render();});
  }

  function render(){
    renderCtrl2();
    const noteEl=qs('#mm-combo-note');
    const bodyEl=qs('#mm-combo-body');

    if(state.view==='explore'){
      if(!state.exploreMech){
        noteEl.textContent='選擇一個機制，查看它最常見的搭配組合、代表遊戲與趨勢。';
        bodyEl.innerHTML='<div class="mm-empty">請先選擇機制。</div>';
        return;
      }
      const m=state.exploreMech;
      const relatedPairs=sortItems(bySize[2].filter(it=>it.items.includes(m)));
      const relatedTriples=bySize[3].filter(it=>it.items.includes(m)).sort((a,b)=>b.support-a.support);
      const relatedQuads=bySize[4].filter(it=>it.items.includes(m)).sort((a,b)=>b.support-a.support);
      const byLift=[...relatedPairs].filter(it=>it.support>=20&&it.lift!=null).sort((a,b)=>b.lift-a.lift);
      noteEl.innerHTML=`<strong style="color:var(--am)">${m}</strong> 的組合關係：${relatedPairs.length} 組 2 項搭配、${relatedTriples.length} 組 3 項、${relatedQuads.length} 組 4 項。`;
      const grid=mk('div','mm-combo-grid');
      grid.style.gridTemplateColumns='repeat(auto-fill,minmax(360px,1fr))';
      [['最常見搭配（2項）',relatedPairs.slice(0,6)],['最強關聯（2項，support≥20）',byLift.slice(0,6)],
       ['常見3項組合',relatedTriples.slice(0,6)],['常見4項組合',relatedQuads.slice(0,6)]].forEach(([label,list])=>{
        if(!list.length)return;
        const secTitle=mk('div','mm-detail-section-title');secTitle.textContent=label;secTitle.style.cssText='grid-column:1/-1;margin-top:8px';
        grid.appendChild(secTitle);
        list.forEach((it,i)=>grid.appendChild(comboCard(it,i+1)));
      });
      bodyEl.innerHTML='';bodyEl.appendChild(grid);
      const linkRow=mk('div','');linkRow.style.cssText='margin-top:12px';
      const linkBtn=mk('button','mm-btn');linkBtn.textContent='跳轉競品反查（'+m+'）';
      linkBtn.addEventListener('click',()=>{navigator.clipboard?.writeText(m).catch(()=>{});toast('已複製機制名稱，跳轉競品反查');nav('matcher');});
      linkRow.appendChild(linkBtn);bodyEl.appendChild(linkRow);
      return;
    }

    const items=sortItems(applyFilters(bySize[state.size]||[]));
    const viewLabel=state.view==='lift'?'高關聯組合（依關聯強度排序）':'常見玩法模板（依出現次數排序）';
    noteEl.innerHTML=`${viewLabel} · 共 <strong style="color:var(--am)">${items.length}</strong> 組符合條件（${state.size}項組合，最低出現${state.minSupport}款）。`;
    if(!items.length){bodyEl.innerHTML='<div class="mm-empty">無符合條件的組合，試著調降最低出現次數或關閉篩選。</div>';return;}
    const grid=mk('div','mm-combo-grid');
    grid.style.gridTemplateColumns='repeat(auto-fill,minmax(360px,1fr))';
    items.forEach((it,i)=>grid.appendChild(comboCard(it,i+1)));
    bodyEl.innerHTML='';bodyEl.appendChild(grid);
  }

  render();
}

// ── Tab 5: 近年趨勢 ────────────────────────────────────────────────────────
function renderTrends(){
  const recentYears=yearKeys.slice(-5);
  if(recentYears.length<2){body.innerHTML='<div class="mm-section-note">年份資料不足，無法顯示趨勢。</div>';return;}
  const note=mk('div','mm-section-note');
  note.textContent=`顯示 ${recentYears[0]}–${recentYears[recentYears.length-1]} 各機制使用率（%=佔當年遊戲數比例）。`;
  const colTemplate=`160px 70px repeat(${recentYears.length},55px) 45px`;
  const tbl=mk('div','mm-trend-table');
  const hdrRow=mk('div','mm-trend-row mm-trend-hdr');
  hdrRow.style.gridTemplateColumns=colTemplate;
  let hdrHtml='<div class="mm-trend-name">機制</div><div class="mm-trend-cat">類別</div>';
  recentYears.forEach(y=>hdrHtml+=`<div class="mm-trend-yr">${y}</div>`);
  hdrHtml+='<div class="mm-trend-change">走勢</div>';
  hdrRow.innerHTML=hdrHtml;tbl.appendChild(hdrRow);
  const topMechs=mechList.filter(d=>d.count>=10).slice(0,25);
  topMechs.forEach(d=>{
    const catColor=CAT_COLORS[d.cat]||'var(--txd)';
    const trendData=D.mechanics_trend&&D.mechanics_trend[d.m];
    const row=mk('div','mm-trend-row');
    row.style.gridTemplateColumns=colTemplate;
    let html=`<div class="mm-trend-name" style="color:var(--tx)">${d.m}</div><div class="mm-trend-cat"><span style="color:${catColor};font-size:11px">${d.cat}</span></div>`;
    let prev=null,first=null,last=null;
    recentYears.forEach((y,i)=>{
      const yearTotal=D.years[y]?.count||1;
      const cnt=trendData?trendData[y]||d.years[y]||0:d.years[y]||0;
      const p=Math.round(cnt/yearTotal*100);
      if(i===0)first=p;last=p;
      const diff=prev!=null?p-prev:0;
      const col=i>0&&diff>3?'var(--gn)':i>0&&diff<-3?'var(--rd)':'var(--txm)';
      html+=`<div class="mm-trend-yr" style="color:${col}">${p}%</div>`;
      prev=p;
    });
    const delta=last!=null&&first!=null?last-first:0;
    const arrow=delta>5?'↑':delta<-5?'↓':'→';
    const arrowCol=delta>5?'var(--gn)':delta<-5?'var(--rd)':'var(--txm)';
    html+=`<div class="mm-trend-change" style="color:${arrowCol};font-size:16px;text-align:center">${arrow}</div>`;
    row.innerHTML=html;tbl.appendChild(row);
  });
  body.innerHTML='';body.appendChild(note);body.appendChild(tbl);
}

function renderFxImpact(){

    const gameSet=new Set();
    inData.forEach(m=>(mechMap[m]?.games||[]).forEach(g=>gameSet.add(g.name)));

      const g=D.games.find(g=>g.name===name);

    if(avgCgn!=null)html+=`<span class="mm-fx-burden-score">CGN均分 <strong style="color:var(--am)">${avgCgn.toFixed(1)}</strong></span>`;
    html+=`</div><div class="mm-fx-burden-desc">${cat.desc}</div>`;
    html+=`<div class="mm-fx-burden-tags">`;
    cat.mechs.forEach(m=>{
      const cnt=mechMap[m]?.count||0;
      const col=cnt>0?cat.color:'var(--txd)';
      html+=`<span class="mm-fx-burden-tag" style="color:${col};border-color:${col};opacity:${cnt>0?1:.35}">${m}${cnt>0?` <span class="mm-fx-burden-tag-cnt">${cnt}</span>`:''}</span>`;
    });
    html+=`</div>`;
    const fxDescs=inData.map(m=>MECH_DICT[m]?.fxImpact).filter(Boolean);
    if(fxDescs.length){

      html+=`</div>`;
    }
    sec.innerHTML=html;body.appendChild(sec);
  });

      if(cgn!=null)themeMap[t].cgns.push(cgn);
    });
  });
  const themeList=Object.entries(themeMap).map(([t,d])=>({t,count:d.count,avgCgn:avg(d.cgns)})).filter(d=>d.count>=5&&d.avgCgn!=null).sort((a,b)=>(b.avgCgn||0)-(a.avgCgn||0)).slice(0,25);
  if(themeList.length){
    const sub=mk('div','');sub.style.marginTop='28px';
    sub.innerHTML='<div class="mm-sub-title">參考：主題標籤 × CGN均分（非製作量分類）</div><div class="mm-section-note" style="margin-bottom:12px">以下為依主題標籤計算的CGN均分排行，不代表製作水準高低，僅供市場研究參考。</div>';
    const tbl=mk('div','mm-theme-table');
    const maxCgn=themeList[0]?.avgCgn||100;
    themeList.forEach(d=>{
      const row=mk('div','mm-theme-row');
      const barW=Math.round((d.avgCgn||0)/maxCgn*100);
      row.innerHTML=`<div class="mm-theme-name">${d.t}</div><div class="mm-theme-cnt">${d.count}</div><div class="mm-theme-bar-cell"><div class="mm-theme-bar" style="width:${barW}%;background:var(--am)"></div></div><div class="mm-theme-score">${d.avgCgn.toFixed(1)}</div>`;
      tbl.appendChild(row);
    });
    sub.appendChild(tbl);body.appendChild(sub);
  }
}

// ── Score Anatomy (評分來源解剖) ──────────────────────────────────────────────
(function(){
  const s=qs('#s-anatomy');
  const a=D.anatomy;

  function fmtScore100(v){if(v==null)return'—';const n=Number(v);if(!Number.isFinite(n))return'—';return n<=10?String(Math.round(n*10)):String(Math.round(n));}
  function scoreNum100(v){if(v==null)return null;const n=Number(v);if(!Number.isFinite(n))return null;return n<=10?n*10:n;}
  function fmtN(v){return v==null?'—':String(Math.round(v));}
  function median(arr){if(!arr.length)return null;const s=[...arr].sort((a,b)=>a-b);const m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2;}

  // Enrich all games with 0-100 scores
  const enriched=D.games.map(g=>{
    const cgn=scoreNum100(g.cgscore);
    const sc=scoreNum100(g.sc_rating);
    const bwb=scoreNum100(g.bwb_rating);
    const scores=[cgn,sc,bwb].filter(v=>v!=null);
    const gap=scores.length>=2?Math.max(...scores)-Math.min(...scores):null;
    const div=classifyDiv(cgn,sc,bwb,gap,scores.length);
    return{...g,cgn100:cgn,sc100:sc,bwb100:bwb,scoreGap:gap,divType:div.type,divLabel:div.label,srcCount:scores.length};
  });

  function classifyDiv(cgn,sc,bwb,gap,cnt){
    if(cnt===0)return{type:'no_data',label:'無資料'};
    if(cgn!=null&&cgn>=80&&sc!=null&&sc>=80&&bwb!=null&&bwb>=80)return{type:'all_high',label:'三方一致高'};
    if(sc!=null&&sc>=80&&(bwb==null||bwb<70))return{type:'high_exposure',label:'高曝光待驗證'};
    if(bwb!=null&&bwb>=80&&(sc==null||sc<70))return{type:'niche_high',label:'小眾高評價'};
    if(cgn!=null&&cgn>=85&&((bwb==null||bwb<75)||(sc==null||sc<75)))return{type:'cgn_inconsistent',label:'CGN高但評價不一致'};
    if(cnt>=2&&gap!=null&&gap>=25)return{type:'large_gap',label:'三方差異大'};
    return{type:'normal',label:'正常範圍'};
  }

  // Pre-compute source stats from D.games
  const cgnG=enriched.filter(g=>g.cgn100!=null);
  const scG=enriched.filter(g=>g.sc100!=null);
  const bwbG=enriched.filter(g=>g.bwb100!=null);
  const cgnV=cgnG.map(g=>g.cgn100);
  const scV=scG.map(g=>g.sc100);
  const bwbV=bwbG.map(g=>g.bwb100);
  const R3=new Set(['2024','2025','2026']);

  function avg(arr){return arr.length?Math.round(arr.reduce((a,b)=>a+b,0)/arr.length*10)/10:null;}
  function maxG(arr,key){return arr.reduce((b,g)=>g[key]>(b?b[key]:Number.NEGATIVE_INFINITY)?g:b,null);}
  function minG(arr,key){return arr.reduce((b,g)=>g[key]<(b?b[key]:Number.POSITIVE_INFINITY)?g:b,null);}

  const srcStats={
    cgn:{count:cgnG.length,missing:enriched.length-cgnG.length,
      avg:avg(cgnV),med:Math.round((median(cgnV)||0)*10)/10,
      max:maxG(cgnG,'cgn100'),min:minG(cgnG,'cgn100'),
      recent:cgnG.filter(g=>R3.has(String(g.year))).length},
    sc:{count:scG.length,missing:enriched.length-scG.length,
      avg:avg(scV),med:Math.round((median(scV)||0)*10)/10,
      max:maxG(scG,'sc100'),
      lowScHighCgn:scG.filter(g=>g.sc100<70&&g.cgn100>=80).length,
      recent:scG.filter(g=>R3.has(String(g.year))).length},
    bwb:{count:bwbG.length,missing:enriched.length-bwbG.length,
      avg:avg(bwbV),med:Math.round((median(bwbV)||0)*10)/10,
      high:bwbG.filter(g=>g.bwb100>=80).length,
      recent:bwbG.filter(g=>R3.has(String(g.year))).length,
      coverage:enriched.length?Math.round(bwbG.length/enriched.length*100):0},
  };

  // Tab state
  let activeTab='overview';
  let activeYear=null;

  // Main HTML shell
  s.innerHTML=`
    <div class="sh"><div class="st">評分來源解剖</div><div class="ss">比較 CGN、SlotCatalog、Bigwinboard 三種來源的評分差異，找出玩家投票、專業評價與資料缺口之間的落差。</div></div>
    <div class="sa-notice">評分分歧是研究線索，不是品質結論。CGN、SlotCatalog、BWB 的評分標準不同，不應直接平均成單一分數。</div>
    <div class="sa-tabs" id="sa-tabs"></div>
    <div id="sa-body"></div>`;

  const TABS=[
    {id:'overview',label:'來源總覽'},
    {id:'divergence',label:'分數分歧'},
    {id:'yearboard',label:'年份榜單'},
    {id:'outliers',label:'異常值 / 待人工檢查'},
    {id:'cooccur',label:'機制 / 題材共現'},
  ];

  const tabsEl=qs('#sa-tabs');
  TABS.forEach(t=>{
    const btn=mk('button','sa-tab'+(t.id===activeTab?' on':''));
    btn.dataset.t=t.id;btn.textContent=t.label;
    btn.onclick=()=>switchTab(t.id);
    tabsEl.appendChild(btn);
  });

  function switchTab(id){
    activeTab=id;
    tabsEl.querySelectorAll('.sa-tab').forEach(b=>b.classList.toggle('on',b.dataset.t===id));
    render();
  }

  function render(){
    const body=qs('#sa-body');
    body.innerHTML='';
    if(activeTab==='overview')renderOverview(body);
    else if(activeTab==='divergence')renderDivergence(body);
    else if(activeTab==='yearboard')renderYearboard(body);
    else if(activeTab==='outliers')renderOutliers(body);
    else if(activeTab==='cooccur')renderCooccur(body);
  }

  // ── 來源總覽 ──────────────────────────────────────────────────────────────────
  function renderOverview(body){
    const grid=mk('div','sa-source-grid');
    body.appendChild(grid);

    function srcCard(cfg){
      const el=mk('div','sa-src-card');
      el.innerHTML=`<div class="sa-src-title" style="color:${cfg.color}">${cfg.title}</div>
<div class="sa-src-note">${cfg.note}</div>
<div class="sa-src-stats">${cfg.stats.map(st=>`<div class="sa-src-stat"><span class="sa-src-stat-label">${st.label}</span><span class="sa-src-stat-val" style="color:${cfg.color}">${st.val}</span></div>`).join('')}</div>
${cfg.hl?`<div class="sa-src-hl">${cfg.hl.map(h=>`<div class="sa-src-hl-item"><span class="sa-src-hl-label">${h.label}</span><span class="sa-src-hl-name">${h.name}</span><span class="sa-src-hl-score" style="color:${h.col}">${h.score}</span></div>`).join('')}</div>`:''}`;
      return el;
    }

    grid.appendChild(srcCard({
      color:'var(--am)',title:'📊 CGN 數值吸引力',
      note:'偏向網站自家演算法，可能包含熱門度、RTP、Big Win potential，不等於純玩家口碑。',
      stats:[
        {label:'有資料遊戲數',val:srcStats.cgn.count.toLocaleString()},
        {label:'缺資料',val:srcStats.cgn.missing.toLocaleString()},
        {label:'平均值',val:fmtN(srcStats.cgn.avg)},
        {label:'中位數',val:fmtN(srcStats.cgn.med)},
        {label:'近三年資料數',val:srcStats.cgn.recent.toLocaleString()},
      ],
      hl:[
        srcStats.cgn.max?{label:'最高分',name:srcStats.cgn.max.name||'—',score:fmtN(srcStats.cgn.max.cgn100),col:'var(--gn)'}:null,
        srcStats.cgn.min?{label:'最低分',name:srcStats.cgn.min.name||'—',score:fmtN(srcStats.cgn.min.cgn100),col:'var(--rd)'}:null,
      ].filter(Boolean),
    }));

    grid.appendChild(srcCard({
      color:'var(--bl)',title:'⭐ SlotCatalog 玩家評分',
      note:'網站訪客自行投票的平均分數，樣本數普遍很小（中位數僅1票），與 CGN/BWB 幾乎無相關性（相關係數0.02-0.07），也不受廠商規模影響，不等於遊戲品質。',
      stats:[
        {label:'有資料遊戲數',val:srcStats.sc.count.toLocaleString()},
        {label:'缺資料',val:srcStats.sc.missing.toLocaleString()},
        {label:'平均值',val:fmtN(srcStats.sc.avg)},
        {label:'中位數',val:fmtN(srcStats.sc.med)},
        {label:'近三年資料數',val:srcStats.sc.recent.toLocaleString()},
        {label:'SC低但CGN高（< 70 & ≥ 80）',val:srcStats.sc.lowScHighCgn+'款'},
      ],
      hl:[
        srcStats.sc.max?{label:'最高分',name:srcStats.sc.max.name||'—',score:fmtN(srcStats.sc.max.sc100),col:'var(--bl)'}:null,
      ].filter(Boolean),
    }));

    const bwbCard=srcCard({
      color:'var(--gn)',title:'⭐ BWB 專業 / 社群評價',
      note:'偏向專業評測、玩家社群反應與站內互動趨勢，較適合觀察玩法、數學與社群接受度。',
      stats:[
        {label:'有資料遊戲數',val:srcStats.bwb.count.toLocaleString()},
        {label:'尚無 BWB 資料',val:srcStats.bwb.missing.toLocaleString()},
        {label:'覆蓋率',val:srcStats.bwb.coverage+'%'},
        {label:'平均值',val:fmtN(srcStats.bwb.avg)},
        {label:'中位數',val:fmtN(srcStats.bwb.med)},
        {label:'高評價 (≥ 80) 遊戲數',val:srcStats.bwb.high},
